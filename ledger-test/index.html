function sessionFormModal(existing){
  const s = existing || { id: uid('yts'), title:'', date: todayISO(), youtubeUrl:'', notes:'', traderId:'', createdBy: currentUserId() };
  const traderOptions = state.traders.map(t=>`<option value="${t.id}" ${s.traderId===t.id?'selected':''}>${t.pseudo}${t.isPublic===false?' (privé)':''}</option>`).join('');
  openModal({
    title: existing ? 'Modifier la session' : 'Nouvelle session live',
    bodyHtml: `
      <div class="field"><label>Titre</label><input id="sf-title" value="${s.title}" placeholder="Ex : Live trading NQ — session de New York"/></div>
      <div class="field-row">
        <div class="field"><label>Date</label><input id="sf-date" type="date" value="${s.date}"/></div>
        <div class="field"><label>Lien YouTube</label><input id="sf-url" value="${s.youtubeUrl}" placeholder="https://youtube.com/watch?v=…"/></div>
      </div>
      <div class="field"><label>Trader associé (optionnel)</label>
        <select id="sf-trader"><option value="">Aucun — session publique</option>${traderOptions}</select>
        <div class="field-hint">Si un trader privé est sélectionné, cette session ne sera visible que par toi et les admins. Laisse vide pour une session publique.</div>
      </div>
      <div id="sf-preview-wrap" style="margin:2px 0 14px;"></div>
      <div class="field"><label>Notes (optionnel)</label><textarea id="sf-notes" rows="5" placeholder="Ce qui s'est passé pendant la session, points à retenir, erreurs, setups pris…">${s.notes||''}</textarea></div>
      <div id="sf-error" class="error-text"></div>
    `,
    footHtml: `<button class="btn btn-outline" id="sf-cancel">Annuler</button><button class="btn btn-primary" id="sf-save">Enregistrer</button>`,
    onMount(){
      const previewWrap = document.getElementById('sf-preview-wrap');
      const urlInput = document.getElementById('sf-url');
      function updatePreview(){
        const id = extractYoutubeId(urlInput.value.trim());
        previewWrap.innerHTML = id
          ? `<img src="${youtubeThumbUrl(id)}" style="width:220px;max-width:100%;border-radius:8px;display:block;border:1px solid var(--border);"/>`
          : (urlInput.value.trim() ? `<div class="field-hint" style="color:var(--danger);">Lien YouTube non reconnu — vérifie le format (le miniature s'affichera si valide).</div>` : '');
      }
      urlInput.addEventListener('input', updatePreview);
      updatePreview();
      document.getElementById('sf-cancel').onclick = closeModal;
      document.getElementById('sf-save').onclick = async ()=>{
        const title = document.getElementById('sf-title').value.trim();
        const date = document.getElementById('sf-date').value;
        const youtubeUrl = document.getElementById('sf-url').value.trim();
        const notes = document.getElementById('sf-notes').value.trim();
        const traderId = document.getElementById('sf-trader').value || null;
        if(!title || !date || !youtubeUrl){
          document.getElementById('sf-error').textContent = 'Titre, date et lien YouTube sont obligatoires.'; return;
        }
        await upsert('yt_sessions', { ...s, title, date, youtubeUrl, notes, traderId });
        await logActivity(existing?'UPDATE':'CREATE', 'yt_session', s.id, title);
        showToast(existing ? 'Session mise à jour.' : 'Session ajoutée.');
        closeModal(); render();
      };
    }
  });
}

/* ============================================================
   VIEW: ADMIN (utilisateurs, rôles, journal d'activité)
============================================================ */
function viewAdmin(){
  const subs = state.allSubscriptions || [];
  const activeSubs = subs.filter(s=>s.status==='ACTIVE');
  const totalUsers = state.profiles.length;
  const premiumCount = state.profiles.filter(p=>p.role==='PREMIUM'||p.role==='ADMIN').length;
  const freeCount = totalUsers - premiumCount;
  const lifetimeCount = activeSubs.filter(s=>s.billingCycle==='LIFETIME' && s.plan==='PREMIUM').length;
  const cancelledCount = subs.filter(s=>s.status==='CANCELLED').length;

  // Hypothèse de prix par défaut pour le calcul MRR/ARR — ajuste selon tes prix Stripe réels.
  const PRICE_MONTHLY = 9;
  const PRICE_YEARLY = 90;
  const mrr = activeSubs.reduce((sum,s)=>{
    if(s.billingCycle==='MONTHLY') return sum + PRICE_MONTHLY;
    if(s.billingCycle==='YEARLY') return sum + (PRICE_YEARLY/12);
    return sum;
  }, 0);
  const arr = mrr * 12;
  const totalRevenue = activeSubs.reduce((sum,s)=>{
    if(s.billingCycle==='LIFETIME') return sum + PRICE_YEARLY*2; // approximation, adapte au vrai prix Lifetime
    return sum;
  }, 0) + mrr; // approximation simple, à affiner avec un vrai historique de paiements Stripe

  const lastSignups = [...state.profiles].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,5);

  const statCard = (label, value) => `
    <div class="panel" style="padding:14px 16px;">
      <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;">${label}</div>
      <div style="font-size:22px;font-weight:700;">${value}</div>
    </div>`;

  const dashboard = `
    <div class="panel-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;">
      ${statCard('Utilisateurs', totalUsers)}
      ${statCard('Premium', premiumCount)}
      ${statCard('Free', freeCount)}
      ${statCard('Lifetime', lifetimeCount)}
      ${statCard('MRR', fmtMoney(mrr))}
      ${statCard('ARR', fmtMoney(arr))}
      ${statCard('Revenus (approx.)', fmtMoney(totalRevenue))}
      ${statCard('Résiliations', cancelledCount)}
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-head"><div class="section-title">Dernières inscriptions</div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Email</th><th>Plan</th><th>Inscrit le</th></tr></thead>
          <tbody>
            ${lastSignups.length===0 ? `<tr><td colspan="3"><div class="empty-sub" style="padding:12px 0;">Aucune inscription.</div></td></tr>` :
              lastSignups.map(p=>`<tr>
                <td>${p.email||'—'}</td>
                <td><span class="badge ${p.role==='ADMIN'?'badge-gold':p.role==='PREMIUM'?'badge-gold':'badge-slate'}">${p.role}</span></td>
                <td class="text-dim mono">${p.createdAt?fmtDate(p.createdAt.slice(0,10)):'—'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;

  const usersTable = `
    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-head"><div class="section-title">Utilisateurs (${state.profiles.length})</div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Email</th><th>Plan</th><th>Formule</th><th>Inscrit le</th><th>Dernière connexion</th><th></th></tr></thead>
          <tbody>
            ${state.profiles.length===0 ? `<tr><td colspan="6"><div class="empty-sub" style="padding:16px 0;">Aucun utilisateur.</div></td></tr>` :
              state.profiles.map(p=>`<tr>
                <td>${p.email||'—'}${p.id===currentUserId()?' <span class="text-faint">(toi)</span>':''}</td>
                <td><span class="badge ${p.role==='ADMIN'?'badge-gold':p.role==='PREMIUM'?'badge-gold':'badge-slate'}">${p.role}</span></td>
                <td class="text-dim">${(p.role==='PREMIUM' && p.subscription && p.subscription.billingCycle) ? p.subscription.billingCycle : '—'}</td>
                <td class="text-dim mono">${p.createdAt?fmtDate(p.createdAt.slice(0,10)):'—'}</td>
                <td class="text-dim mono">${p.lastLogin?fmtDate(p.lastLogin.slice(0,10)):'—'}</td>
                <td style="display:flex;gap:6px;flex-wrap:wrap;">
                  ${p.id===currentUserId() || p.role==='ADMIN' ? '' : `
                    ${p.role!=='PREMIUM' ? `<button class="btn btn-outline btn-sm" data-set-plan="${p.id}" data-plan="PREMIUM" data-cycle="MONTHLY">Passer Premium</button>` : ''}
                    ${p.role!=='FREE' ? `<button class="btn btn-outline btn-sm" data-set-plan="${p.id}" data-plan="FREE" data-cycle="">Repasser Free</button>` : ''}
                    <button class="btn btn-outline btn-sm" data-set-plan="${p.id}" data-plan="PREMIUM" data-cycle="LIFETIME">Offrir Lifetime</button>
                    <button class="btn btn-outline btn-sm" style="color:var(--danger);border-color:var(--danger);" data-delete-user="${p.id}" data-email="${(p.email||'cet utilisateur').replace(/"/g,'&quot;')}">Supprimer</button>
                  `}
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;

  const logPanel = `
    <div class="panel">
      <div class="panel-head"><div class="section-title" style="display:flex;align-items:center;gap:7px;">${icon('clock')}Journal d\u2019activité (${state.activityLog.length})</div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Utilisateur</th><th>Action</th><th>Détail</th></tr></thead>
          <tbody>
            ${state.activityLog.length===0 ? `<tr><td colspan="4"><div class="empty-sub" style="padding:16px 0;">Aucune activité enregistrée pour l\u2019instant.</div></td></tr>` :
              state.activityLog.map(l=>`<tr>
                <td class="mono text-dim" style="white-space:nowrap;">${new Date(l.createdAt).toLocaleString('fr-FR')}</td>
                <td class="text-dim">${l.actorEmail||'—'}</td>
                <td><span class="badge badge-slate">${l.action}</span></td>
                <td class="text-dim">${l.description||''}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;

  return dashboard + usersTable + logPanel;
}

function viewSubscription(){
  const role = state.profile ? state.profile.role : 'FREE';
  const sub = state.subscription || { plan:'FREE', status:'ACTIVE', billingCycle:null };
  const isPremium = role==='PREMIUM' || role==='ADMIN';

  const statusLabelFr = { ACTIVE:'Actif', CANCELLED:'Annulé', EXPIRED:'Expiré' }[sub.status] || sub.status || '—';
  // On n'affiche une formule/cycle de facturation que pour un compte réellement Premium/Admin.
  // Ça évite d'afficher "Lifetime" pour un compte Free si une ligne "subscriptions" orpheline
  // (billing_cycle non nettoyé) traîne encore en base pour cet utilisateur.
  const cycleLabelFr = isPremium ? ({ MONTHLY:'Mensuel', YEARLY:'Annuel', LIFETIME:'Lifetime' }[sub.billingCycle] || '—') : '—';

  const currentPlanPanel = `
    <div class="panel" style="margin-bottom:16px;padding:20px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
        ${planBadgeHtml()}
        <div style="font-size:16px;font-weight:700;">${role==='ADMIN' ? 'Accès Admin (toutes fonctionnalités)' : (isPremium ? 'Formule Premium' : 'Formule Free')}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;font-size:13px;">
        <div><div class="text-faint" style="font-size:11px;text-transform:uppercase;margin-bottom:3px;">Statut</div>${statusLabelFr}</div>
        <div><div class="text-faint" style="font-size:11px;text-transform:uppercase;margin-bottom:3px;">Formule</div>${cycleLabelFr}</div>
        <div><div class="text-faint" style="font-size:11px;text-transform:uppercase;margin-bottom:3px;">Début</div>${sub.startedAt ? fmtDate(sub.startedAt.slice(0,10)) : '—'}</div>
        <div><div class="text-faint" style="font-size:11px;text-transform:uppercase;margin-bottom:3px;">Renouvellement</div>${(isPremium && sub.expiresAt) ? fmtDate(sub.expiresAt.slice(0,10)) : (isPremium && sub.billingCycle==='LIFETIME' ? 'Jamais (Lifetime)' : '—')}</div>
      </div>
      ${role!=='ADMIN' ? `
        <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
          ${sub.stripeCustomerId ? `<button class="btn btn-outline" onclick="openBillingPortal()">Portail Stripe (factures, résiliation, formule)</button>` : ''}
        </div>` : ''}
    </div>`;

  const cycle = state.filters.tarifs.cycle; // 'MONTHLY' | 'YEARLY'
  const premiumPrice = cycle==='YEARLY' ? PRICING.YEARLY : PRICING.MONTHLY;
  const currentCycle = sub.billingCycle;

  const checkItem = (label) => `<div style="display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:4px 0;"><span class="price-check" style="color:var(--accent);flex-shrink:0;margin-top:1px;">${icon('check')}</span><span>${label}</span></div>`;

  const freeFeatures = [
    'Trader(s) illimités',
    `${perms().maxFreeAccounts} comptes gratuits par trader`,
    'Sessions live illimitées',
    'Suivi des payouts',
    'Support communautaire',
  ];
  const premiumFeatures = [
    'Tout Free, plus :',
    'Comptes illimités par trader',
    'Import CSV / Excel',
    'Exports Excel & PDF',
    'Calendrier des mensualités',
    'Bilan visuel & statistiques avancées',
    'Classement',
    'Sauvegarde (backup)',
    'Support prioritaire',
  ];

  const planCard = ({ name, badge, price, priceNote, features, ctaLabel, ctaAction, highlight, gold, isCurrent }) => `
    <div class="panel" style="padding:20px;position:relative;${highlight?`border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);`:''}${gold?`border-color:var(--gold);`:''}">
      ${badge ? `<div style="position:absolute;top:-11px;left:20px;background:${gold?'var(--gold)':'var(--accent)'};color:${gold?'#1A130A':'var(--accent-text)'};font-size:10.5px;font-weight:700;padding:2px 10px;border-radius:100px;letter-spacing:.3px;">${badge}</div>` : ''}
      <div style="font-weight:700;font-size:15px;margin-bottom:4px;${gold?'color:var(--gold);':''}">${name}</div>
      <div style="display:flex;align-items:baseline;gap:4px;margin:10px 0 2px;">
        <span style="font-size:26px;font-weight:800;font-family:'Space Grotesk',sans-serif;">${price}</span>
        <span class="text-faint" style="font-size:12px;">${priceNote||''}</span>
      </div>
      <div style="height:14px;"></div>
      <div style="border-top:1px solid var(--border);padding-top:12px;margin-bottom:16px;">
        ${features.map(checkItem).join('')}
      </div>
      ${isCurrent
        ? `<div class="btn btn-outline" style="width:100%;text-align:center;opacity:.7;pointer-events:none;">✓ Formule actuelle</div>`
        : `<button class="btn ${gold||highlight?'btn-primary':'btn-outline'}" style="width:100%;" onclick="${ctaAction}">${ctaLabel}</button>`}
    </div>`;

  const plansPanel = role==='ADMIN' ? '' : `
    <div style="text-align:center;margin-bottom:20px;">
      <div class="section-title" style="margin-bottom:14px;">Formules disponibles</div>
      <div class="radio-group" style="display:inline-flex;">
        <div class="radio-chip ${cycle==='MONTHLY'?'selected':''}" data-tarifs-cycle="MONTHLY">Mensuel</div>
        <div class="radio-chip ${cycle==='YEARLY'?'selected':''}" data-tarifs-cycle="YEARLY">Annuel <span class="badge badge-accent" style="margin-left:4px;">-17%</span></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;align-items:start;">
      ${planCard({
        name:'Free', price:'0€', priceNote:'/mois',
        features: freeFeatures,
        isCurrent: !isPremium,
      })}
      ${planCard({
        name:'Premium', badge:'Populaire', highlight:true,
        price: `${premiumPrice.amount}€`,
        priceNote: premiumPrice.period + (cycle==='YEARLY' ? ` (soit ${PRICING.YEARLY.monthlyEquivalent}€/mois)` : ''),
        features: premiumFeatures,
        ctaLabel: cycle==='YEARLY' ? "S'abonner à l'année" : "S'abonner au mois",
        ctaAction: `startCheckout('${cycle}')`,
        isCurrent: isPremium && (currentCycle==='MONTHLY' || currentCycle==='YEARLY') && currentCycle===cycle,
      })}
      ${planCard({
        name:'Lifetime', badge:'Accès à vie', gold:true,
        price:`${PRICING.LIFETIME.amount}€`, priceNote: PRICING.LIFETIME.period,
        features: [...premiumFeatures, 'Aucun renouvellement, jamais'],
        ctaLabel:'Paiement unique',
        ctaAction:"startCheckout('LIFETIME')",
        isCurrent: currentCycle==='LIFETIME',
      })}
    </div>`;

  return currentPlanPanel + plansPanel;
}

    <div class="empty-sub" style="margin-bottom:16px;">${label} est réservé aux comptes Premium.</div>
    <button class="btn btn-primary upgrade-cta" onclick="openUpgradeModal('${label.replace(/'/g,"\\'")}')">🚀 Passer à Premium</button>
  </div>`;
}

/* ============================================================
   EVENT BINDING (delegated per-view)
============================================================ */
function bindViewEvents(){
  // Dashboard filters
  ['fd-trader','fd-firm','fd-month'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const map = { 'fd-trader':'trader', 'fd-firm':'propfirm', 'fd-month':'month' };
    el.addEventListener('change', ()=>{
      if(id==='fd-trader'){ setTraderFilterEverywhere(el.value); }
      else { state.filters.dashboard[map[id]] = el.value; }
      renderView();
    });
  });
  const fdClearBtn = document.getElementById('fd-clear');
  if(fdClearBtn) fdClearBtn.onclick = ()=>{ state.filters.dashboard = {trader:'',propfirm:'',month:''}; setTraderFilterEverywhere(''); renderView(); };
  document.querySelectorAll('[data-alert-acc]').forEach(row=>row.onclick=()=>{
    const acc = getAccount(row.dataset.alertAcc);
    if(!acc) return;
    state.route = 'accounts';
    state.filters.accounts = { q: acc.accountNumber, trader:'', propfirm:'', type:'', status:'' };
    render();
  });
  // Calendrier des mensualités
  document.querySelectorAll('[data-cal-day]').forEach(c=>c.onclick=()=>calendarDayModal(c.dataset.calDay));
  const calPrev = document.getElementById('cal-prev');
  if(calPrev) calPrev.onclick = ()=>{
    const mk = state.filters.calendrier.month || todayISO().slice(0,7);
    state.filters.calendrier.month = addMonths(mk+'-01', -1).slice(0,7);
    renderView();
  };
  const calNext = document.getElementById('cal-next');
  if(calNext) calNext.onclick = ()=>{
    const mk = state.filters.calendrier.month || todayISO().slice(0,7);
    state.filters.calendrier.month = addMonths(mk+'-01', 1).slice(0,7);
    renderView();
  };
  const calToday = document.getElementById('cal-today');
  if(calToday) calToday.onclick = ()=>{ state.filters.calendrier.month = ''; renderView(); };
  // Classement
  const lbMonth = document.getElementById('lb-month');
  if(lbMonth) lbMonth.addEventListener('change', ()=>{ state.filters.classement.month = lbMonth.value; renderView(); });
  const lbAllTime = document.getElementById('lb-alltime');
  if(lbAllTime) lbAllTime.onclick = ()=>{ state.filters.classement.allTime = !state.filters.classement.allTime; renderView(); };
  // Tarifs
  document.querySelectorAll('[data-tarifs-cycle]').forEach(c=>c.onclick=()=>{ state.filters.tarifs.cycle = c.dataset.tarifsCycle; renderView(); });
  // Traders
  document.querySelectorAll('[data-edit-trader]').forEach(b=>b.onclick=()=>traderFormModal(getTrader(b.dataset.editTrader)));
  document.querySelectorAll('[data-trader-badges]').forEach(b=>b.onclick=()=>traderBadgesModal(getTrader(b.dataset.traderBadges)));
  document.querySelectorAll('[data-trader-regularity]').forEach(b=>b.onclick=()=>traderRegularityModal(getTrader(b.dataset.traderRegularity)));
  document.querySelectorAll('[data-fix-ownership]').forEach(b=>b.onclick=()=>{
    const t = getTrader(b.dataset.fixOwnership);
    confirmModal(`Réattribuer tous les comptes et payouts de <strong>${t.pseudo}</strong> à son propriétaire (celui qui a créé sa fiche trader) ? Cela leur permettra de les modifier eux-mêmes.`, async ()=>{
      await fixTraderOwnership(t.id);
      renderView();
    }, false);
  });
  document.querySelectorAll('[data-del-trader]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.delTrader;
    const linkedAccounts = state.accounts.filter(a=>a.traderId===id);
    if(linkedAccounts.length>0){
      showToast(`Impossible de supprimer ce trader : ${linkedAccounts.length} compte(s) lié(s) (et leurs payouts/notes). Supprime ou réattribue d'abord ses comptes avant de supprimer le trader.`, 'danger');
      return;
    }
    confirmModal('Supprimer ce trader ?', async ()=>{
      const trd = getTrader(id);
      await remove('traders', id);
      await logActivity('DELETE', 'trader', id, trd?trd.pseudo:'');
      showToast('Trader supprimé.'); render();
    });
  });
  // Firms
  document.querySelectorAll('[data-edit-firm]').forEach(b=>b.onclick=()=>firmFormModal(getFirm(b.dataset.editFirm)));
  document.querySelectorAll('[data-del-firm]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.delFirm;
    const hasAccounts = state.accounts.some(a=>a.propFirmId===id);
    if(hasAccounts){ showToast('Impossible : des comptes utilisent cette PropFirm.', 'danger'); return; }
    confirmModal('Supprimer cette PropFirm ?', async ()=>{
      const fm = getFirm(id);
      await remove('propfirms', id);
      await logActivity('DELETE', 'propfirm', id, fm?fm.name:'');
      showToast('PropFirm supprimée.'); render();
    });
  });
  // Accounts filters
  ['f-q','f-trader','f-firm','f-type','f-status'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const map = { 'f-q':'q', 'f-trader':'trader', 'f-firm':'propfirm', 'f-type':'type', 'f-status':'status' };
    el.addEventListener(id==='f-q'?'input':'change', ()=>{
      if(id==='f-trader'){ setTraderFilterEverywhere(el.value); }
      else { state.filters.accounts[map[id]] = el.value; }
      if(id==='f-q'){
        const cursorPos = el.selectionStart;
        renderView();
        const newEl = document.getElementById('f-q');
        if(newEl){ newEl.focus(); newEl.setSelectionRange(cursorPos, cursorPos); }
      } else {
        renderView();
      }
    });
  });
  // Accounting filters
  ['fa-month','fa-type','fa-trader','fa-firm'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const map = { 'fa-month':'month', 'fa-type':'type', 'fa-trader':'trader', 'fa-firm':'propfirm' };
    el.addEventListener('change', ()=>{
      if(id==='fa-trader'){ setTraderFilterEverywhere(el.value); }
      else { state.filters.accounting[map[id]] = el.value; }
      renderView();
    });
  });
  const clearBtn = document.getElementById('fa-clear');
  if(clearBtn) clearBtn.onclick = ()=>{ state.filters.accounting = {month:'',type:'',trader:'',propfirm:''}; setTraderFilterEverywhere(''); renderView(); };
  document.querySelectorAll('[data-select-month]').forEach(row=>row.onclick=()=>{
    const mk = row.dataset.selectMonth;
    state.filters.accounting.month = (state.filters.accounting.month===mk) ? '' : mk; // re-clic = désélectionner
    renderView();
  });

  // Accounts actions
  document.querySelectorAll('[data-edit-account]').forEach(b=>b.onclick=()=>accountFormModal({ existing: getAccount(b.dataset.editAccount) }));
  document.querySelectorAll('[data-del-account]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.delAccount;
    confirmModal('Supprimer ce compte et ses payouts associés ?', async ()=>{
      const accDel = getAccount(id);
      const accDesc = accDel ? `${getTrader(accDel.traderId)?.pseudo||'—'} · ${getFirm(accDel.propFirmId)?.name||'—'}` : id;
      state.payouts = state.payouts.filter(p=>p.accountId!==id); // suppression en cascade gérée par la BDD
      await remove('accounts', id);
      await logActivity('DELETE', 'account', id, accDesc);
      showToast('Compte supprimé.'); render();
    });
  });
  document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>statusChangeModal(getAccount(b.dataset.acc), b.dataset.mark));
  document.querySelectorAll('[data-create-pa]').forEach(b=>b.onclick=()=>accountFormModal({ type:'PA', parentChallenge: getAccount(b.dataset.createPa) }));
  document.querySelectorAll('[data-to-live]').forEach(b=>b.onclick=()=>convertPaToLive(getAccount(b.dataset.toLive)));
  document.querySelectorAll('[data-payouts]').forEach(b=>b.onclick=()=>payoutsModal(getAccount(b.dataset.payouts)));
  document.querySelectorAll('[data-notes]').forEach(b=>b.onclick=()=>notesModal(getAccount(b.dataset.notes)));
  document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>statusHistoryModal(getAccount(b.dataset.history)));
  // Admin
  document.querySelectorAll('[data-set-plan]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.setPlan, plan = b.dataset.plan, cycle = b.dataset.cycle;
    const label = plan==='PREMIUM' ? (cycle==='LIFETIME' ? 'offrir une licence Premium Lifetime' : 'passer cet utilisateur en Premium') : 'repasser cet utilisateur en Free';
    confirmModal(`Confirmer : ${label} ?`, async ()=>{
      await setUserPlan(id, plan, cycle);
      renderView();
    }, plan==='FREE');
  });
  document.querySelectorAll('[data-delete-user]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.deleteUser, email = b.dataset.email;
    confirmModal(`Supprimer ${email} de la liste des utilisateurs ? Cela retire son profil (rôle, accès admin éventuel) de l'application, mais ne supprime pas son compte de connexion Supabase : il pourra encore se connecter en tant que simple utilisateur.`, async ()=>{
      await deleteUserProfile(id, email);
      renderView();
    }, true);
  });
  document.querySelectorAll('[data-jump-to]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const targetId = b.dataset.jumpTo;
    const el = document.getElementById('acc-'+targetId);
    if(!el){ showToast('Le compte lié n\u2019est pas visible avec les filtres actuels.', 'danger'); return; }
    el.style.setProperty('--flash-color', b.style.color);
    el.scrollIntoView({ behavior:'smooth', block:'center' });
    el.classList.add('flash-highlight');
    setTimeout(()=>el.classList.remove('flash-highlight'), 1600);
  });

  // Bilan Visuel filters
  ['fb-month','fb-trader'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const map = { 'fb-month':'month', 'fb-trader':'trader' };
    el.addEventListener('change', ()=>{
      if(id==='fb-trader'){ setTraderFilterEverywhere(el.value); }
      else { state.filters.bilan[map[id]] = el.value; }
      renderView();
    });
  });
  const fbClearBtn = document.getElementById('fb-clear');
  if(fbClearBtn) fbClearBtn.onclick = ()=>{ setTraderFilterEverywhere(''); renderView(); };
  document.querySelectorAll('[data-export-card]').forEach(b=>b.onclick=()=>{
    exportBilanCard(b.dataset.exportCard, b.dataset.exportName);
  });

  // Sessions Live filters + actions
  const fsQ = document.getElementById('fs-q');
  if(fsQ) fsQ.addEventListener('input', ()=>{ state.filters.sessions.q = fsQ.value; renderView(); });
  const fsClearBtn = document.getElementById('fs-clear');
  if(fsClearBtn) fsClearBtn.onclick = ()=>{ state.filters.sessions.q = ''; renderView(); };
  document.querySelectorAll('[data-edit-session]').forEach(b=>b.onclick=()=>{
    sessionFormModal(state.yt_sessions.find(x=>x.id===b.dataset.editSession));
  });
  document.querySelectorAll('[data-del-session]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.delSession;
    confirmModal('Supprimer cette session live et ses notes ?', async ()=>{
      const s = state.yt_sessions.find(x=>x.id===id);
      await remove('yt_sessions', id);
      await logActivity('DELETE', 'yt_session', id, s?s.title:'');
      showToast('Session supprimée.'); render();
    });
  });
}

/* ============================================================
   FORM: TRADER
============================================================ */
function traderFormModal(existing){
  const t = existing || { id: uid('trd'), firstName:'', lastName:'', pseudo:'', email: (state.session ? state.session.user.email : '') || '', status:'ACTIF', isPublic:true, createdBy: currentUserId() };
  openModal({
    title: existing ? 'Modifier le trader' : 'Nouveau trader',
    bodyHtml: `
      <div class="field-row">
        <div class="field"><label>Prénom</label><input id="tf-first" value="${t.firstName}"/></div>
        <div class="field"><label>Nom</label><input id="tf-last" value="${t.lastName}"/></div>
      </div>
      <div class="field"><label>Pseudo</label><input id="tf-pseudo" value="${t.pseudo}"/><div class="field-hint">Utilisé partout dans l'app pour identifier le trader.</div></div>
      <div class="field"><label>Email (optionnel)</label><input id="tf-email" value="${t.email||''}"/><div class="field-hint">Pré-rempli avec ton email de connexion pour rattacher ce trader à ton compte. Modifiable si besoin.</div></div>
      <div class="field"><label>Statut</label>
        <div class="radio-group">
          <div class="radio-chip ${t.status==='ACTIF'?'selected':''}" data-status="ACTIF">Actif</div>
          <div class="radio-chip ${t.status==='INACTIF'?'selected':''}" data-status="INACTIF">Inactif</div>
        </div>
        <div class="field-hint">Un trader inactif ne peut pas se voir attribuer de nouveau compte Challenge.</div>
      </div>
      <div class="field"><label>Visibilité</label>
        <div class="radio-group">
          <div class="radio-chip ${t.isPublic!==false?'selected':''}" data-visibility="public">Visible par tous</div>
          <div class="radio-chip ${t.isPublic===false?'selected':''}" data-visibility="private">Privé (visible uniquement par toi et les admins)</div>
        </div>
        <div class="field-hint">Contrôle qui peut voir ce trader, ses comptes, ses payouts et notes. Les sessions live liées à ce trader suivent aussi ce réglage.</div>
      </div>
      <div id="tf-error" class="error-text"></div>
    `,
    footHtml: `<button class="btn btn-outline" id="tf-cancel">Annuler</button><button class="btn btn-primary" id="tf-save">Enregistrer</button>`,
    onMount(){
      let status = t.status;
      let isPublic = t.isPublic!==false;
      document.querySelectorAll('[data-status]').forEach(chip=>chip.onclick=()=>{
        status = chip.dataset.status;
        document.querySelectorAll('[data-status]').forEach(c=>c.classList.toggle('selected', c.dataset.status===status));
      });
      document.querySelectorAll('[data-visibility]').forEach(chip=>chip.onclick=()=>{
        isPublic = chip.dataset.visibility==='public';
        document.querySelectorAll('[data-visibility]').forEach(c=>c.classList.toggle('selected', (c.dataset.visibility==='public')===isPublic));
      });
      document.getElementById('tf-cancel').onclick = closeModal;
      document.getElementById('tf-save').onclick = async ()=>{
        const firstName = document.getElementById('tf-first').value.trim();
        const lastName = document.getElementById('tf-last').value.trim();
        const pseudo = document.getElementById('tf-pseudo').value.trim();
        const email = document.getElementById('tf-email').value.trim();
        if(!firstName || !lastName || !pseudo){
          document.getElementById('tf-error').textContent = 'Prénom, nom et pseudo sont obligatoires.'; return;
        }
        const dup = state.traders.find(x=>x.pseudo.toLowerCase()===pseudo.toLowerCase() && x.id!==t.id);
        if(dup){ document.getElementById('tf-error').textContent = 'Ce pseudo est déjà utilisé.'; return; }
        await upsert('traders', { ...t, firstName, lastName, pseudo, email, status, isPublic });
        if(!existing) applyMyTraderDefaultFilters();
        await logActivity(existing?'UPDATE':'CREATE', 'trader', t.id, `${pseudo}${isPublic?'':' (privé)'}`);
        showToast(existing ? 'Trader mis à jour.' : 'Trader créé.');
        closeModal(); render();
      };
    }
  });
}

        closeModal(); render();
      };
    }
  });
}

/* ============================================================
   FORM: ACCOUNT (Challenge or PA)
============================================================ */
function accountFormModal({ existing, type, parentChallenge }){
  const isEdit = !!existing;
  // La limite de comptes gratuits est désormais par trader (et par utilisateur créateur) :
  // on ne peut plus la vérifier ici puisque le trader n'est pas encore choisi.
  // Voir la vérification faite dans af-save, juste avant l'enregistrement.
  const a = existing || {
    id: uid('acc'),
    traderId: parentChallenge ? parentChallenge.traderId : (myLinkedTrader() ? myLinkedTrader().id : ''),
    propFirmId: parentChallenge ? parentChallenge.propFirmId : '',
    type: type || 'CHALLENGE',
    parentChallengeId: parentChallenge ? parentChallenge.id : null,
    size: parentChallenge ? parentChallenge.size : 'S25K',
    customSize: parentChallenge ? parentChallenge.customSize : '',
    accountNumber: '',
    paymentType: 'UNIQUE',
    purchasePrice: '',
    monthlyAmount: '',
    purchaseDate: todayISO(),
    activationDate: todayISO(),
    activationFee: '',
    status: 'ACTIF',
    endDate: null,
    createdAt: new Date().toISOString(),
    createdBy: currentUserId(),
  };
  const lockTrader = !!parentChallenge;
  const lockType = !!parentChallenge || (type && !isEdit);
  if(state.traders.length===0 || state.propfirms.length===0){
    showToast('Crée d\u2019abord au moins un trader et une PropFirm.', 'danger');
    return;
  }

  openModal({
    title: isEdit ? 'Modifier le compte' : (parentChallenge ? 'Créer le PA' : 'Nouveau compte'),
    wide: true,
    bodyHtml: `
      ${parentChallenge ? `<div class="field-hint" style="margin-bottom:14px;">Ce PA sera relié au challenge réussi de <strong>${getTrader(parentChallenge.traderId).pseudo}</strong>.</div>` : ''}
      <div class="field-row">
        <div class="field"><label>Trader</label>
          <select id="af-trader" ${lockTrader?'disabled':''}>
            <option value="">— Sélectionner —</option>
            ${state.traders.map(t=>`<option value="${t.id}" ${a.traderId===t.id?'selected':''}>${t.pseudo}${t.status==='INACTIF'?' (inactif)':''}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>PropFirm</label>
          <div class="firm-picker" id="af-firm-picker" ${lockTrader?'style="opacity:.55;pointer-events:none;"':''}>
            ${sortedFirms().map(f=>`<div class="firm-pick ${a.propFirmId===f.id?'selected':''}" data-firm-pick="${f.id}">${firmLogoHtml(f,20)}<span>${f.name}</span></div>`).join('')}
          </div>
          <input type="hidden" id="af-firm" value="${a.propFirmId||''}"/>
        </div>
      </div>
      <div class="field"><label>Type de compte</label>
        <div class="radio-group">
          <div class="radio-chip ${a.type==='CHALLENGE'?'selected':''}" data-type="CHALLENGE" ${lockType?'style="opacity:.5;pointer-events:none;"':''}>Challenge</div>
          <div class="radio-chip ${a.type==='PA'?'selected':''}" data-type="PA" ${lockType?'style="opacity:.5;pointer-events:none;"':''}>PA</div>
          <div class="radio-chip ${a.type==='LIVE'?'selected':''}" data-type="LIVE" ${lockType?'style="opacity:.5;pointer-events:none;"':''}>Live</div>
        </div>
        ${isEdit && !lockType ? `<div class="field-hint">Modifiable si le type a été mal renseigné à la création. Vérifie les champs ci-dessous (date d\u2019achat/activation, statut) après changement.</div>` : ''}
      </div>
      <div class="field-row">
        <div class="field"><label>Taille du compte</label>
          <select id="af-size">
            ${Object.entries(SIZE_LABELS).map(([k,v])=>`<option value="${k}" ${a.size===k?'selected':''}>${v}</option>`).join('')}
          </select>
        </div>
        <div class="field" id="af-customsize-wrap" style="display:${a.size==='AUTRE'?'block':'none'};">
          <label>Montant personnalisé ($)</label><input id="af-customsize" type="number" value="${a.customSize||''}"/>
        </div>
      </div>
      <div class="field"><label>Numéro de compte</label><input id="af-number" value="${a.accountNumber}"/></div>
      <div class="field"><label>Mode de paiement</label>
        <div class="radio-group">
          <div class="radio-chip ${a.paymentType==='UNIQUE'?'selected':''}" data-pay="UNIQUE">Paiement unique</div>
          <div class="radio-chip ${a.paymentType==='MENSUEL'?'selected':''}" data-pay="MENSUEL">Mensualités</div>
        </div>
      </div>
      <div class="field-row">
        <div class="field" id="af-price-wrap" style="display:${a.paymentType==='UNIQUE'?'block':'none'};"><label>Prix d'achat ($)</label><input id="af-price" type="number" value="${a.purchasePrice||''}"/></div>
        <div class="field" id="af-monthly-wrap" style="display:${a.paymentType==='MENSUEL'?'block':'none'};"><label>Montant mensuel ($)</label><input id="af-monthly" type="number" value="${a.monthlyAmount||''}"/></div>
        <div class="field" id="af-purchase-date-wrap" style="display:${(a.type==='PA'||a.type==='LIVE')?'none':'block'};"><label>Date d'achat / d'ouverture</label><input id="af-date" type="date" value="${a.purchaseDate}"/></div>
      </div>
      <div id="af-pa-fields" style="display:${(a.type==='PA'||a.type==='LIVE')?'block':'none'};">
        <div class="field-row">
          <div class="field"><label>Date d'activation</label><input id="af-activation-date" type="date" value="${a.activationDate||todayISO()}"/><div class="field-hint">Sert aussi de date d'achat/ouverture du PA — les deux dates sont toujours identiques.</div></div>
          <div class="field"><label>Frais d'activation ($, optionnel)</label><input id="af-activation-fee" type="number" value="${a.activationFee||''}"/></div>
        </div>
        ${!parentChallenge ? `
        <div class="field">
          <label>Challenge d'origine (optionnel)</label>
          <select id="af-parent-challenge"><option value="">— Aucun / indépendant —</option></select>
          <div class="field-hint">Pour relier ce PA/Live au Challenge qu'il a réussi — utile notamment après un import où le lien n'a pas pu être détecté automatiquement.</div>
        </div>` : ''}
      </div>
      ${isEdit ? `
      <div class="field-row">
        <div class="field"><label>Statut</label>
          <select id="af-status">
            ${STATUS_OPTIONS_BY_TYPE[a.type].map(s=>`<option value="${s}" ${a.status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}
          </select>
        </div>
        <div class="field" id="af-enddate-wrap" style="display:${a.status==='ACTIF'?'none':'block'};">
          <label>Date de fin (réussite / breach / fermeture)</label>
          <input id="af-enddate" type="date" value="${a.endDate || todayISO()}"/>
        </div>
      </div>
      <div class="field-hint" style="margin-top:-6px;margin-bottom:14px;">Modifier le statut ici permet de revenir en arrière (ex: annuler un Breached) ou de corriger une date.</div>
      ` : ''}
      <div id="af-error" class="error-text"></div>
    `,
    footHtml: `<button class="btn btn-outline" id="af-cancel">Annuler</button><button class="btn btn-primary" id="af-save">Enregistrer</button>`,
    onMount(){
      let curType = a.type, curPay = a.paymentType, curSize = a.size;
      function refreshParentChallengeOptions(){
        const sel = document.getElementById('af-parent-challenge');
        if(!sel) return;
        const traderId = document.getElementById('af-trader').value;
        const prevValue = sel.value;
        const candidates = state.accounts.filter(x=>x.type==='CHALLENGE' && x.traderId===traderId && x.id!==a.id);
        sel.innerHTML = '<option value="">— Aucun / indépendant —</option>' + candidates.map(c=>
          `<option value="${c.id}" ${prevValue===c.id?'selected':''}>${getFirm(c.propFirmId)?.name||'?'} · ${sizeLabelRaw(c)} · ${c.accountNumber||'sans n°'} · ${STATUS_LABELS[c.status]||c.status}</option>`
        ).join('');
        if(!candidates.some(c=>c.id===prevValue)){
          sel.value = (isEdit && a.parentChallengeId && candidates.some(c=>c.id===a.parentChallengeId)) ? a.parentChallengeId : '';
        }
      }
      document.querySelectorAll('[data-type]').forEach(chip=>chip.onclick=()=>{
        if(lockType) return;
        curType = chip.dataset.type;
        document.querySelectorAll('[data-type]').forEach(c=>c.classList.toggle('selected', c.dataset.type===curType));
        document.getElementById('af-pa-fields').style.display = (curType==='PA'||curType==='LIVE') ? 'block' : 'none';
        document.getElementById('af-purchase-date-wrap').style.display = (curType==='PA'||curType==='LIVE') ? 'none' : 'block';
        if(curType==='PA'||curType==='LIVE') refreshParentChallengeOptions();
        const statusSelectEl = document.getElementById('af-status');
        if(statusSelectEl){
          const opts = STATUS_OPTIONS_BY_TYPE[curType];
          const keepCurrent = opts.includes(statusSelectEl.value);
          statusSelectEl.innerHTML = opts.map(s=>`<option value="${s}">${STATUS_LABELS[s]}</option>`).join('');
          statusSelectEl.value = keepCurrent ? statusSelectEl.value : opts[0];
          const terminal = statusSelectEl.value!=='ACTIF';
          document.getElementById('af-enddate-wrap').style.display = terminal ? 'block' : 'none';
        }
      });
      document.querySelectorAll('[data-pay]').forEach(chip=>chip.onclick=()=>{
        curPay = chip.dataset.pay;
        document.querySelectorAll('[data-pay]').forEach(c=>c.classList.toggle('selected', c.dataset.pay===curPay));
        document.getElementById('af-price-wrap').style.display = curPay==='UNIQUE' ? 'block' : 'none';
        document.getElementById('af-monthly-wrap').style.display = curPay==='MENSUEL' ? 'block' : 'none';
      });
      document.getElementById('af-size').onchange = (e)=>{
        curSize = e.target.value;
        document.getElementById('af-customsize-wrap').style.display = curSize==='AUTRE' ? 'block' : 'none';
      };
      const traderSelect = document.getElementById('af-trader');
      if(!lockTrader) traderSelect.onchange = refreshParentChallengeOptions;
      if(!lockTrader){
        document.querySelectorAll('[data-firm-pick]').forEach(el=>el.onclick=()=>{
          document.querySelectorAll('[data-firm-pick]').forEach(x=>x.classList.remove('selected'));
          el.classList.add('selected');
          document.getElementById('af-firm').value = el.dataset.firmPick;
        });
      }
      if(curType==='PA'||curType==='LIVE') refreshParentChallengeOptions();
      const statusSelect = document.getElementById('af-status');
      if(statusSelect) statusSelect.onchange = (e)=>{
        const terminal = e.target.value!=='ACTIF';
        document.getElementById('af-enddate-wrap').style.display = terminal ? 'block' : 'none';
      };
      document.getElementById('af-cancel').onclick = closeModal;
      document.getElementById('af-save').onclick = async ()=>{
        const traderId = document.getElementById('af-trader').value;
        const propFirmId = document.getElementById('af-firm').value;
        const accountNumber = document.getElementById('af-number').value.trim();
        const errorEl = document.getElementById('af-error');
        if(!traderId || !propFirmId || !accountNumber){ errorEl.textContent = 'Trader, PropFirm et numéro de compte sont obligatoires.'; return; }
        if(!isEdit && !perms().canUnlimitedAccounts){
          const ownAccountsForTrader = state.accounts.filter(x=>x.traderId===traderId && x.createdBy===currentUserId()).length;
          if(ownAccountsForTrader >= perms().maxFreeAccounts){
            closeModal();
            openUpgradeModal(`La création de plus de ${perms().maxFreeAccounts} comptes pour ce trader`);
            return;
          }
        }
        const trader = getTrader(traderId);
        if(curType==='CHALLENGE' && trader.status==='INACTIF' && !isEdit){
          errorEl.textContent = 'Impossible : ce trader est inactif. Réactive-le pour créer un nouveau challenge.'; return;
        }
        const size = document.getElementById('af-size').value;
        const customSize = size==='AUTRE' ? Number(document.getElementById('af-customsize').value)||0 : null;
        const purchasePrice = curPay==='UNIQUE' ? Number(document.getElementById('af-price').value)||0 : null;
        const monthlyAmount = curPay==='MENSUEL' ? Number(document.getElementById('af-monthly').value)||0 : null;
        let activationDate = a.activationDate, activationFee = a.activationFee, purchaseDate;
        if(curType==='PA' || curType==='LIVE'){
          activationDate = document.getElementById('af-activation-date').value;
          activationFee = Number(document.getElementById('af-activation-fee').value)||0;
          purchaseDate = activationDate; // règle métier : pour un PA/Live, date d'achat = date d'activation
        } else {
          purchaseDate = document.getElementById('af-date').value;
        }
        let status = a.status, endDate = a.endDate;
        if(isEdit){
          status = document.getElementById('af-status').value;
          const terminal = status!=='ACTIF';
          endDate = terminal ? (document.getElementById('af-enddate').value || todayISO()) : null;
        }
        let parentChallengeId = a.parentChallengeId || null;
        if(curType==='CHALLENGE'){
          parentChallengeId = null;
        } else if(!parentChallenge){
          const parentSel = document.getElementById('af-parent-challenge');
          parentChallengeId = parentSel ? (parentSel.value || null) : null;
        }
        const record = {
          ...a, traderId, propFirmId, type:curType, size, customSize,
          accountNumber, paymentType:curPay, purchasePrice, monthlyAmount,
          purchaseDate, activationDate: (curType==='PA'||curType==='LIVE')?activationDate:null, activationFee: (curType==='PA'||curType==='LIVE')?activationFee:null,
          status, endDate, parentChallengeId,
        };
        await upsert('accounts', record);
        const accDesc = `${trader.pseudo} · ${getFirm(propFirmId)?.name||''} · ${TYPE_LABELS[curType]}`;
        await logActivity(isEdit?'UPDATE':'CREATE', 'account', a.id, accDesc);
        if(isEdit && status !== a.status){
          await logStatusChange(a.id, a.status, status, 'Modifié via le formulaire du compte');
        }

        // If this PA was created from a challenge, mark the parent challenge as REUSSI
        if(parentChallenge && !isEdit){
          const parent = getAccount(parentChallenge.id);
          await upsert('accounts', { ...parent, status:'REUSSI', endDate: activationDate });
          await logStatusChange(parent.id, parent.status, 'REUSSI', 'PA créé à partir de ce challenge');
        }
        showToast(isEdit ? 'Compte mis à jour.' : 'Compte créé.');
        closeModal(); render();
      };
    }
  });
}

/* ============================================================
   REÇU PDF (payout)
============================================================ */
function generatePayoutReceipt(acc, trader, payout){
  if(!window.jspdf){ showToast('Librairie PDF indisponible (réseau bloqué ?).', 'danger'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const firm = getFirm(acc.propFirmId);
  doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.text('Reçu de payout', 48, 60);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(120);
  doc.text('Le Trading Contrarien Academy — Ledger PropFirm Desk', 48, 78);
  doc.setDrawColor(220); doc.line(48, 92, 547, 92);

  doc.setFontSize(11); doc.setTextColor(30);
  const rows = [
    ['Trader', trader ? trader.pseudo : '—'],
    ['PropFirm', firm ? firm.name : '—'],
    ['Type de compte', TYPE_LABELS[acc.type] || acc.type],
    ['N° de compte', maskAccountNumber(acc.accountNumber).replace(/<[^>]+>/g,'')],
    ['Date du payout', fmtDate(payout.date)],
    ['Note', payout.note || '—'],
  ];
  let y = 122;
  rows.forEach(([k,v])=>{
    doc.setFont('helvetica','bold'); doc.text(k, 48, y);
    doc.setFont('helvetica','normal'); doc.text(String(v), 200, y);
    y += 22;
  });
  y += 14;
  doc.setDrawColor(220); doc.line(48, y, 547, y);
  y += 34;
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Montant versé :', 48, y);
  doc.setTextColor(20,140,110);
  doc.text(fmtMoney(payout.amount), 220, y);
  doc.setTextColor(150); doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text(`Généré le ${fmtDate(todayISO())} — document à usage interne, non fiscal.`, 48, 780);

  doc.save(`recu_payout_${(trader?trader.pseudo:'trader')}_${payout.date}.pdf`);
}

/* ============================================================
   IMPORT PROPDESK (JSON) — Admin uniquement
   Lit l'export JSON de l'app Lovable "PropDesk", fait correspondre
   traders/PropFirms existants, relie les payouts aux bons comptes,
   et affiche un aperçu à cocher (par trader, comptes dessous) avec
   avertissements avant toute écriture en base.
============================================================ */
function pickPropDeskFile(){
  if(!isAdmin()){ showToast("Réservé aux administrateurs.", 'danger'); return; }
  const input = document.getElementById('propdesk-file-input');
  input.value = '';
  input.onchange = ()=>{
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      let json;
      try{ json = JSON.parse(reader.result); }
      catch(e){ showToast('Fichier JSON invalide : ' + e.message, 'danger'); return; }
      if(!json || (!Array.isArray(json.traders) && !Array.isArray(json.accounts))){
        showToast("Ce fichier ne ressemble pas à un export PropDesk (clés attendues : traders, propfirms, accounts, payouts).", 'danger');
        return;
      }
      try{
        const plan = buildImportPlan(json);
        openImportPropDeskModal(plan);
      }catch(e){
        showToast("Erreur lors de l'analyse du fichier : " + e.message, 'danger');
      }
    };
    reader.onerror = ()=> showToast('Impossible de lire le fichier.', 'danger');
    reader.readAsText(file);
  };
  input.click();
}

// Construit le plan de correspondance (traders / propfirms / comptes / payouts)
// sans écrire quoi que ce soit en base — pur calcul, pour l'aperçu.
function buildImportPlan(json){
  const norm = (s)=> (s||'').toString().trim().toLowerCase();

  const traderByPseudo = new Map(state.traders.map(t=>[norm(t.pseudo), t]));
  const firmByName = new Map(state.propfirms.map(f=>[norm(f.name), f]));

  const tradersPlan = [];
  const tradersByKey = new Map();
  function ensureTraderPlan(pseudo, src){
    const key = norm(pseudo);
    if(!key) return null;
    if(tradersByKey.has(key)) return tradersByKey.get(key);
    const existing = traderByPseudo.get(key);
    const plan = {
      pseudo: (src && src.pseudo) || pseudo,
      firstName: (src && src.firstName) || '',
      lastName: (src && src.lastName) || '',
      email: (src && src.email) || '',
      status: (src && src.status) || 'ACTIF',
      existing, isNew: !existing,
    };
    tradersPlan.push(plan); tradersByKey.set(key, plan);
    return plan;
  }
  (json.traders||[]).forEach(t=>ensureTraderPlan(t.pseudo, t));

  const firmsPlan = [];
  const firmsByKey = new Map();
  function ensureFirmPlan(name, src){
    const key = norm(name);
    if(!key) return null;
    if(firmsByKey.has(key)) return firmsByKey.get(key);
    const existing = firmByName.get(key);
    const plan = {
      name: (src && src.name) || name,
      website: (src && src.website) || '',
      notes: (src && src.notes) || '',
      existing, isNew: !existing,
    };
    firmsPlan.push(plan); firmsByKey.set(key, plan);
    return plan;
  }
  (json.propfirms||[]).forEach(f=>ensureFirmPlan(f.name, f));

  const existingAccKey = (a)=> [a.traderId,a.propFirmId,a.type,a.size,norm(a.accountNumber),a.purchaseDate||''].join('|');
  const existingKeys = new Set(state.accounts.map(existingAccKey));

  const accountsPlan = (json.accounts||[]).map((a, idx)=>{
    const traderPlan = ensureTraderPlan(a.traderPseudo, null) || ensureTraderPlan('(inconnu)', {pseudo:a.traderPseudo||'(inconnu)'});
    const firmPlan = ensureFirmPlan(a.propFirmName, null) || ensureFirmPlan('(inconnue)', {name:a.propFirmName||'(inconnue)'});
    const isDuplicate = !!(traderPlan.existing && firmPlan.existing &&
      existingKeys.has([traderPlan.existing.id, firmPlan.existing.id, a.type, a.size, norm(a.accountNumber), a.purchaseDate||''].join('|')));
    return { idx, raw:a, traderPlan, firmPlan, isDuplicate };
  });

  const payoutsPlan = (json.payouts||[]).map((p)=>{
    const accNum = norm(p.accountNumber);
    let matchedIdx = null;
    if(accNum){
      const hit = accountsPlan.find(ap=> norm(ap.raw.traderPseudo)===norm(p.traderPseudo) && norm(ap.raw.accountNumber)===accNum);
      if(hit) matchedIdx = hit.idx;
    }
    return { raw:p, matchedIdx };
  });

  // Regroupement par trader, uniquement les traders ayant au moins un compte importable
  const groupsByKey = new Map();
  accountsPlan.forEach(ap=>{
    const key = norm(ap.traderPlan.pseudo);
    if(!groupsByKey.has(key)) groupsByKey.set(key, { traderPlan: ap.traderPlan, accounts: [] });
    groupsByKey.get(key).accounts.push(ap);
  });
  const traderGroups = [...groupsByKey.values()].sort((a,b)=>a.traderPlan.pseudo.localeCompare(b.traderPlan.pseudo,'fr',{sensitivity:'base'}));

  return {
    exportedAt: json.exportedAt || null,
    tradersPlan, firmsPlan, accountsPlan, payoutsPlan, traderGroups,
  };
}

function importPropDeskSummaryHtml(plan){
  const newTraders = plan.traderGroups.filter(g=>g.traderPlan.isNew).length;
  const newFirms = new Set(plan.accountsPlan.filter(a=>a.firmPlan.isNew).map(a=>norm2(a.firmPlan.name))).size;
  const dupCount = plan.accountsPlan.filter(a=>a.isDuplicate).length;
  const matchedPayouts = plan.payoutsPlan.filter(p=>p.matchedIdx!=null).length;
  const unmatchedPayouts = plan.payoutsPlan.length - matchedPayouts;

  let warnings = '';
  if(dupCount>0){
    const items = plan.accountsPlan.filter(a=>a.isDuplicate).slice(0,20).map(a=>
      `<li>${a.traderPlan.pseudo} · ${a.firmPlan.name} · ${TYPE_LABELS[a.raw.type]||a.raw.type} · ${a.raw.accountNumber||'sans n°'}</li>`).join('');
    warnings += `<div class="import-warn">
      <div class="import-warn-title">${icon('alertTriangle')}${dupCount} compte(s) déjà présent(s) dans l'application</div>
      <div>Ces comptes semblent déjà exister (même trader, même PropFirm, même type/taille/n°). Ils sont décochés par défaut pour éviter les doublons — coche-les manuellement si tu veux forcer l'import quand même.</div>
      <ul>${items}</ul>
    </div>`;
  }
  if(unmatchedPayouts>0){
    const items = plan.payoutsPlan.filter(p=>p.matchedIdx==null).slice(0,20).map(p=>
      `<li>${p.raw.traderPseudo||'—'} · n° ${p.raw.accountNumber||'(vide)'} · ${fmtMoney(p.raw.amount)} le ${p.raw.date||'—'}</li>`).join('');
    warnings += `<div class="import-warn danger">
      <div class="import-warn-title">${icon('alertTriangle')}${unmatchedPayouts} payout(s) non relié(s) à un compte</div>
      <div>Aucun compte correspondant (trader + n° de compte) n'a été trouvé dans l'export pour ces payouts. Ils seront ignorés.</div>
      <ul>${items}</ul>
    </div>`;
  }

  const summary = `<div class="import-summary">
    <div class="chip">Traders : <b>${plan.traderGroups.length}</b> concerné(s), <b id="import-new-traders-count">${newTraders}</b> nouveau(x)</div>
    <div class="chip">PropFirms : <b>${newFirms}</b> nouvelle(s)</div>
    <div class="chip">Comptes : <b>${plan.accountsPlan.length}</b>, dont <b>${dupCount}</b> doublon(s) probable(s)</div>
    <div class="chip">Payouts : <b>${matchedPayouts}</b> relié(s), <b>${unmatchedPayouts}</b> non relié(s)</div>
  </div>`;

  return summary + warnings;
}
function norm2(s){ return (s||'').toString().trim().toLowerCase(); }

function importPropDeskChecklistHtml(plan){
  if(plan.traderGroups.length===0){
    return `<div class="import-empty">Aucun compte à importer dans ce fichier.</div>`;
  }
  const existingTradersSorted = [...state.traders].sort((a,b)=>a.pseudo.localeCompare(b.pseudo,'fr',{sensitivity:'base'}));
  return plan.traderGroups.map(g=>{
    const rows = g.accounts.map(ap=>{
      const a = ap.raw;
      const payoutCount = plan.payoutsPlan.filter(p=>p.matchedIdx===ap.idx).length;
      const badges = [];
      if(ap.isDuplicate) badges.push(`<span class="badge badge-gold">Doublon probable</span>`);
      else badges.push(`<span class="badge badge-accent">Nouveau</span>`);
      if(ap.firmPlan.isNew) badges.push(`<span class="badge badge-slate">PropFirm nouvelle</span>`);
      if(payoutCount>0) badges.push(`<span class="badge badge-slate">${payoutCount} payout(s)</span>`);
      return `<div class="import-acc-row ${ap.isDuplicate?'is-dup':''}">
        <input type="checkbox" data-import-acc="${ap.idx}" ${ap.isDuplicate?'':'checked'} />
        <div class="import-acc-main">
          <div>${firmLogoHtml(ap.firmPlan.existing||{name:ap.firmPlan.name},16)} ${ap.firmPlan.name} · ${TYPE_LABELS[a.type]||a.type} · ${sizeLabelRaw(a)} ${badges.join(' ')}</div>
          <div class="import-acc-sub">N° ${a.accountNumber||'—'} · ${STATUS_LABELS[a.status]||a.status} · achat ${fmtDate(a.purchaseDate)}</div>
        </div>
      </div>`;
    }).join('');
    const key = norm2(g.traderPlan.pseudo);
    const options = [`<option value="__new__" ${g.traderPlan.isNew?'selected':''}>+ Créer un nouveau trader "${g.traderPlan.pseudo}"</option>`]
      .concat(existingTradersSorted.map(t=>
        `<option value="${t.id}" ${(!g.traderPlan.isNew && g.traderPlan.existing && g.traderPlan.existing.id===t.id)?'selected':''}>→ Rattacher à : ${t.pseudo}${(t.firstName||t.lastName)?` (${t.firstName||''} ${t.lastName||''})`.trim():''}</option>`
      )).join('');
    return `<div class="import-trader-group" data-import-trader="${key}">
      <div class="import-trader-head">
        <input type="checkbox" data-import-trader-toggle="${key}" checked />
        <span class="import-trader-name">${g.traderPlan.pseudo}</span>
        <span class="import-trader-badge" data-import-trader-badge="${key}"></span>
        <select class="import-trader-map" data-import-trader-map="${key}" style="margin-left:8px;max-width:280px;font-size:12px;padding:4px 8px;" onclick="event.stopPropagation()">
          ${options}
        </select>
        <span class="import-trader-count">${g.accounts.length} compte(s)</span>
      </div>
      <div class="import-acc-list">${rows}</div>
    </div>`;
  }).join('');
}
function sizeLabelRaw(a){ return a.size==='AUTRE' ? fmtMoney(a.customSize) : (SIZE_LABELS[a.size]||a.size); }

function openImportPropDeskModal(plan){
  openModal({
    title: 'Importer un export PropDesk',
    wide: 'xwide',
    bodyHtml: `
      <div class="field-hint" style="margin-bottom:14px;">
        ${plan.exportedAt ? `Export généré le ${new Date(plan.exportedAt).toLocaleString('fr-FR')}.` : ''}
        Sélectionne les comptes à importer ci-dessous (coche/décoche un trader pour basculer tous ses comptes).
        Rien n'est écrit en base tant que tu n'as pas cliqué sur « Importer la sélection ».
      </div>
      ${importPropDeskSummaryHtml(plan)}
      <div id="import-checklist">${importPropDeskChecklistHtml(plan)}</div>
      <div id="import-error" class="error-text"></div>
    `,
    footHtml: `
      <span id="import-selected-count" class="field-hint" style="margin-right:auto;align-self:center;"></span>
      <button class="btn btn-outline" id="import-cancel">Annuler</button>
      <button class="btn btn-primary" id="import-confirm">Importer la sélection</button>
    `,
    onMount(){
      const root = document.getElementById('import-checklist');

      function updateTraderToggleState(pseudoKey){
        const group = root.querySelector(`.import-trader-group[data-import-trader="${CSS.escape(pseudoKey)}"]`);
        if(!group) return;
        const boxes = [...group.querySelectorAll('[data-import-acc]')];
        const toggle = group.querySelector('[data-import-trader-toggle]');
        const checkedCount = boxes.filter(b=>b.checked).length;
        toggle.checked = checkedCount>0 && checkedCount===boxes.length;
        toggle.indeterminate = checkedCount>0 && checkedCount<boxes.length;
      }
      function updateSelectedCount(){
        const total = root.querySelectorAll('[data-import-acc]').length;
        const checked = [...root.querySelectorAll('[data-import-acc]')].filter(b=>b.checked).length;
        document.getElementById('import-selected-count').textContent = `${checked} / ${total} compte(s) sélectionné(s)`;
      }
      function updateTraderBadge(key){
        const select = root.querySelector(`[data-import-trader-map="${CSS.escape(key)}"]`);
        const badge = root.querySelector(`[data-import-trader-badge="${CSS.escape(key)}"]`);
        if(!select || !badge) return;
        badge.innerHTML = select.value==='__new__'
          ? `<span class="badge badge-accent">Nouveau trader</span>`
          : `<span class="badge badge-slate">Rattaché à un trader existant</span>`;
      }
      function updateNewTraderCount(){
        const total = [...root.querySelectorAll('[data-import-trader-map]')].filter(s=>s.value==='__new__').length;
        const el = document.getElementById('import-new-traders-count');
        if(el) el.textContent = total;
      }

      root.querySelectorAll('[data-import-trader-toggle]').forEach(toggle=>{
        toggle.addEventListener('change', ()=>{
          const key = toggle.dataset.importTraderToggle;
          const group = root.querySelector(`.import-trader-group[data-import-trader="${CSS.escape(key)}"]`);
          group.querySelectorAll('[data-import-acc]').forEach(b=>{ b.checked = toggle.checked; });
          updateSelectedCount();
        });
      });
      root.querySelectorAll('[data-import-acc]').forEach(box=>{
        box.addEventListener('change', ()=>{
          const group = box.closest('.import-trader-group');
          updateTraderToggleState(group.dataset.importTrader);
          updateSelectedCount();
        });
      });
      root.querySelectorAll('[data-import-trader-map]').forEach(select=>{
        select.addEventListener('change', ()=>{
          updateTraderBadge(select.dataset.importTraderMap);
          updateNewTraderCount();
        });
        updateTraderBadge(select.dataset.importTraderMap);
      });
      root.querySelectorAll('.import-trader-group').forEach(g=>updateTraderToggleState(g.dataset.importTrader));
      updateSelectedCount();
      updateNewTraderCount();

      document.getElementById('import-cancel').onclick = closeModal;
      document.getElementById('import-confirm').onclick = async ()=>{
        const btn = document.getElementById('import-confirm');
        const selected = [...root.querySelectorAll('[data-import-acc]')].filter(b=>b.checked);
        if(selected.length===0){
          document.getElementById('import-error').textContent = 'Sélectionne au moins un compte à importer.';
          return;
        }
        const traderMapOverrides = new Map();
        root.querySelectorAll('[data-import-trader-map]').forEach(select=>{
          traderMapOverrides.set(select.dataset.importTraderMap, select.value);
        });
        btn.disabled = true;
        const original = btn.textContent;
        try{
          const result = await runPropDeskImport(plan, selected.map(b=>Number(b.dataset.importAcc)), traderMapOverrides);
          await logActivity('IMPORT', 'propdesk', 'import_'+Date.now(),
            `Import PropDesk : ${result.createdTraders} trader(s), ${result.createdFirms} propfirm(s), ${result.createdAccounts} compte(s), ${result.createdPayouts} payout(s) créés.`);
          showToast(`Import terminé : ${result.createdAccounts} compte(s) et ${result.createdPayouts} payout(s) importés.`);
          closeModal();
          if(state.route==='admin') loadAdminView(); else render();
        }catch(e){
          document.getElementById('import-error').textContent = "Erreur pendant l'import : " + e.message;
          btn.disabled = false; btn.textContent = original;
        }
      };
    }
  });
}

// Écrit réellement en base les traders / propfirms / comptes / payouts sélectionnés.
// traderMapOverrides : Map(cléTraderNormalisée -> id trader existant choisi, ou '__new__')
async function runPropDeskImport(plan, selectedIdxs, traderMapOverrides){
  const traderIdCache = new Map();
  const ownerIdCache = new Map();
  const firmIdCache = new Map();
  let createdTraders=0, createdFirms=0, createdAccounts=0, createdPayouts=0;

  for(const idx of selectedIdxs){
    const ap = plan.accountsPlan.find(x=>x.idx===idx);
    if(!ap) continue;
    const tKey = norm2(ap.traderPlan.pseudo);
    let traderId = traderIdCache.get(tKey);
    let ownerId = ownerIdCache.get(tKey);
    if(!traderId){
      const override = traderMapOverrides && traderMapOverrides.get(tKey);
      if(override && override!=='__new__'){
        // Rattaché manuellement à un trader existant du site (nom différent de l'export)
        traderId = override;
        const ownerTrader = state.traders.find(t=>t.id===override);
        ownerId = (ownerTrader && ownerTrader.createdBy) || currentUserId();
      } else if(!override && ap.traderPlan.existing){
        // Pas de sélection explicite (ne devrait pas arriver) : on retombe sur la correspondance automatique
        traderId = ap.traderPlan.existing.id;
        ownerId = ap.traderPlan.existing.createdBy || currentUserId();
      } else {
        const newTrader = {
          id: uid('trd'),
          firstName: ap.traderPlan.firstName || ap.traderPlan.pseudo,
          lastName: ap.traderPlan.lastName || '',
          pseudo: ap.traderPlan.pseudo,
          email: ap.traderPlan.email || '',
          status: ap.traderPlan.status==='INACTIF' ? 'INACTIF' : 'ACTIF',
          createdBy: currentUserId(),
        };
        await upsert('traders', newTrader);
        traderId = newTrader.id;
        ownerId = newTrader.createdBy;
        ap.traderPlan.existing = newTrader; // pour les prochains comptes du même trader
        createdTraders++;
      }
      traderIdCache.set(tKey, traderId);
      ownerIdCache.set(tKey, ownerId);
    }

    const fKey = norm2(ap.firmPlan.name);
    let firmId = firmIdCache.get(fKey);
    if(!firmId){
      if(ap.firmPlan.existing){
        firmId = ap.firmPlan.existing.id;
      } else {
        const newFirm = { id: uid('pf'), name: ap.firmPlan.name, website:'', notes:'', createdBy: currentUserId() };
        await upsert('propfirms', newFirm);
        firmId = newFirm.id;
        ap.firmPlan.existing = newFirm;
        createdFirms++;
      }
      firmIdCache.set(fKey, firmId);
    }

    const a = ap.raw;
    const newAccount = {
      id: uid('acc'),
      traderId, propFirmId: firmId,
      type: a.type, parentChallengeId: null,
      size: a.size, customSize: a.customSize || null,
      accountNumber: a.accountNumber || '',
      paymentType: a.paymentType || 'UNIQUE',
      purchasePrice: Number(a.purchasePrice)||0,
      monthlyAmount: (a.monthlyAmount!=null && a.monthlyAmount!=='') ? Number(a.monthlyAmount) : null,
      purchaseDate: a.purchaseDate || todayISO(),
      activationDate: a.activationDate || null,
      activationFee: Number(a.activationFee)||0,
      status: a.status,
      endDate: a.endDate || null,
      createdAt: new Date().toISOString(),
      createdBy: currentUserId(),
    };
    await upsert('accounts', newAccount);
    ap._createdAccountId = newAccount.id;
    createdAccounts++;
  }

  for(const p of plan.payoutsPlan){
    if(p.matchedIdx==null) continue;
    const ap = plan.accountsPlan.find(x=>x.idx===p.matchedIdx);
    if(!ap || !ap._createdAccountId) continue; // compte non sélectionné pour l'import
    const newPayout = {
      id: uid('pay'),
      accountId: ap._createdAccountId,
      amount: Number(p.raw.amount)||0,
      date: p.raw.paidDate || p.raw.date || todayISO(),
      note: p.raw.note || '',
      createdAt: new Date().toISOString(),
      createdBy: currentUserId(),
    };
    await upsert('payouts', newPayout);
    createdPayouts++;
  }

  return { createdTraders, createdFirms, createdAccounts, createdPayouts };
}

/* ============================================================
   SAUVEGARDE COMPLÈTE (JSON) — Admin
============================================================ */
function exportGlobalBackup(){
  const backup = {
    exportedAt: new Date().toISOString(),
    traders: state.traders,
    propfirms: state.propfirms,
    accounts: state.accounts,
    payouts: state.payouts,
    profiles: state.profiles,
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `sauvegarde_ledger_${todayISO()}.json`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  showToast('Sauvegarde JSON téléchargée.');
}

/* ============================================================
   BOOT
============================================================ */
(async function boot(){
  if(!SUPABASE_CONFIGURED){
    document.getElementById('loading').innerHTML = `
      <div style="max-width:480px;text-align:center;padding:0 20px;">
        <div style="font-size:15px;font-weight:600;color:var(--text,#E8EDF2);margin-bottom:10px;">Configuration Supabase requise</div>
        <div style="font-size:13px;line-height:1.6;color:#8B98A5;">
          Ouvre le fichier <code>propfirm-app.html</code>, cherche <code>SUPABASE_URL</code> et <code>SUPABASE_ANON_KEY</code>
          tout en haut du script, et remplace-les par les valeurs de ton projet Supabase
          (Project Settings &gt; API). Voir le README fourni pour les étapes complètes.
        </div>
      </div>`;
    return;
  }
  let appStarted = false;
  async function enterApp(session){
    state.session = session;
    await loadProfile();
    await loadSubscription();
    computePermissions();
    await loadAll();
    applyMyTraderDefaultFilters();
    appStarted = true;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app-root').style.display = 'flex';
    render();
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if(session && !appStarted){ enterApp(session); }
    else if(session && appStarted){ state.session = session; }
    else if(!session){
      appStarted = false;
      state.session = null; state.profile = null; state.subscription = null; state.permissions = null;
      state.traders = []; state.propfirms = []; state.accounts = []; state.payouts = [];
      document.getElementById('app-root').style.display = 'none';
      renderAuthScreen();
    }
  });

  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session){ await enterApp(session); }
  else { renderAuthScreen(); }
})();
