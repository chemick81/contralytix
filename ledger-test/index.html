/* ============================================================
   EVENT BINDING (delegated per-view)
============================================================ */
function bindViewEvents(){
  // Manuel: sommaire (scroll fluide) + lien vers la page confidentialité
  document.querySelectorAll('[data-manual-anchor]').forEach(a=>{
    a.onclick = (e)=>{
      e.preventDefault();
      const target = document.getElementById(a.dataset.manualAnchor);
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    };
  });
  document.querySelectorAll('#view-root [data-nav]').forEach(a=>{
    a.onclick = (e)=>{ e.preventDefault(); state.route = a.dataset.nav; render(); };
  });
  // Dashboard filters
  ['fd-firm','fd-month'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const map = { 'fd-firm':'propfirm', 'fd-month':'month' };
    el.addEventListener('change', ()=>{
      state.filters.dashboard[map[id]] = el.value;
      renderView();
    });
  });
  bindMultiSelectDropdown('fd-trader', state.filters.dashboard, 'trader', 'traderMenuOpen', (arr)=>setTraderFilterEverywhere(arr));
  const fdClearBtn = document.getElementById('fd-clear');
  if(fdClearBtn) fdClearBtn.onclick = ()=>{ state.filters.dashboard = {trader:[],propfirm:'',month:'',traderMenuOpen:false}; setTraderFilterEverywhere([]); renderView(); };
  document.querySelectorAll('[data-delay-detail]').forEach(tile=>{
    tile.onclick = ()=>openDelayDetailModal(tile.dataset.delayDetail);
  });
  document.querySelectorAll('[data-alert-acc]').forEach(row=>row.onclick=()=>{
    const acc = getAccount(row.dataset.alertAcc);
    if(!acc) return;
    state.route = 'accounts';
    state.filters.accounts = { q: acc.accountNumber, trader:'', propfirm:'', type:'', status:[], statusMenuOpen:false };
    render();
  });
  // Météo NQ
  if(document.getElementById('nsdq-load')) document.getElementById('nsdq-load').onclick = loadNasdaqEarnings;
  document.querySelectorAll('[data-edit-prep]').forEach(b=>b.onclick=()=>{
    const p = state.market_prep.find(x=>x.id===b.dataset.editPrep);
    if(p) prepFormModal(p);
  });
  document.querySelectorAll('[data-del-prep]').forEach(b=>b.onclick=()=>{
    confirmModal('Supprimer cette prépa de séance ?', async ()=>{
      const ok = await remove('market_prep', b.dataset.delPrep);
      if(ok){ showToast('Prépa supprimée.'); renderView(); }
    });
  });
  // Calendrier
  document.querySelectorAll('[data-cal-day]').forEach(c=>c.onclick=()=>calendarDayModal(c.dataset.calDay));
  bindMultiSelectDropdown('cal-trader', state.filters.calendrier, 'trader', 'traderMenuOpen', (arr)=>setTraderFilterEverywhere(arr));
  const calPrev = document.getElementById('cal-prev');
  if(calPrev) calPrev.onclick = ()=>{
    const mk = state.filters.calendrier.month || todayISO().slice(0,7);
    state.filters.calendrier.month = addMonths(mk+'-01', -1).slice(0,7);
    renderView();
  };
  const calNext = document.getElementById('cal-next');
  if(calNext) calNext.onclick = ()=>{
    const mk = state.filters.calendrier.month || todayISO().slice(0,7);
    state.filters.calendrier.month = addMonths(mk+'-01', 1).slice(0,7);
    renderView();
  };
  const calToday = document.getElementById('cal-today');
  if(calToday) calToday.onclick = ()=>{ state.filters.calendrier.month = ''; renderView(); };
  // Classement
  const lbMonth = document.getElementById('lb-month');
  if(lbMonth) lbMonth.addEventListener('change', ()=>{ state.filters.classement.month = lbMonth.value; renderView(); });
  const lbAllTime = document.getElementById('lb-alltime');
  if(lbAllTime) lbAllTime.onclick = ()=>{ state.filters.classement.allTime = !state.filters.classement.allTime; renderView(); };
  // Tarifs
  document.querySelectorAll('[data-tarifs-cycle]').forEach(c=>c.onclick=()=>{ state.filters.tarifs.cycle = c.dataset.tarifsCycle; renderView(); });
  const promoInput = document.getElementById('promo-code-input');
  if(promoInput){
    promoInput.addEventListener('input', ()=>{ state.filters.tarifs.promoInput = promoInput.value; });
    promoInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') document.getElementById('promo-apply-btn').click(); });
  }
  const promoApplyBtn = document.getElementById('promo-apply-btn');
  if(promoApplyBtn) promoApplyBtn.onclick = async ()=>{
    const code = state.filters.tarifs.promoInput || '';
    promoApplyBtn.disabled = true; promoApplyBtn.textContent = '…';
    state.filters.tarifs.promoResult = await validatePromoCode(code);
    renderView();
  };
  const promoNewBtn = document.getElementById('promo-new-btn');
  if(promoNewBtn) promoNewBtn.onclick = ()=>promoCodeFormModal();
  document.querySelectorAll('[data-edit-promo]').forEach(b=>b.onclick=()=>promoCodeFormModal(getPromo(b.dataset.editPromo)));
  document.querySelectorAll('[data-del-promo]').forEach(b=>b.onclick=()=>{
    const p = getPromo(b.dataset.delPromo);
    confirmModal(`Supprimer le code promo "${p ? p.code : ''}" ?`, async ()=>{
      await remove('promo_codes', b.dataset.delPromo);
      await loadPromoCodesAdmin();
      showToast('Code promo supprimé.'); renderView();
    });
  });
  // Traders
  document.querySelectorAll('[data-edit-trader]').forEach(b=>b.onclick=()=>traderFormModal(getTrader(b.dataset.editTrader)));
  document.querySelectorAll('[data-trader-badges]').forEach(b=>b.onclick=()=>traderBadgesModal(getTrader(b.dataset.traderBadges)));
  document.querySelectorAll('[data-trader-regularity]').forEach(b=>b.onclick=()=>traderRegularityModal(getTrader(b.dataset.traderRegularity)));
  document.querySelectorAll('[data-assign-owner]').forEach(b=>b.onclick=()=>{
    assignTraderOwnerModal(getTrader(b.dataset.assignOwner));
  });
  document.querySelectorAll('[data-fix-ownership]').forEach(b=>b.onclick=()=>{
    const t = getTrader(b.dataset.fixOwnership);
    confirmModal(`Réattribuer tous les comptes et payouts de <strong>${t.pseudo}</strong> à son propriétaire (celui qui a créé sa fiche trader) ? Cela leur permettra de les modifier eux-mêmes.`, async ()=>{
      await fixTraderOwnership(t.id);
      renderView();
    }, false);
  });
  document.querySelectorAll('[data-del-trader]').forEach(b=>b.onclick=()=>{
    deleteTraderModal(getTrader(b.dataset.delTrader));
  });
  // Firms
  document.querySelectorAll('[data-edit-firm]').forEach(b=>b.onclick=()=>firmFormModal(getFirm(b.dataset.editFirm)));
  document.querySelectorAll('[data-del-firm]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.delFirm;
    const hasAccounts = state.accounts.some(a=>a.propFirmId===id);
    if(hasAccounts){ showToast('Impossible : des comptes utilisent cette PropFirm.', 'danger'); return; }
    confirmModal('Supprimer cette PropFirm ?', async ()=>{
      const fm = getFirm(id);
      await remove('propfirms', id);
      await logActivity('DELETE', 'propfirm', id, fm?fm.name:'');
      showToast('PropFirm supprimée.'); render();
    });
  });
  // Accounts filters
  ['f-q','f-firm','f-type'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const map = { 'f-q':'q', 'f-firm':'propfirm', 'f-type':'type' };
    el.addEventListener(id==='f-q'?'input':'change', ()=>{
      state.filters.accounts[map[id]] = el.value;
      if(id==='f-q'){
        const cursorPos = el.selectionStart;
        renderView();
        const newEl = document.getElementById('f-q');
        if(newEl){ newEl.focus(); newEl.setSelectionRange(cursorPos, cursorPos); }
      } else {
        renderView();
      }
    });
  });
  bindMultiSelectDropdown('f-trader', state.filters.accounts, 'trader', 'traderMenuOpen', (arr)=>setTraderFilterEverywhere(arr));
  // Accounts filters — statut (multichoix)
  const statusBtn = document.getElementById('f-status-btn');
  if(statusBtn){
    statusBtn.onclick = (e)=>{
      e.stopPropagation();
      state.filters.accounts.statusMenuOpen = !state.filters.accounts.statusMenuOpen;
      renderView();
    };
    document.querySelectorAll('[data-status-opt]').forEach(cb=>{
      cb.onclick = (e)=>e.stopPropagation();
      cb.onchange = ()=>{
        const v = cb.dataset.statusOpt;
        const arr = state.filters.accounts.status;
        const idx = arr.indexOf(v);
        if(cb.checked && idx===-1) arr.push(v);
        else if(!cb.checked && idx!==-1) arr.splice(idx,1);
        renderView();
      };
    });
    const statusMenu = document.getElementById('f-status-menu');
    if(statusMenu) statusMenu.onclick = (e)=>e.stopPropagation();
    const statusClear = document.getElementById('f-status-clear');
    if(statusClear) statusClear.onclick = (e)=>{
      e.stopPropagation();
      state.filters.accounts.status = [];
      renderView();
    };
    // Ferme le menu au clic ailleurs (une seule fois par ouverture de menu)
    if(state.filters.accounts.statusMenuOpen){
      setTimeout(()=>{
        document.addEventListener('click', function closeStatusMenu(){
          state.filters.accounts.statusMenuOpen = false;
          renderView();
          document.removeEventListener('click', closeStatusMenu);
        }, { once:true });
      }, 0);
    }
  }
  // Accounting filters
  ['fa-month','fa-type','fa-firm'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const map = { 'fa-month':'month', 'fa-type':'type', 'fa-firm':'propfirm' };
    el.addEventListener('change', ()=>{
      state.filters.accounting[map[id]] = el.value;
      renderView();
    });
  });
  bindMultiSelectDropdown('fa-trader', state.filters.accounting, 'trader', 'traderMenuOpen', (arr)=>setTraderFilterEverywhere(arr));
  const clearBtn = document.getElementById('fa-clear');
  if(clearBtn) clearBtn.onclick = ()=>{ state.filters.accounting = {month:'',type:'',trader:[],propfirm:'',traderMenuOpen:false}; setTraderFilterEverywhere([]); renderView(); };
  document.querySelectorAll('[data-select-month]').forEach(row=>row.onclick=()=>{
    const mk = row.dataset.selectMonth;
    state.filters.accounting.month = (state.filters.accounting.month===mk) ? '' : mk; // re-clic = désélectionner
    renderView();
  });

  // Accounts actions
  document.querySelectorAll('[data-edit-account]').forEach(b=>b.onclick=()=>accountFormModal({ existing: getAccount(b.dataset.editAccount) }));
  document.querySelectorAll('[data-del-account]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.delAccount;
    confirmModal('Supprimer ce compte et ses payouts associés ?', async ()=>{
      try{
        const accDel = getAccount(id);
        const accDesc = accDel ? `${getTrader(accDel.traderId)?.pseudo||'—'} · ${getFirm(accDel.propFirmId)?.name||'—'}` : id;
        const paysToDelete = state.payouts.filter(p=>p.accountId===id);
        for(const p of paysToDelete){ await remove('payouts', p.id); }
        await detachChildAccounts(id);
        await purgeStatusHistory(id);
        const ok = await remove('accounts', id);
        if(!ok) return; // remove() a déjà affiché le toast d'erreur
        await logActivity('DELETE', 'account', id, accDesc);
        showToast('Compte supprimé.'); render();
      }catch(e){
        showToast('Erreur de suppression : ' + e.message, 'danger');
      }
    });
  });
  document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>statusChangeModal(getAccount(b.dataset.acc), b.dataset.mark));
  document.querySelectorAll('[data-create-pa]').forEach(b=>b.onclick=()=>accountFormModal({ type:'PA', parentChallenge: getAccount(b.dataset.createPa) }));
  document.querySelectorAll('[data-to-live]').forEach(b=>b.onclick=()=>convertPaToLive(getAccount(b.dataset.toLive)));
  document.querySelectorAll('[data-payouts]').forEach(b=>b.onclick=()=>payoutsModal(getAccount(b.dataset.payouts)));
  document.querySelectorAll('[data-notes]').forEach(b=>b.onclick=()=>notesModal(getAccount(b.dataset.notes)));
  document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>statusHistoryModal(getAccount(b.dataset.history)));
  // Admin
  document.querySelectorAll('[data-set-plan]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.setPlan, plan = b.dataset.plan, cycle = b.dataset.cycle;
    const label = plan==='PREMIUM' ? (cycle==='LIFETIME' ? 'offrir une licence Premium Lifetime' : 'passer cet utilisateur en Premium') : 'repasser cet utilisateur en Free';
    confirmModal(`Confirmer : ${label} ?`, async ()=>{
      await setUserPlan(id, plan, cycle);
      renderView();
    }, plan==='FREE');
  });
  document.querySelectorAll('[data-delete-user]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.deleteUser, email = b.dataset.email;
    confirmModal(`Supprimer ${email} de la liste des utilisateurs ? Cela retire son profil (rôle, accès admin éventuel) de l'application, mais ne supprime pas son compte de connexion Supabase : il pourra encore se connecter en tant que simple utilisateur.`, async ()=>{
      await deleteUserProfile(id, email);
      renderView();
    }, true);
  });
  // Comparatif : tri des colonnes au clic sur l'en-tête (même clé -> inverse le sens,
  // nouvelle clé -> tri descendant par défaut, sauf pour le nom de PropFirm -> croissant).
  document.querySelectorAll('[data-sort-comparatif]').forEach(th=>th.onclick=()=>{
    const key = th.dataset.sortComparatif;
    const f = state.filters.comparatif;
    if(f.sortKey===key){ f.sortDir = f.sortDir==='asc' ? 'desc' : 'asc'; }
    else { f.sortKey = key; f.sortDir = key==='name' ? 'asc' : 'desc'; }
    renderView();
  });
  // Admin : gestion des pages visibles
  document.querySelectorAll('[data-toggle-page]').forEach(cb=>cb.onclick=()=>{
    toggleHiddenPage(cb.dataset.togglePage);
  });
  // Admin : message global (bannière d'annonce)
  const annSaveBtn = document.getElementById('ann-save');
  if(annSaveBtn) annSaveBtn.onclick = ()=>{
    const enabled = document.getElementById('ann-enabled').checked;
    const message = document.getElementById('ann-message').value;
    const type = document.getElementById('ann-type').value;
    if(enabled && !message.trim()){ showToast('Ajoute un message avant d\u2019activer la bannière.', 'danger'); return; }
    saveAnnouncement(enabled, message, type);
  };
  document.querySelectorAll('[data-jump-to]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const targetId = b.dataset.jumpTo;
    const el = document.getElementById('acc-'+targetId);
    if(!el){ showToast('Le compte lié n\u2019est pas visible avec les filtres actuels.', 'danger'); return; }
    el.style.setProperty('--flash-color', b.style.color);
    el.scrollIntoView({ behavior:'smooth', block:'center' });
    el.classList.add('flash-highlight');
    setTimeout(()=>el.classList.remove('flash-highlight'), 1600);
  });

  // Bilan Visuel filters
  ['fb-month'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const map = { 'fb-month':'month' };
    el.addEventListener('change', ()=>{
      state.filters.bilan[map[id]] = el.value;
      renderView();
    });
  });
  bindMultiSelectDropdown('fb-trader', state.filters.bilan, 'trader', 'traderMenuOpen', (arr)=>setTraderFilterEverywhere(arr));
  const fbClearBtn = document.getElementById('fb-clear');
  if(fbClearBtn) fbClearBtn.onclick = ()=>{ setTraderFilterEverywhere([]); renderView(); };
  document.querySelectorAll('[data-export-card]').forEach(b=>b.onclick=()=>{
    exportBilanCard(b.dataset.exportCard, b.dataset.exportName);
  });

  // Sessions Live filters + actions
  const fsQ = document.getElementById('fs-q');
  if(fsQ) fsQ.addEventListener('input', ()=>{ state.filters.sessions.q = fsQ.value; renderView(); });
  const fsClearBtn = document.getElementById('fs-clear');
  if(fsClearBtn) fsClearBtn.onclick = ()=>{ state.filters.sessions.q = ''; renderView(); };
  document.querySelectorAll('[data-edit-session]').forEach(b=>b.onclick=()=>{
    sessionFormModal(state.yt_sessions.find(x=>x.id===b.dataset.editSession));
  });
  document.querySelectorAll('[data-del-session]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.delSession;
    confirmModal('Supprimer cette session live et ses notes ?', async ()=>{
      const s = state.yt_sessions.find(x=>x.id===id);
      await remove('yt_sessions', id);
      await logActivity('DELETE', 'yt_session', id, s?s.title:'');
      showToast('Session supprimée.'); render();
    });
  });
}

/* ============================================================
   FORM: PROMO CODE (admin)
============================================================ */
function promoCodeFormModal(existing){
  const p = existing || {
    id: uid('promo'), code:'', label:'', discountType:'PERCENT', discountValue:10,
    appliesTo:['MONTHLY','YEARLY','LIFETIME'], active:true, validFrom:'', validUntil:'',
    maxUses:'', usesCount:0, createdBy: currentUserId(),
  };
  openModal({
    title: existing ? 'Modifier le code promo' : 'Nouveau code promo',
    bodyHtml: `
      <div class="field-row">
        <div class="field"><label>Code</label><input id="pf-code" value="${p.code}" style="text-transform:uppercase;" placeholder="EX: WELCOME20"/></div>
        <div class="field"><label>Libellé interne</label><input id="pf-label" value="${p.label||''}" placeholder="Ex: Lancement Instagram"/></div>
      </div>
      <div class="field"><label>Type de réduction</label>
        <div class="radio-group">
          <div class="radio-chip ${p.discountType==='PERCENT'?'selected':''}" data-disc-type="PERCENT">Pourcentage (%)</div>
          <div class="radio-chip ${p.discountType==='FIXED'?'selected':''}" data-disc-type="FIXED">Montant fixe (€)</div>
        </div>
      </div>
      <div class="field"><label>Valeur de la réduction</label><input id="pf-value" type="number" min="0" step="0.01" value="${p.discountValue}"/></div>
      <div class="field"><label>Formules concernées</label>
        <div class="radio-group">
          <div class="radio-chip ${p.appliesTo.includes('MONTHLY')?'selected':''}" data-cycle="MONTHLY">Mensuel</div>
          <div class="radio-chip ${p.appliesTo.includes('YEARLY')?'selected':''}" data-cycle="YEARLY">Annuel</div>
          <div class="radio-chip ${p.appliesTo.includes('LIFETIME')?'selected':''}" data-cycle="LIFETIME">Lifetime</div>
        </div>
        <div class="field-hint">Clique pour activer/désactiver chaque formule.</div>
      </div>
      <div class="field-row">
        <div class="field"><label>Valide à partir du (optionnel)</label><input id="pf-from" type="date" value="${p.validFrom||''}"/></div>
        <div class="field"><label>Valide jusqu'au (optionnel)</label><input id="pf-until" type="date" value="${p.validUntil||''}"/></div>
      </div>
      <div class="field"><label>Nombre d'utilisations max (optionnel)</label><input id="pf-maxuses" type="number" min="1" step="1" value="${p.maxUses||''}"/><div class="field-hint">Laisser vide = illimité. Utilisations actuelles : ${p.usesCount||0}.</div></div>
      <div class="field"><label>Statut</label>
        <div class="radio-group">
          <div class="radio-chip ${p.active!==false?'selected':''}" data-active="1">Actif</div>
          <div class="radio-chip ${p.active===false?'selected':''}" data-active="0">Désactivé</div>
        </div>
      </div>
      <div id="pf-error" class="error-text"></div>
    `,
    footHtml: `<button class="btn btn-outline" id="pf-cancel">Annuler</button><button class="btn btn-primary" id="pf-save">Enregistrer</button>`,
    onMount(){
      let discountType = p.discountType;
      let appliesTo = [...p.appliesTo];
      let active = p.active !== false;
      document.querySelectorAll('[data-disc-type]').forEach(chip=>chip.onclick=()=>{
        discountType = chip.dataset.discType;
        document.querySelectorAll('[data-disc-type]').forEach(c=>c.classList.toggle('selected', c.dataset.discType===discountType));
      });
      document.querySelectorAll('[data-cycle]').forEach(chip=>chip.onclick=()=>{
        const cy = chip.dataset.cycle;
        if(appliesTo.includes(cy)) appliesTo = appliesTo.filter(x=>x!==cy); else appliesTo.push(cy);
        chip.classList.toggle('selected', appliesTo.includes(cy));
      });
      document.querySelectorAll('[data-active]').forEach(chip=>chip.onclick=()=>{
        active = chip.dataset.active==='1';
        document.querySelectorAll('[data-active]').forEach(c=>c.classList.toggle('selected', (c.dataset.active==='1')===active));
      });
      document.getElementById('pf-cancel').onclick = closeModal;
      document.getElementById('pf-save').onclick = async ()=>{
        const code = document.getElementById('pf-code').value.trim().toUpperCase();
        const label = document.getElementById('pf-label').value.trim();
        const discountValue = parseFloat(document.getElementById('pf-value').value);
        const validFrom = document.getElementById('pf-from').value || null;
        const validUntil = document.getElementById('pf-until').value || null;
        const maxUsesRaw = document.getElementById('pf-maxuses').value;
        const maxUses = maxUsesRaw ? parseInt(maxUsesRaw, 10) : null;
        const errEl = document.getElementById('pf-error');
        if(!code){ errEl.textContent = 'Le code est obligatoire.'; return; }
        if(!discountValue || discountValue <= 0){ errEl.textContent = 'La valeur de la réduction doit être supérieure à 0.'; return; }
        if(discountType==='PERCENT' && discountValue > 100){ errEl.textContent = 'Un pourcentage ne peut pas dépasser 100.'; return; }
        if(appliesTo.length===0){ errEl.textContent = 'Sélectionne au moins une formule.'; return; }
        const dup = state.promo_codes.find(x=>x.code.toUpperCase()===code && x.id!==p.id);
        if(dup){ errEl.textContent = 'Ce code existe déjà.'; return; }
        await upsert('promo_codes', { ...p, code, label, discountType, discountValue, appliesTo, validFrom, validUntil, maxUses, active });
        await loadPromoCodesAdmin();
        showToast(existing ? 'Code promo mis à jour.' : 'Code promo créé.');
        closeModal(); renderView();
      };
    }
  });
}

/* ============================================================
   FORM: TRADER
============================================================ */
function traderFormModal(existing){
  const t = existing || { id: uid('trd'), firstName:'', lastName:'', pseudo:'', email: (state.session ? state.session.user.email : '') || '', status:'ACTIF', isPublic:true, createdBy: currentUserId() };
  openModal({
    title: existing ? 'Modifier le trader' : 'Nouveau trader',
    bodyHtml: `
      <div class="field-row">
        <div class="field"><label>Prénom</label><input id="tf-first" value="${t.firstName}"/></div>
        <div class="field"><label>Nom</label><input id="tf-last" value="${t.lastName}"/></div>
      </div>
      <div class="field"><label>Pseudo</label><input id="tf-pseudo" value="${t.pseudo}"/><div class="field-hint">Utilisé partout dans l'app pour identifier le trader.</div></div>
      <div class="field"><label>Email (optionnel)</label><input id="tf-email" value="${t.email||''}"/><div class="field-hint">Pré-rempli avec ton email de connexion pour rattacher ce trader à ton compte. Modifiable si besoin.</div></div>
      <div class="field"><label>Statut</label>
        <div class="radio-group">
          <div class="radio-chip ${t.status==='ACTIF'?'selected':''}" data-status="ACTIF">Actif</div>
          <div class="radio-chip ${t.status==='INACTIF'?'selected':''}" data-status="INACTIF">Inactif</div>
        </div>
        <div class="field-hint">Un trader inactif ne peut pas se voir attribuer de nouveau compte Challenge.</div>
      </div>
      <div class="field"><label>Visibilité</label>
        <div class="radio-group">
          <div class="radio-chip ${t.isPublic!==false?'selected':''}" data-visibility="public">Visible par tous</div>
          <div class="radio-chip ${t.isPublic===false?'selected':''}" data-visibility="private">Privé (visible uniquement par toi et les admins)</div>
        </div>
        <div class="field-hint">Contrôle qui peut voir ce trader, ses comptes, ses payouts et notes. Les sessions live liées à ce trader suivent aussi ce réglage.</div>
      </div>
      <div id="tf-error" class="error-text"></div>
    `,
    footHtml: `<button class="btn btn-outline" id="tf-cancel">Annuler</button><button class="btn btn-primary" id="tf-save">Enregistrer</button>`,
    onMount(){
      let status = t.status;
      let isPublic = t.isPublic!==false;
      document.querySelectorAll('[data-status]').forEach(chip=>chip.onclick=()=>{
        status = chip.dataset.status;
        document.querySelectorAll('[data-status]').forEach(c=>c.classList.toggle('selected', c.dataset.status===status));
      });
      document.querySelectorAll('[data-visibility]').forEach(chip=>chip.onclick=()=>{
        isPublic = chip.dataset.visibility==='public';
        document.querySelectorAll('[data-visibility]').forEach(c=>c.classList.toggle('selected', (c.dataset.visibility==='public')===isPublic));
      });
      document.getElementById('tf-cancel').onclick = closeModal;
      document.getElementById('tf-save').onclick = async ()=>{
        const firstName = document.getElementById('tf-first').value.trim();
        const lastName = document.getElementById('tf-last').value.trim();
        const pseudo = document.getElementById('tf-pseudo').value.trim();
        const email = document.getElementById('tf-email').value.trim();
        if(!firstName || !lastName || !pseudo){
          document.getElementById('tf-error').textContent = 'Prénom, nom et pseudo sont obligatoires.'; return;
        }
        const dup = state.traders.find(x=>x.pseudo.toLowerCase()===pseudo.toLowerCase() && x.id!==t.id);
        if(dup){ document.getElementById('tf-error').textContent = 'Ce pseudo est déjà utilisé.'; return; }
        await upsert('traders', { ...t, firstName, lastName, pseudo, email, status, isPublic });
        if(!existing) applyMyTraderDefaultFilters();
        await logActivity(existing?'UPDATE':'CREATE', 'trader', t.id, `${pseudo}${isPublic?'':' (privé)'}`);
        showToast(existing ? 'Trader mis à jour.' : 'Trader créé.');
        closeModal(); render();
      };
    }
  });
}

/* ============================================================
   FORM: PROPFIRM
============================================================ */
function firmFormModal(existing){
  const f = existing || { id: uid('pf'), name:'', website:'', notes:'', createdBy: currentUserId() };
  openModal({
    title: existing ? 'Modifier la PropFirm' : 'Nouvelle PropFirm',
    bodyHtml: `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;" id="ff-preview-wrap">
        ${firmLogoHtml(f, 36)}
        <span class="field-hint" style="margin:0;">Aperçu du logo (basé sur le site web, ou déduit du nom pour les PropFirms connues).</span>
      </div>
      <div class="field"><label>Nom</label><input id="ff-name" value="${f.name}"/></div>
      <div class="field"><label>Site web (optionnel)</label><input id="ff-web" value="${f.website||''}" placeholder="https://…"/></div>
      <div class="field"><label>Notes (optionnel)</label><textarea id="ff-notes" rows="3">${f.notes||''}</textarea></div>
      <div id="ff-error" class="error-text"></div>
    `,
    footHtml: `<button class="btn btn-outline" id="ff-cancel">Annuler</button><button class="btn btn-primary" id="ff-save">Enregistrer</button>`,
    onMount(){
      function refreshPreview(){
        document.getElementById('ff-preview-wrap').innerHTML =
          firmLogoHtml({ name: document.getElementById('ff-name').value, website: document.getElementById('ff-web').value }, 36)
          + `<span class="field-hint" style="margin:0;">Aperçu du logo (basé sur le site web, ou déduit du nom pour les PropFirms connues).</span>`;
      }
      document.getElementById('ff-name').addEventListener('input', refreshPreview);
      document.getElementById('ff-web').addEventListener('input', refreshPreview);
      document.getElementById('ff-cancel').onclick = closeModal;
      document.getElementById('ff-save').onclick = async ()=>{
        const name = document.getElementById('ff-name').value.trim();
        if(!name){ document.getElementById('ff-error').textContent = 'Le nom est obligatoire.'; return; }
        const dup = state.propfirms.find(x=>x.name.toLowerCase()===name.toLowerCase() && x.id!==f.id);
        if(dup){ document.getElementById('ff-error').textContent = 'Cette PropFirm existe déjà.'; return; }
        await upsert('propfirms', { ...f, name, website: document.getElementById('ff-web').value.trim(), notes: document.getElementById('ff-notes').value.trim() });
        await logActivity(existing?'UPDATE':'CREATE', 'propfirm', f.id, `${name}`);
        showToast(existing ? 'PropFirm mise à jour.' : 'PropFirm créée.');
        closeModal(); render();
      };
    }
  });
}

/* ============================================================
   FORM: ACCOUNT (Challenge or PA)
============================================================ */
function accountFormModal({ existing, type, parentChallenge }){
  const isEdit = !!existing;
  // La limite de comptes gratuits est désormais par trader (et par utilisateur créateur) :
  // on ne peut plus la vérifier ici puisque le trader n'est pas encore choisi.
  // Voir la vérification faite dans af-save, juste avant l'enregistrement.
  const a = existing || {
    id: uid('acc'),
    traderId: parentChallenge ? parentChallenge.traderId : (myLinkedTrader() ? myLinkedTrader().id : ''),
    propFirmId: parentChallenge ? parentChallenge.propFirmId : '',
    type: type || 'CHALLENGE',
    parentChallengeId: parentChallenge ? parentChallenge.id : null,
    size: parentChallenge ? parentChallenge.size : 'S25K',
    customSize: parentChallenge ? parentChallenge.customSize : '',
    accountNumber: '',
    paymentType: 'UNIQUE',
    purchasePrice: '',
    monthlyAmount: '',
    purchaseDate: todayISO(),
    activationDate: todayISO(),
    activationFee: '',
    status: 'ACTIF',
    endDate: null,
    createdAt: new Date().toISOString(),
    createdBy: currentUserId(),
  };
  const lockTrader = !!parentChallenge;
  const lockType = !!parentChallenge || (type && !isEdit);
  if(state.traders.length===0 || state.propfirms.length===0){
    showToast('Crée d\u2019abord au moins un trader et une PropFirm.', 'danger');
    return;
  }

  openModal({
    title: isEdit ? 'Modifier le compte' : (parentChallenge ? 'Créer le PA' : 'Nouveau compte'),
    wide: true,
    bodyHtml: `
      ${parentChallenge ? `<div class="field-hint" style="margin-bottom:14px;">Ce PA sera relié au challenge réussi de <strong>${getTrader(parentChallenge.traderId).pseudo}</strong>.</div>` : ''}
      <div class="field-row">
        <div class="field"><label>Trader</label>
          <select id="af-trader" ${lockTrader?'disabled':''}>
            <option value="">— Sélectionner —</option>
            ${state.traders.map(t=>`<option value="${t.id}" ${a.traderId===t.id?'selected':''}>${t.pseudo}${t.status==='INACTIF'?' (inactif)':''}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>PropFirm</label>
          <div class="firm-picker" id="af-firm-picker" ${lockTrader?'style="opacity:.55;pointer-events:none;"':''}>
            ${sortedFirms().map(f=>`<div class="firm-pick ${a.propFirmId===f.id?'selected':''}" data-firm-pick="${f.id}">${firmLogoHtml(f,20)}<span>${f.name}</span></div>`).join('')}
          </div>
          <input type="hidden" id="af-firm" value="${a.propFirmId||''}"/>
        </div>
      </div>
      <div class="field"><label>Type de compte</label>
        <div class="radio-group">
          <div class="radio-chip ${a.type==='CHALLENGE'?'selected':''}" data-type="CHALLENGE" ${lockType?'style="opacity:.5;pointer-events:none;"':''}>Challenge</div>
          <div class="radio-chip ${a.type==='PA'?'selected':''}" data-type="PA" ${lockType?'style="opacity:.5;pointer-events:none;"':''}>PA</div>
          <div class="radio-chip ${a.type==='LIVE'?'selected':''}" data-type="LIVE" ${lockType?'style="opacity:.5;pointer-events:none;"':''}>Live</div>
        </div>
        ${isEdit && !lockType ? `<div class="field-hint">Modifiable si le type a été mal renseigné à la création. Vérifie les champs ci-dessous (date d\u2019achat/activation, statut) après changement.</div>` : ''}
      </div>
      <div class="field-row">
        <div class="field"><label>Taille du compte</label>
          <select id="af-size">
            ${Object.entries(SIZE_LABELS).map(([k,v])=>`<option value="${k}" ${a.size===k?'selected':''}>${v}</option>`).join('')}
          </select>
        </div>
        <div class="field" id="af-customsize-wrap" style="display:${a.size==='AUTRE'?'block':'none'};">
          <label>Montant personnalisé ($)</label><input id="af-customsize" type="number" value="${a.customSize||''}"/>
        </div>
      </div>
      <div class="field"><label>Numéro de compte</label><input id="af-number" value="${a.accountNumber}"/></div>
      <div class="field"><label>Mode de paiement</label>
        <div class="radio-group">
          <div class="radio-chip ${a.paymentType==='UNIQUE'?'selected':''}" data-pay="UNIQUE">Paiement unique</div>
          <div class="radio-chip ${a.paymentType==='MENSUEL'?'selected':''}" data-pay="MENSUEL">Mensualités</div>
        </div>
      </div>
      <div class="field-row">
        <div class="field" id="af-price-wrap" style="display:${a.paymentType==='UNIQUE'?'block':'none'};"><label>Prix d'achat ($)</label><input id="af-price" type="number" value="${a.purchasePrice||''}"/></div>
        <div class="field" id="af-monthly-wrap" style="display:${a.paymentType==='MENSUEL'?'block':'none'};"><label>Montant mensuel ($)</label><input id="af-monthly" type="number" value="${a.monthlyAmount||''}"/></div>
        <div class="field" id="af-purchase-date-wrap" style="display:${(a.type==='PA'||a.type==='LIVE')?'none':'block'};"><label>Date d'achat / d'ouverture</label><input id="af-date" type="date" value="${a.purchaseDate}"/></div>
      </div>
      <div id="af-pa-fields" style="display:${(a.type==='PA'||a.type==='LIVE')?'block':'none'};">
        <div class="field-row">
          <div class="field"><label>Date d'activation</label><input id="af-activation-date" type="date" value="${a.activationDate||todayISO()}"/><div class="field-hint">Sert aussi de date d'achat/ouverture du PA — les deux dates sont toujours identiques.</div></div>
          <div class="field"><label>Frais d'activation ($, optionnel)</label><input id="af-activation-fee" type="number" value="${a.activationFee||''}"/></div>
        </div>
        ${!parentChallenge ? `
        <div class="field">
          <label>Challenge d'origine (optionnel)</label>
          <select id="af-parent-challenge"><option value="">— Aucun / indépendant —</option></select>
          <div class="field-hint">Pour relier ce PA/Live au Challenge qu'il a réussi — utile notamment après un import où le lien n'a pas pu être détecté automatiquement.</div>
        </div>` : ''}
      </div>
      ${isEdit ? `
      <div class="field-row">
        <div class="field"><label>Statut</label>
          <select id="af-status">
            ${STATUS_OPTIONS_BY_TYPE[a.type].map(s=>`<option value="${s}" ${a.status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}
          </select>
        </div>
        <div class="field" id="af-enddate-wrap" style="display:${a.status==='ACTIF'?'none':'block'};">
          <label>Date de fin (réussite / breach / fermeture)</label>
          <input id="af-enddate" type="date" value="${a.endDate || todayISO()}"/>
        </div>
      </div>
      <div class="field-hint" style="margin-top:-6px;margin-bottom:14px;">Modifier le statut ici permet de revenir en arrière (ex: annuler un Breached) ou de corriger une date.</div>
      ` : ''}
      <div id="af-error" class="error-text"></div>
    `,
    footHtml: `<button class="btn btn-outline" id="af-cancel">Annuler</button><button class="btn btn-primary" id="af-save">Enregistrer</button>`,
    onMount(){
      let curType = a.type, curPay = a.paymentType, curSize = a.size;
      function refreshParentChallengeOptions(){
        const sel = document.getElementById('af-parent-challenge');
        if(!sel) return;
        const traderId = document.getElementById('af-trader').value;
        const prevValue = sel.value;
        const candidates = state.accounts.filter(x=>x.type==='CHALLENGE' && x.traderId===traderId && x.id!==a.id);
        sel.innerHTML = '<option value="">— Aucun / indépendant —</option>' + candidates.map(c=>
          `<option value="${c.id}" ${prevValue===c.id?'selected':''}>${getFirm(c.propFirmId)?.name||'?'} · ${sizeLabelRaw(c)} · ${c.accountNumber||'sans n°'} · ${STATUS_LABELS[c.status]||c.status}</option>`
        ).join('');
        if(!candidates.some(c=>c.id===prevValue)){
          sel.value = (isEdit && a.parentChallengeId && candidates.some(c=>c.id===a.parentChallengeId)) ? a.parentChallengeId : '';
        }
      }
      document.querySelectorAll('[data-type]').forEach(chip=>chip.onclick=()=>{
        if(lockType) return;
        curType = chip.dataset.type;
        document.querySelectorAll('[data-type]').forEach(c=>c.classList.toggle('selected', c.dataset.type===curType));
        document.getElementById('af-pa-fields').style.display = (curType==='PA'||curType==='LIVE') ? 'block' : 'none';
        document.getElementById('af-purchase-date-wrap').style.display = (curType==='PA'||curType==='LIVE') ? 'none' : 'block';
        if(curType==='PA'||curType==='LIVE') refreshParentChallengeOptions();
        const statusSelectEl = document.getElementById('af-status');
        if(statusSelectEl){
          const opts = STATUS_OPTIONS_BY_TYPE[curType];
          const keepCurrent = opts.includes(statusSelectEl.value);
          statusSelectEl.innerHTML = opts.map(s=>`<option value="${s}">${STATUS_LABELS[s]}</option>`).join('');
          statusSelectEl.value = keepCurrent ? statusSelectEl.value : opts[0];
          const terminal = statusSelectEl.value!=='ACTIF';
          document.getElementById('af-enddate-wrap').style.display = terminal ? 'block' : 'none';
        }
      });
      document.querySelectorAll('[data-pay]').forEach(chip=>chip.onclick=()=>{
        curPay = chip.dataset.pay;
        document.querySelectorAll('[data-pay]').forEach(c=>c.classList.toggle('selected', c.dataset.pay===curPay));
        document.getElementById('af-price-wrap').style.display = curPay==='UNIQUE' ? 'block' : 'none';
        document.getElementById('af-monthly-wrap').style.display = curPay==='MENSUEL' ? 'block' : 'none';
      });
      document.getElementById('af-size').onchange = (e)=>{
        curSize = e.target.value;
        document.getElementById('af-customsize-wrap').style.display = curSize==='AUTRE' ? 'block' : 'none';
      };
      const traderSelect = document.getElementById('af-trader');
      if(!lockTrader) traderSelect.onchange = refreshParentChallengeOptions;
      if(!lockTrader){
        document.querySelectorAll('[data-firm-pick]').forEach(el=>el.onclick=()=>{
          document.querySelectorAll('[data-firm-pick]').forEach(x=>x.classList.remove('selected'));
          el.classList.add('selected');
          document.getElementById('af-firm').value = el.dataset.firmPick;
        });
      }
      if(curType==='PA'||curType==='LIVE') refreshParentChallengeOptions();
      const statusSelect = document.getElementById('af-status');
      if(statusSelect) statusSelect.onchange = (e)=>{
        const terminal = e.target.value!=='ACTIF';
        document.getElementById('af-enddate-wrap').style.display = terminal ? 'block' : 'none';
      };
      document.getElementById('af-cancel').onclick = closeModal;
      document.getElementById('af-save').onclick = async ()=>{
        const traderId = document.getElementById('af-trader').value;
        const propFirmId = document.getElementById('af-firm').value;
        const accountNumber = document.getElementById('af-number').value.trim();
        const errorEl = document.getElementById('af-error');
        if(!traderId || !propFirmId || !accountNumber){ errorEl.textContent = 'Trader, PropFirm et numéro de compte sont obligatoires.'; return; }
        if(!isEdit && !perms().canUnlimitedAccounts){
          const ownAccountsForTrader = state.accounts.filter(x=>x.traderId===traderId && x.createdBy===currentUserId()).length;
          if(ownAccountsForTrader >= perms().maxFreeAccounts){
            closeModal();
            openUpgradeModal(`La création de plus de ${perms().maxFreeAccounts} comptes pour ce trader`);
            return;
          }
        }
        const trader = getTrader(traderId);
        if(curType==='CHALLENGE' && trader.status==='INACTIF' && !isEdit){
          errorEl.textContent = 'Impossible : ce trader est inactif. Réactive-le pour créer un nouveau challenge.'; return;
        }
        const size = document.getElementById('af-size').value;
        const customSize = size==='AUTRE' ? Number(document.getElementById('af-customsize').value)||0 : null;
        const purchasePrice = curPay==='UNIQUE' ? Number(document.getElementById('af-price').value)||0 : null;
        const monthlyAmount = curPay==='MENSUEL' ? Number(document.getElementById('af-monthly').value)||0 : null;
        let activationDate = a.activationDate, activationFee = a.activationFee, purchaseDate;
        if(curType==='PA' || curType==='LIVE'){
          activationDate = document.getElementById('af-activation-date').value;
          activationFee = Number(document.getElementById('af-activation-fee').value)||0;
          purchaseDate = activationDate; // règle métier : pour un PA/Live, date d'achat = date d'activation
        } else {
          purchaseDate = document.getElementById('af-date').value;
        }
        let status = a.status, endDate = a.endDate;
        if(isEdit){
          status = document.getElementById('af-status').value;
          const terminal = status!=='ACTIF';
          endDate = terminal ? (document.getElementById('af-enddate').value || todayISO()) : null;
        }
        let parentChallengeId = a.parentChallengeId || null;
        if(curType==='CHALLENGE'){
          parentChallengeId = null;
        } else if(!parentChallenge){
          const parentSel = document.getElementById('af-parent-challenge');
          parentChallengeId = parentSel ? (parentSel.value || null) : null;
        }
        const record = {
          ...a, traderId, propFirmId, type:curType, size, customSize,
          accountNumber, paymentType:curPay, purchasePrice, monthlyAmount,
          purchaseDate, activationDate: (curType==='PA'||curType==='LIVE')?activationDate:null, activationFee: (curType==='PA'||curType==='LIVE')?activationFee:null,
          status, endDate, parentChallengeId,
        };
        await upsert('accounts', record);
        const accDesc = `${trader.pseudo} · ${getFirm(propFirmId)?.name||''} · ${TYPE_LABELS[curType]}`;
        await logActivity(isEdit?'UPDATE':'CREATE', 'account', a.id, accDesc);
        if(isEdit && status !== a.status){
          await logStatusChange(a.id, a.status, status, 'Modifié via le formulaire du compte');
        }

        // If this PA was created from a challenge, mark the parent challenge as REUSSI
        if(parentChallenge && !isEdit){
          const parent = getAccount(parentChallenge.id);
          await upsert('accounts', { ...parent, status:'REUSSI', endDate: activationDate });
          await logStatusChange(parent.id, parent.status, 'REUSSI', 'PA créé à partir de ce challenge');
        }
        showToast(isEdit ? 'Compte mis à jour.' : 'Compte créé.');
        closeModal(); render();
      };
    }
  });
}

/* ============================================================
   CONVERT PA -> LIVE
============================================================ */
function convertPaToLive(acc){
  confirmModal(
    `Convertir le PA de <strong>${getTrader(acc.traderId).pseudo}</strong> en compte Live ? L\u2019historique (payouts, dépenses, date d\u2019activation) est conservé, seul le type de compte change.`,
    async ()=>{
      await upsert('accounts', { ...acc, type:'LIVE' });
      await logActivity('UPDATE', 'account', acc.id, `PA converti en Live — ${getTrader(acc.traderId).pseudo} · ${getFirm(acc.propFirmId)?.name||''}`);
      showToast('Compte converti en Live.');
      render();
    },
    false
  );
}

/* ============================================================
   STATUS CHANGE (Réussi / Breached / Fermé)
============================================================ */
function statusChangeModal(acc, newStatus){
  const labels = { REUSSI:'Marquer comme réussi', BREACHED:'Marquer comme breached', FERME:'Fermer le compte' };
  openModal({
    title: labels[newStatus] || 'Changer le statut',
    bodyHtml: `
      <div class="field"><label>Date</label><input id="sc-date" type="date" value="${todayISO()}"/></div>
      <div class="field-hint">${newStatus==='BREACHED' ? 'Les mensualités éventuelles s\u2019arrêteront à cette date.' : (newStatus==='REUSSI' ? 'Tu pourras ensuite créer le PA associé.' : 'Le compte sera archivé comme fermé.')}</div>
    `,
    footHtml: `<button class="btn btn-outline" id="sc-cancel">Annuler</button><button class="btn ${newStatus==='BREACHED'?'btn-danger':'btn-primary'}" id="sc-ok">Confirmer</button>`,
    onMount(){
      document.getElementById('sc-cancel').onclick = closeModal;
      document.getElementById('sc-ok').onclick = async ()=>{
        const date = document.getElementById('sc-date').value || todayISO();
        const oldStatus = acc.status;
        await upsert('accounts', { ...acc, status:newStatus, endDate:date });
        await logStatusChange(acc.id, oldStatus, newStatus, `Changé le ${fmtDate(date)}`);
        await logActivity('STATUS_CHANGE', 'account', acc.id, `${getTrader(acc.traderId)?.pseudo||'—'} : ${oldStatus} → ${newStatus}`);
        showToast('Statut mis à jour.');
        closeModal(); render();
      };
    }
  });
}

/* ============================================================
   HISTORIQUE DE STATUT D'UN COMPTE
============================================================ */
function statusHistoryModal(acc){
  const trader = getTrader(acc.traderId), firm = getFirm(acc.propFirmId);
  openModal({
    title: 'Historique du statut',
    bodyHtml: `<div class="field-hint" style="margin-bottom:12px;">${trader?trader.pseudo:'—'} · ${firm?firm.name:'—'} · N° ${maskAccountNumber(acc.accountNumber)}</div><div id="ash-body">${emptyState('clock','Chargement…','')}</div>`,
    footHtml: `<button class="btn btn-outline" id="ash-close">Fermer</button>`,
    async onMount(){
      document.getElementById('ash-close').onclick = closeModal;
      const entries = await fetchStatusHistory(acc.id);
      const body = document.getElementById('ash-body');
      if(!body) return;
      if(entries.length===0){
        body.innerHTML = emptyState('clock','Aucun changement enregistré','Les changements de statut effectués depuis cette mise à jour apparaîtront ici.');
        return;
      }
      body.innerHTML = `<div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Ancien statut</th><th>Nouveau statut</th><th>Note</th></tr></thead>
        <tbody>${entries.map(e=>`<tr>
          <td class="mono text-dim" style="white-space:nowrap;">${new Date(e.changedAt).toLocaleString('fr-FR')}</td>
          <td>${e.oldStatus?`<span class="badge badge-slate">${e.oldStatus}</span>`:'<span class="text-faint">création</span>'}</td>
          <td><span class="badge badge-accent">${e.newStatus}</span></td>
          <td class="text-dim">${e.note||''}</td>
        </tr>`).join('')}</tbody>
      </table></div>`;
    }
  });
}

/* ============================================================
   PAYOUTS MODAL
============================================================ */
function payoutsModal(acc){
  const trader = getTrader(acc.traderId);
  let editingId = null; // id of the payout currently being edited, or null when adding a new one
  function body(){
    const list = state.payouts.filter(p=>p.accountId===acc.id).sort((a,b)=>b.date.localeCompare(a.date));
    const total = list.reduce((s,p)=>s+Number(p.amount),0);
    const editing = editingId ? list.find(p=>p.id===editingId) : null;
    return `
      <div class="field-hint" style="margin-bottom:12px;">PA de <strong>${trader.pseudo}</strong> — Total versé : <span class="mono" style="color:var(--accent)">${fmtMoney(total)}</span></div>
      ${canEdit(acc) ? `
      ${editing ? `<div class="field-hint" style="margin-bottom:8px;color:var(--gold);">Modification du payout du ${fmtDate(editing.date)}</div>` : ''}
      <div class="field-row">
        <div class="field"><label>Montant ($)</label><input id="pm-amount" type="number" value="${editing?editing.amount:''}"/></div>
        <div class="field"><label>Date</label><input id="pm-date" type="date" value="${editing?editing.date:todayISO()}"/></div>
      </div>
      <div class="field"><label>Note (optionnel)</label><input id="pm-note" placeholder="ex: payout mensuel" value="${editing?(editing.note||''):''}"/></div>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button class="btn btn-primary btn-sm" id="pm-add">${editing?icon('check'):icon('plus')}${editing?'Enregistrer la modification':'Ajouter le payout'}</button>
        ${editing ? `<button class="btn btn-outline btn-sm" id="pm-cancel-edit">Annuler</button>` : ''}
      </div>` : ''}
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Note</th><th class="num">Montant</th><th></th></tr></thead>
          <tbody>
            ${list.length===0 ? `<tr><td colspan="4"><div class="empty-sub" style="padding:16px 0;">Aucun payout enregistré.</div></td></tr>` :
              list.map(p=>`<tr>
                <td class="mono text-dim">${fmtDate(p.date)}</td>
                <td class="text-dim">${p.note||'—'}</td>
                <td class="num" style="color:var(--accent)">${fmtMoney(p.amount)}</td>
                <td>${`<div style="display:flex;gap:6px;justify-content:flex-end;align-items:center;">
                    <button class="btn btn-ghost btn-sm" data-receipt-payout="${p.id}" title="Reçu PDF">${icon('receipt')}</button>
                    ${canEdit(p) ? `<button class="btn btn-ghost btn-sm" data-edit-payout="${p.id}">${icon('edit')}</button>
                    <button class="btn btn-ghost btn-sm" data-del-payout="${p.id}" style="color:var(--danger)">${icon('trash')}</button>` : `<span class="badge badge-slate" title="Seul le créateur ou un administrateur peut modifier cet enregistrement">${icon('lock')}Lecture seule</span>`}
                  </div>`}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
  }
  function mount(){
    const addBtn = document.getElementById('pm-add');
    if(addBtn) addBtn.onclick = async ()=>{
      const amount = Number(document.getElementById('pm-amount').value);
      const date = document.getElementById('pm-date').value || todayISO();
      const note = document.getElementById('pm-note').value.trim();
      if(!amount || amount<=0){ showToast('Montant invalide.', 'danger'); return; }
      if(editingId){
        const existing = state.payouts.find(p=>p.id===editingId);
        await upsert('payouts', { ...existing, amount, date, note });
        await logActivity('UPDATE', 'payout', existing.id, `Payout modifié — ${trader.pseudo} · ${fmtMoney(amount)}`);
        showToast('Payout mis à jour.');
        editingId = null;
      } else {
        const newId = uid('pay');
        await upsert('payouts', { id: newId, accountId: acc.id, amount, date, note, createdAt: new Date().toISOString(), createdBy: currentUserId() });
        await logActivity('CREATE', 'payout', newId, `Payout ajouté — ${trader.pseudo} · ${fmtMoney(amount)}`);
        showToast('Payout ajouté.');
      }
      refresh();
    };
    const cancelEditBtn = document.getElementById('pm-cancel-edit');
    if(cancelEditBtn) cancelEditBtn.onclick = ()=>{ editingId = null; refresh(); };
    document.querySelectorAll('[data-edit-payout]').forEach(b=>b.onclick=()=>{ editingId = b.dataset.editPayout; refresh(); });
    document.querySelectorAll('[data-del-payout]').forEach(b=>b.onclick=()=>{
      confirmModal('Supprimer ce payout ?', async ()=>{
        const p = state.payouts.find(x=>x.id===b.dataset.delPayout);
        if(editingId===b.dataset.delPayout) editingId=null;
        await remove('payouts', b.dataset.delPayout);
        if(p) await logActivity('DELETE', 'payout', p.id, `Payout supprimé — ${trader.pseudo} · ${fmtMoney(p.amount)}`);
        refresh();
      });
    });
    document.querySelectorAll('[data-receipt-payout]').forEach(b=>b.onclick=()=>{
      const p = state.payouts.find(x=>x.id===b.dataset.receiptPayout);
      if(p) generatePayoutReceipt(acc, trader, p);
    });
  }
  function refresh(){
    document.querySelector('.modal-body').innerHTML = body();
    mount();
    renderView(); // keep account card counts in sync in background
  }
  openModal({ title:'Payouts', wide:true, bodyHtml: body(), onMount: mount });
}

/* ============================================================
   REÇU PDF (payout)
============================================================ */
function generatePayoutReceipt(acc, trader, payout){
  if(!window.jspdf){ showToast('Librairie PDF indisponible (réseau bloqué ?).', 'danger'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const firm = getFirm(acc.propFirmId);
  doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.text('Reçu de payout', 48, 60);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(120);
  doc.text('Contralytix — Gestion Propfirm', 48, 78);
  doc.setDrawColor(220); doc.line(48, 92, 547, 92);

  doc.setFontSize(11); doc.setTextColor(30);
  const rows = [
    ['Trader', trader ? trader.pseudo : '—'],
    ['PropFirm', firm ? firm.name : '—'],
    ['Type de compte', TYPE_LABELS[acc.type] || acc.type],
    ['N° de compte', maskAccountNumber(acc.accountNumber).replace(/<[^>]+>/g,'')],
    ['Date du payout', fmtDate(payout.date)],
    ['Note', payout.note || '—'],
  ];
  let y = 122;
  rows.forEach(([k,v])=>{
    doc.setFont('helvetica','bold'); doc.text(k, 48, y);
    doc.setFont('helvetica','normal'); doc.text(String(v), 200, y);
    y += 22;
  });
  y += 14;
  doc.setDrawColor(220); doc.line(48, y, 547, y);
  y += 34;
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Montant versé :', 48, y);
  doc.setTextColor(20,140,110);
  doc.text(fmtMoney(payout.amount), 220, y);
  doc.setTextColor(150); doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text(`Généré le ${fmtDate(todayISO())} — document à usage interne, non fiscal.`, 48, 780);

  doc.save(`recu_payout_${(trader?trader.pseudo:'trader')}_${payout.date}.pdf`);
}

        }

          html += `<div class="acc-field-label" style="margin:12px 0 6px;">Comptes</div>`;
          html += accHits.map(a=>{
            const t = getTrader(a.traderId), f = getFirm(a.propFirmId);

          closeModal(); state.route='propfirms'; render();
        });
        resultsEl.querySelectorAll('[data-gs-account]').forEach(el=>el.onclick=()=>{
          const acc = getAccount(el.dataset.gsAccount);
          closeModal();
          state.route='accounts';
          state.filters.accounts = { q: acc.accountNumber, trader:'', propfirm:'', type:'', status:[], statusMenuOpen:false };
          render();
        });
      }
      input.addEventListener('input', renderResults);
      renderResults();
    }
  });
