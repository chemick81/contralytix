        </div>
      </div>
      <div class="reg-stats-row">
        <div class="reg-stat"><div class="reg-stat-val">${r.activeMonths} / ${r.totalMonths}</div><div class="reg-stat-lbl">Mois actifs</div></div>
        <div class="reg-stat"><div class="reg-stat-val">${r.currentStreak}</div><div class="reg-stat-lbl">Série en cours (mois)</div></div>
        <div class="reg-stat"><div class="reg-stat-val">${r.longestStreak}</div><div class="reg-stat-lbl">Meilleure série (mois)</div></div>
        <div class="reg-stat"><div class="reg-stat-val">${r.longestGap}</div><div class="reg-stat-lbl">Plus long trou (mois)</div></div>

// Colonnes triables du tableau Comparatif : clé -> comment extraire la valeur d'une ligne.
// 'name' est traité à part (comparaison alphabétique) ; le reste est numérique, avec les
// valeurs null (taux de réussite non calculable) systématiquement repoussées en fin de liste.
const COMPARATIF_COLUMNS = [
  { key:'name',         label:'PropFirm',         numeric:false },
  { key:'nbComptes',    label:'Comptes',          numeric:true },
  { key:'nbChallenges', label:'Challenges',       numeric:true },
  { key:'tauxReussite', label:'Taux de réussite', numeric:true },
  { key:'totalExp',     label:'Dépenses',         numeric:true },
  { key:'totalPay',     label:'Payouts',          numeric:true },
  { key:'net',          label:'Net',              numeric:true },
];
function sortComparatifRows(rows, sortKey, sortDir){
  const mul = sortDir==='asc' ? 1 : -1;
  return [...rows].sort((a,b)=>{
    if(sortKey==='name'){
      return a.firm.name.localeCompare(b.firm.name, 'fr', { sensitivity:'base' }) * mul;
    }
    const va = a[sortKey], vb = b[sortKey];
    if(va===null && vb===null) return 0;
    if(va===null) return 1;   // valeurs non calculables toujours en dernier
    if(vb===null) return -1;
    return (va - vb) * mul;
  });
}
function viewComparatif(){
  if(state.propfirms.length===0){
    return emptyState('barChart','Aucune donnée','Ajoute des PropFirms et des comptes pour voir le comparatif.');
  }
  let rows = sortedFirms().map(f=>{
    const accs = state.accounts.filter(a=>a.propFirmId===f.id);
    const challenges = accs.filter(a=>a.type==='CHALLENGE');
    const reussis = challenges.filter(a=>a.status==='REUSSI').length;
    const breached = challenges.filter(a=>a.status==='BREACHED').length;
    const tauxReussite = (reussis+breached)>0 ? Math.round(reussis/(reussis+breached)*100) : null;
    const accIds = new Set(accs.map(a=>a.id));
    const totalExp = computeAllExpenses().filter(e=>accIds.has(e.accountId)).reduce((s,e)=>s+e.amount,0);
    const totalPay = state.payouts.filter(p=>accIds.has(p.accountId)).reduce((s,p)=>s+Number(p.amount),0);
    const net = totalPay - totalExp;
    return { firm:f, nbComptes: accs.length, nbChallenges: challenges.length, tauxReussite, totalExp, totalPay, net };
  });

  const { sortKey, sortDir } = state.filters.comparatif;
  rows = sortComparatifRows(rows, sortKey, sortDir);

  const thSort = (col)=>{
    const active = sortKey===col.key;
    const arrow = active ? icon(sortDir==='asc' ? 'arrowUp' : 'arrowDown') : icon('arrowUpDown');
    return `<th class="th-sortable ${col.numeric?'num':''} ${active?'th-sort-active':''}" data-sort-comparatif="${col.key}"><span class="th-sort-inner">${col.label}${arrow}</span></th>`;
  };

  return `
    <div class="panel">
      <div class="table-wrap">
        <table>
          <thead><tr>
            ${COMPARATIF_COLUMNS.map(thSort).join('')}
          </tr></thead>
          <tbody>
            ${rows.map(r=>`<tr>
              <td style="font-weight:600;"><span class="firm-name-inline">${firmLogoHtml(r.firm,18)}${r.firm.name}</span></td>
              <td class="num">${r.nbComptes}</td>
              <td class="num">${r.nbChallenges}</td>
              <td class="num">${r.tauxReussite===null ? '<span class="text-faint">—</span>' : r.tauxReussite+'%'}</td>
              <td class="num" style="color:var(--danger)">${fmtMoney(r.totalExp)}</td>
              <td class="num" style="color:var(--accent)">${fmtMoney(r.totalPay)}</td>
              <td class="num" style="font-weight:700;color:${r.net>=0?'var(--accent)':'var(--danger)'}">${r.net>=0?'+':''}${fmtMoney(r.net)}</td>
            </tr>`).join('')}
          </tbody>

    </div>
    <div class="field-hint" style="margin-top:12px;">Le taux de réussite ne compte que les challenges déjà tranchés (réussis ou breached). Clique sur une colonne pour trier.</div>
  `;
}

// Retourne, pour un mois donné (YYYY-MM), toutes les échéances de mensualité
// des comptes actuellement actifs (Challenge en cours ou PA/Live actif).
function computeMonthlyDueItems(monthKeyStr){
  const items = [];
  state.accounts.forEach(a=>{
    const isChallengeActive = a.type==='CHALLENGE' && a.status==='ACTIF';
    const isFundedActive = (a.type==='PA' || a.type==='LIVE') && a.status==='ACTIF';
    if(!isChallengeActive && !isFundedActive) return;
    if(a.paymentType!=='MENSUEL' || !a.monthlyAmount) return;
    const k = monthsBetweenCount(a.purchaseDate, monthKeyStr+'-01');
    if(k<0) return;
    const dueDate = addMonths(a.purchaseDate, k);
    if(monthKey(dueDate)!==monthKeyStr) return;
    items.push({
      accountId:a.id, date:dueDate, amount:a.monthlyAmount, type:a.type,
      trader:getTrader(a.traderId), firm:getFirm(a.propFirmId),
    });
  });
  items.sort((x,y)=>x.date.localeCompare(y.date));
  return items;
}
const CAL_EVENT_META = {
  ACHAT:      { label:'Achat compte',      short:'Achat',    icon:'🛒', color:'slate'  },
  ACTIVATION: { label:'Frais d\u2019activation', short:'Activation', icon:'⚡', color:'slate' },
  MENSUALITE: { label:'Mensualité due',    short:'Mensu.',   icon:'💳', color:'gold'   },
  PAYOUT:     { label:'Payout reçu',       short:'Payout',   icon:'💵', color:'accent' },
  REUSSI:     { label:'Challenge réussi',  short:'Réussi',   icon:'🏆', color:'accent' },
  BREACHED:   { label:'Breach',            short:'Breach',   icon:'💥', color:'danger' },
  FERME:      { label:'Compte fermé',      short:'Fermé',    icon:'⏹️', color:'slate'  },
};
// Tous les événements liés aux comptes/traders pour un mois donné : achats, mensualités dues,
// frais d'activation, payouts reçus, et issues de compte (réussi / breach / fermé) via endDate.
function computeCalendarEvents(monthKeyStr){
  const events = [];
  const pushEvt = (date, type, acc, amount)=>{
    if(!date || monthKey(date)!==monthKeyStr) return;
    events.push({ date, type, amount, account:acc, trader:getTrader(acc.traderId), firm:getFirm(acc.propFirmId) });
  };
  state.accounts.forEach(acc=>{
    if(acc.paymentType==='UNIQUE' && acc.purchasePrice){
      pushEvt(acc.purchaseDate, 'ACHAT', acc, Number(acc.purchasePrice));
    }
    if((acc.type==='PA'||acc.type==='LIVE') && acc.activationFee){
      pushEvt(acc.activationDate || acc.purchaseDate, 'ACTIVATION', acc, Number(acc.activationFee));
    }
    if(acc.status!=='ACTIF' && acc.endDate){
      pushEvt(acc.endDate, acc.status, acc, null);
    }
  });
  computeMonthlyDueItems(monthKeyStr).forEach(it=>{
    pushEvt(it.date, 'MENSUALITE', getAccount(it.accountId), Number(it.amount));
  });
  state.payouts.forEach(p=>{
    const acc = getAccount(p.accountId);
    if(!acc) return;
    pushEvt(p.date, 'PAYOUT', acc, Number(p.amount));
  });
  events.sort((a,b)=> a.date.localeCompare(b.date) || (a.type||'').localeCompare(b.type||''));
  return events;
}
// Grille de cases pour un mois (semaines commençant le lundi), null = case vide de calage
function buildCalendarGrid(monthKeyStr){
  const [y,m] = monthKeyStr.split('-').map(Number);
  const numDays = daysInMonth(y,m);
  let firstWeekday = new Date(y, m-1, 1).getDay(); // 0=dim..6=sam
  firstWeekday = (firstWeekday+6)%7; // 0=lun..6=dim
  const cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push(null);
  for(let d=1; d<=numDays; d++) cells.push(`${y}-${pad2(m)}-${pad2(d)}`);
  while(cells.length%7!==0) cells.push(null);
  return cells;
}

============================================================ */
function computeLeaderboard(){
  const f = state.filters.classement;
  const mk = f.allTime ? null : (f.month || todayISO().slice(0,7));
  return state.traders.map(t=>{
    const accs = state.accounts.filter(a=>a.traderId===t.id);
    const accIds = new Set(accs.map(a=>a.id));
    let pays = state.payouts.filter(p=>accIds.has(p.accountId));
    if(mk) pays = pays.filter(p=>monthKey(p.date)===mk);
    const totalPay = pays.reduce((s,p)=>s+Number(p.amount),0);
    const challenges = accs.filter(a=>a.type==='CHALLENGE');
    const reussis = challenges.filter(a=>a.status==='REUSSI').length;
    const breached = challenges.filter(a=>a.status==='BREACHED').length;
    const tauxReussite = (reussis+breached)>0 ? Math.round(reussis/(reussis+breached)*100) : null;
    const badges = computeTraderBadges(t).filter(b=>b.unlocked).length;
    return { trader:t, totalPay, nbPayouts:pays.length, tauxReussite, badges };
  }).sort((a,b)=> b.totalPay-a.totalPay || (b.tauxReussite||0)-(a.tauxReussite||0));
}

        <div class="section-title" style="display:flex;align-items:center;gap:7px;">${icon('trophy')}Classement des traders</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <input type="month" id="lb-month" value="${mk}" ${f.allTime?'disabled':''} />

        </div>
      </div>
      <div class="panel-body">

        ${noActivity ? `<div class="empty-sub" style="margin-bottom:14px;">Aucun payout enregistré ${f.allTime?'pour le moment':'sur cette période'}.</div>` : ''}
        <div class="lb-podium">
          ${top3.map((r,i)=>`
            <div class="lb-podium-card lb-rank-${i+1}">
              <div class="lb-medal">${medal[i]}</div>
              <div class="lb-pseudo">${r.trader.pseudo}</div>
              <div class="lb-amount">${fmtMoney(r.totalPay)}</div>
              <div class="lb-sub">${r.tauxReussite===null?'—':r.tauxReussite+'% réussite'} · ${r.badges} badge(s)</div>
            </div>`).join('')}
        </div>
        ${rest.length ? `
        <div class="table-wrap" style="margin-top:18px;">
          <table>
            <thead><tr><th>#</th><th>Trader</th><th class="num">Payouts</th><th class="num">Versements</th><th class="num">Taux de réussite</th><th class="num">Badges</th></tr></thead>
            <tbody>
              ${rest.map((r,i)=>`<tr>
                <td class="text-faint">${i+4}</td>
                <td style="font-weight:600;">${r.trader.pseudo}</td>
                <td class="num" style="color:var(--accent)">${fmtMoney(r.totalPay)}</td>
                <td class="num">${r.nbPayouts}</td>
                <td class="num">${r.tauxReussite===null?'—':r.tauxReussite+'%'}</td>
                <td class="num">${r.badges}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>` : ''}
      </div>
    </div>
  `;
}

const MANUAL_CHAPTERS = [
  { n:'1', id:'m-intro', title:"Introduction", html:`
    <p>Contralytix est un outil de suivi et de gestion pour les traders utilisant des comptes PropFirm (Challenge, compte financé PA, compte Live). Il centralise le suivi de l'activité PropFirm d'un ou plusieurs traders : comptes en Challenge, comptes financés, comptes Live, dépenses, payouts, comptabilité, calendrier des échéances, préparation de séance et statistiques. L'outil est pensé aussi bien pour un trader indépendant que pour une équipe suivant plusieurs traders à la fois.</p>

  { n:'3', id:'m-dashboard', title:"Dashboard", html:`

  { n:'15', id:'m-abonnement', title:"Abonnement et tarifs", html:`

  { n:'16', id:'m-admin', title:"Espace Admin", html:`

          <table class="rgpd-table">

============================================================ */
function viewAccounts(){
  const f = state.filters.accounts;
  let list = [...state.accounts];
  if(f.q){
    const q = f.q.toLowerCase();
    list = list.filter(a=>{
      const t = getTrader(a.traderId), pf = getFirm(a.propFirmId);
      return (t&&t.pseudo.toLowerCase().includes(q)) || a.accountNumber.toLowerCase().includes(q) || (pf&&pf.name.toLowerCase().includes(q));
    });
  }
  if(f.trader.length) list = list.filter(a=>f.trader.includes(a.traderId));
  if(f.propfirm) list = list.filter(a=>a.propFirmId===f.propfirm);
  if(f.type) list = list.filter(a=>a.type===f.type);
  if(f.status && f.status.length) list = list.filter(a=>f.status.includes(a.status));
  list.sort((a,b)=>(b.purchaseDate||'').localeCompare(a.purchaseDate||''));

  const statusOpts = [
    { v:'REUSSI', l:'Réussi' }, { v:'ACTIF', l:'Actif' },
    { v:'BREACHED', l:'Breached' }, { v:'FERME', l:'Fermé' },
  ];
  const statusBtnLabel = !f.status.length ? 'Tous statuts'
    : f.status.length===1 ? STATUS_LABELS[f.status[0]]
    : `${f.status.length} statuts`;
  const anyFilterActive = !!(f.q || f.trader.length || f.propfirm || f.type || f.status.length);

  const filterBar = `
    <div class="filter-bar">
      <div class="search-wrap">${icon('search')}<input type="text" id="f-q" placeholder="Rechercher trader, n° compte, propfirm…" value="${f.q}"/></div>
      ${renderMultiSelect('f-trader', state.traders.map(t=>({v:t.id,l:t.pseudo})), f.trader, 'Tous les traders', f.traderMenuOpen)}
      <select id="f-firm"><option value="">Toutes les propfirms</option>${sortedFirms().map(p=>`<option value="${p.id}" ${f.propfirm===p.id?'selected':''}>${p.name}</option>`).join('')}</select>
      <select id="f-type"><option value="">Tous types</option><option value="CHALLENGE" ${f.type==='CHALLENGE'?'selected':''}>Challenge</option><option value="PA" ${f.type==='PA'?'selected':''}>PA</option><option value="LIVE" ${f.type==='LIVE'?'selected':''}>Live</option></select>
      <div class="status-multiselect" id="f-status-wrap">
        <button type="button" class="status-ms-btn" id="f-status-btn">${statusBtnLabel} <span style="opacity:.6;font-size:10px;">▾</span></button>
        <div class="status-ms-menu" id="f-status-menu" style="display:${f.statusMenuOpen?'flex':'none'};">
          ${statusOpts.map(s=>`
            <label class="status-ms-item">
              <input type="checkbox" data-status-opt="${s.v}" ${f.status.includes(s.v)?'checked':''}/>
              ${s.l}
            </label>`).join('')}
          ${f.status.length ? `<button type="button" class="status-ms-clear" id="f-status-clear">Réinitialiser</button>` : ''}
        </div>
      </div>
      <span class="filter-result-count">${list.length} compte${list.length>1?'s':''} affiché${list.length>1?'s':''}${anyFilterActive?` / ${state.accounts.length}`:''}</span>
    </div>`;

  if(state.accounts.length===0){
    return emptyState('card','Aucun compte','Crée un compte Challenge ou PA pour un trader.');
  }
  if(list.length===0){
    return filterBar + emptyState('search','Aucun résultat','Essaie d\u2019élargir tes filtres.');
  }

  return filterBar + list.map(a=>accountCard(a)).join('');
}

function accountCard(a){
  const trader = getTrader(a.traderId), firm = getFirm(a.propFirmId);
  const exp = totalExpensesFor(a.id);
  const pay = totalPayoutsFor(a.id);
  const child = state.accounts.find(x=>x.parentChallengeId===a.id);

  // Lien visuel Challenge <-> PA : les deux comptes d'une même paire partagent une couleur/vignette
  let linkTag = '';
  if(a.type==='CHALLENGE' && child){
    const c = linkColor(a.id);
    linkTag = `<button class="link-tag" data-jump-to="${child.id}" style="color:${c};" title="Voir le PA lié">${icon('link')}PA lié</button>`;
  } else if(a.type==='PA' && a.parentChallengeId && getAccount(a.parentChallengeId)){
    const c = linkColor(a.parentChallengeId);
    linkTag = `<button class="link-tag" data-jump-to="${a.parentChallengeId}" style="color:${c};" title="Voir le Challenge d'origine">${icon('link')}Challenge lié</button>`;
  }

  let actions = '';
  const editable = canEdit(a);
  if(a.type==='CHALLENGE'){
    if(a.status==='ACTIF' && editable){
      actions += `<button class="btn btn-outline btn-sm" data-mark="REUSSI" data-acc="${a.id}">Marquer réussi</button>`;
      actions += `<button class="btn btn-danger btn-sm" data-mark="BREACHED" data-acc="${a.id}">Breached</button>`;
    } else if(a.status==='REUSSI' && !child && editable){
      actions += `<button class="btn btn-primary btn-sm" data-create-pa="${a.id}">${icon('bolt')}Créer le PA</button>`;
    }
  } else if(a.type==='PA' || a.type==='LIVE'){
    if(a.status==='ACTIF'){
      actions += `<button class="btn btn-outline btn-sm" data-payouts="${a.id}">${icon('wallet')}Payouts (${state.payouts.filter(p=>p.accountId===a.id).length})</button>`;
      if(editable){
        if(a.type==='PA'){
          actions += `<button class="btn btn-outline btn-sm" data-to-live="${a.id}">${icon('bolt')}Passer en Live</button>`;
        }
        actions += `<button class="btn btn-outline btn-sm" data-mark="FERME" data-acc="${a.id}">Fermer</button>`;
        actions += `<button class="btn btn-danger btn-sm" data-mark="BREACHED" data-acc="${a.id}">Breached</button>`;
      }
    } else {
      actions += `<button class="btn btn-outline btn-sm" data-payouts="${a.id}">${icon('wallet')}Payouts (${state.payouts.filter(p=>p.accountId===a.id).length})</button>`;
    }
  }
  actions += `<button class="btn btn-ghost btn-sm" data-notes="${a.id}" title="Notes / journal">${icon('edit')}Notes${state.account_notes.filter(n=>n.accountId===a.id).length ? ` (${state.account_notes.filter(n=>n.accountId===a.id).length})` : ''}</button>`;
  actions += `<button class="btn btn-ghost btn-sm" data-history="${a.id}" title="Historique du statut">${icon('clock')}</button>`;
  if(editable){
    actions += `<button class="btn btn-ghost btn-sm" data-edit-account="${a.id}">${icon('edit')}</button>`;
    actions += `<button class="btn btn-ghost btn-sm" data-del-account="${a.id}" style="color:var(--danger)">${icon('trash')}</button>`;
  } else {
    actions += `<span class="badge badge-slate" title="Seul le créateur ou un administrateur peut modifier cet enregistrement">${icon('lock')}Lecture seule</span>`;
  }

  return `
    <div class="acc-card" id="acc-${a.id}" style="--rail:${railColor(a)}">
      <div class="acc-top">
        <div>
          <div class="acc-title">
            <span class="tag-pseudo">${trader?trader.pseudo:'—'}</span>
            ${TYPE_LABELS[a.type]} · <span class="firm-name-inline">${firmLogoHtml(firm,16)}${firm?firm.name:'—'}</span>
            <span class="badge ${statusBadgeClass(a)}">${statusLabel(a)}</span>
            ${linkTag}
          </div>
          <div class="acc-meta">N° ${maskAccountNumber(a.accountNumber)}</div>
        </div>
        <div class="acc-actions">${actions}</div>
      </div>
      <div class="acc-grid">
        <div><div class="acc-field-label">Taille</div><div class="acc-field-value">${sizeLabel(a)}</div></div>
        <div><div class="acc-field-label">Achat</div><div class="acc-field-value">${fmtDate(a.purchaseDate)}</div></div>
        <div><div class="acc-field-label">Dépenses cumulées</div><div class="acc-field-value" style="color:var(--danger)">${fmtMoney(exp)}</div></div>
        <div><div class="acc-field-label">Payouts cumulés</div><div class="acc-field-value" style="color:var(--accent)">${fmtMoney(pay)}</div></div>
      </div>

    </div>
  `;
}
function maskAccountNumber(num){
  if(state.numbersVisible) return `<span class="mono">${num}</span>`;
  const last = num.slice(-4);
  return `<span class="mono">${'•'.repeat(Math.max(0,num.length-4))}${last}</span>`;
}

function csvEscape(v){
  const s = String(v ?? '');
  return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function exportAccountingCSV(){
  const f = state.filters.accounting;
  let lines = computeAllExpenses().map(e=>({...e, kind:'expense'}));
  let pays = state.payouts.map(p=>({...p, kind:'payout'}));
  let all = [...lines, ...pays];
  if(f.month) all = all.filter(x=>monthKey(x.date)===f.month);
  if(f.type){
    if(f.type==='PAYOUT') all = all.filter(x=>x.kind==='payout');
    else all = all.filter(x=>x.kind==='expense' && x.type===f.type);
  }
  if(f.trader.length) all = all.filter(x=>getAccount(x.accountId) && f.trader.includes(getAccount(x.accountId).traderId));
  if(f.propfirm) all = all.filter(x=>getAccount(x.accountId) && getAccount(x.accountId).propFirmId===f.propfirm);
  all.sort((a,b)=>a.date.localeCompare(b.date));

  if(all.length===0){ showToast('Aucune ligne à exporter pour ces filtres.', 'danger'); return; }

  const header = ['Date','Type','Trader','PropFirm','Type de compte','N° de compte','Montant'];
  const rows = all.map(x=>{
    const acc = getAccount(x.accountId);
    const trader = acc ? getTrader(acc.traderId) : null;
    const firm = acc ? getFirm(acc.propFirmId) : null;
    const isPayout = x.kind==='payout';
    const typeLabel = isPayout ? 'Payout' : ({ACHAT:'Achat',MENSUALITE:'Mensualité',ACTIVATION:'Activation'})[x.type];
    const amount = isPayout ? Number(x.amount) : -Number(x.amount); // dépenses en négatif pour lecture comptable directe
    return [x.date, typeLabel, trader?trader.pseudo:'', firm?firm.name:'', acc?TYPE_LABELS[acc.type]:'', acc?acc.accountNumber:'', amount.toFixed(2).replace('.',',')];
  });
  const csvContent = '\uFEFF' + [header, ...rows].map(r=>r.map(csvEscape).join(';')).join('\r\n');
  const blob = new Blob([csvContent], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `comptabilite_${todayISO()}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  showToast(`Export CSV téléchargé (${all.length} ligne(s)).`);
}

  const totalPay = rows.filter(r=>r.Montant>0).reduce((s,r)=>s+r.Montant,0);
  const net = totalPay - totalExp;
  const kpis = [
    ['Dépenses', fmtMoney(totalExp), [200,60,50]],

  y += 20;

    { key:'Date', x:48 }, { key:'Type', x:103 }, { key:'Trader', x:158 },
    { key:'PropFirm', x:238 }, { key:'Type de compte', x:318 }, { key:'N° de compte', x:388 },
  ];
  function tableHeader(){
    doc.setFillColor(30,34,40);
    doc.rect(48, y-12, 499, 18, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(255,255,255);
    cols.forEach(c=>doc.text(c.key, c.x, y));
    doc.text('Montant', 547, y, { align:'right' });
    y += 16;
  }
  tableHeader();

  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  rows.forEach((r,i)=>{

    if(i%2===1){ doc.setFillColor(245,246,248); doc.rect(48, y-10, 499, 14, 'F'); }
    doc.setTextColor(40,40,40);

/* ============================================================
   VIEW: BILAN VISUEL (cartes mensuelles par trader / propfirm,
   pensées pour être exportées en PNG pour les vidéos YouTube)
============================================================ */
function computeBilanData(month, traderIds){
  const lines = computeAllExpenses().filter(e=>monthKey(e.date)===month);
  const pays = state.payouts.filter(p=>monthKey(p.date)===month);
  const map = new Map();
  function entryFor(tId, fId){
    const key = tId+'|'+fId;
    if(!map.has(key)) map.set(key, { traderId:tId, firmId:fId, expense:0, payout:0 });
    return map.get(key);
  }
  lines.forEach(e=>{
    const acc = getAccount(e.accountId);
    if(!acc) return;
    if(traderIds && traderIds.length && !traderIds.includes(acc.traderId)) return;
    entryFor(acc.traderId, acc.propFirmId).expense += e.amount;
  });
  pays.forEach(p=>{
    const acc = getAccount(p.accountId);
    if(!acc) return;
    if(traderIds && traderIds.length && !traderIds.includes(acc.traderId)) return;
    entryFor(acc.traderId, acc.propFirmId).payout += Number(p.amount);
  });
  return Array.from(map.values())
    .map(e=>({ ...e, net: e.payout - e.expense, trader: getTrader(e.traderId), firm: getFirm(e.firmId) }))
    .filter(e=>e.trader && e.firm)
    .sort((a,b)=> b.net - a.net || a.firm.name.localeCompare(b.firm.name,'fr',{sensitivity:'base'}));
}

    link.href = canvas.toDataURL('image/png');

async function loadNasdaqEarnings(){

  const date = document.getElementById('nsdq-date').value || todayISO();

  try{
    const res = await fetch(`/.netlify/functions/nasdaq-earnings?date=${date}`);
    const data = await res.json();
    if(!res.ok){
      resultEl.innerHTML = `<div style="color:var(--danger);">Erreur : ${data.error||'requête échouée'}.</div>`;
      return;
    }
    const list = data.rows || [];
    if(list.length===0){
      resultEl.innerHTML = `<div style="color:var(--text-faint);">Aucun résultat d'entreprise trouvé pour cette date (marché fermé ou pas de publication ce jour-là).</div>`;

        ? `<span title="Avant ouverture" style="display:inline-flex;color:var(--warning, #e6b800);width:15px;height:15px;vertical-align:-3px;">${icon('sun')}</span>`

    const parseCap = v => { if(v===null||v===undefined||v==='') return 0; const n = Number(String(v).replace(/[^0-9.-]/g,'')); return isNaN(n)?0:n; };
    const fmtCap = v => { const n = parseCap(v); if(!n) return '—'; if(n>=1e9) return '$'+(n/1e9).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1})+'B'; if(n>=1e6) return '$'+(n/1e6).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1})+'M'; return '$'+n.toLocaleString('fr-FR'); };
    const rows = list.slice(0, 80).map(e=>`
        <tr>
          <td><strong>${e.symbol||'—'}</strong></td>
          <td>${e.name||'—'}</td>
          <td style="text-align:center;">${timeIcon(e.time)}</td>
          <td class="num mono">${e.epsForecast||'—'}</td>
          <td class="num mono">${fmtCap(e.marketCap)}</td>
        </tr>`).join('');
    resultEl.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Ticker</th><th>Société</th><th>Horaire</th><th>EPS prévu</th><th>Cap. marché</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="font-size:10.5px;color:var(--text-faint);margin-top:8px;">${list.length} résultat(s) le ${date}.</div>`;
  } catch(e){
    resultEl.innerHTML = `<div style="color:var(--danger);">Erreur réseau : ${e.message}</div>`;
  }
}

// Prompt par défaut proposé dans le formulaire de prépa de séance : l'utilisateur
// peut le modifier librement avant de générer le brief (voir prepFormModal).
const DEFAULT_AI_PROMPT = `Fais-moi un brief météo pour ma session de scalping d'aujourd'hui sur le MNQ (ATAS / Carnet d'ordres). Va droit au but, pas de blabla inutile, donne-moi juste les faits à travers ces 4 points précis :
1. LE CONTEXTE DU JOUR : Y a-t-il des annonces économiques majeures, des échéances techniques sur les contrats ou les options, ou une actualité exceptionnelle qui impacte le secteur de la Tech ?
2. TEXTURE DU CARNET : À quoi doit-on s'attendre pour l'Open à 15h30 ? Un carnet "lourd" avec des absorptions logiques, ou un carnet "creux/fin" instable et propice au slippage ?
3. LA DYNAMIQUE DU MOMENT : Quel est le comportement dominant des derniers jours à l'Open (range, tendance rectiligne, rotation sectorielle...) ?
4. FEU VERT / FEU ROUGE : Quel est ton conseil pour mes objectifs de 50 ticks aujourd'hui ? (Taille de position normale, taille réduite, ou rester à l'écart ?)`;

// apiKey est optionnel : si absent, la fonction Netlify utilise la clé du site
// (variable d'environnement GROQ_API_KEY) ; si fourni, elle l'utilise à la
// place (repli avec la clé personnelle de l'utilisateur).
async function callAiSynthesis(promptText, apiKey){
  try{
    const res = await fetch('/.netlify/functions/ai-synthesis', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(apiKey ? { prompt: promptText, apiKey } : { prompt: promptText })
    });
    const data = await res.json();
    if(!res.ok){
      if(data.overloaded){
        throw new Error('Le service IA est temporairement surchargé — réessaie dans quelques minutes.');
      }
      throw new Error(data.error || 'Erreur API');
    }
    return data.text || null;
  } catch(e){
    showToast('Erreur IA' + (apiKey ? ' (clé personnelle)' : '') + ' : ' + e.message, 'danger');
    return null;
  }
}

  const subs = state.allSubscriptions || [];
  const activeSubs = subs.filter(s=>s.status==='ACTIVE');
  const totalUsers = state.profiles.length;
  const premiumCount = state.profiles.filter(p=>p.role==='PREMIUM'||p.role==='ADMIN').length;
  const freeCount = totalUsers - premiumCount;
  const lifetimeCount = activeSubs.filter(s=>s.billingCycle==='LIFETIME' && s.plan==='PREMIUM').length;
  const cancelledCount = subs.filter(s=>s.status==='CANCELLED').length;

  // Hypothèse de prix par défaut pour le calcul MRR/ARR — ajuste selon tes prix Stripe réels.
  const PRICE_MONTHLY = 9.9;
  const PRICE_YEARLY = 90;
  const mrr = activeSubs.reduce((sum,s)=>{
    if(s.billingCycle==='MONTHLY') return sum + PRICE_MONTHLY;
    if(s.billingCycle==='YEARLY') return sum + (PRICE_YEARLY/12);
    return sum;
  }, 0);
  const arr = mrr * 12;
  const totalRevenue = activeSubs.reduce((sum,s)=>{
    if(s.billingCycle==='LIFETIME') return sum + PRICE_YEARLY*2; // approximation, adapte au vrai prix Lifetime
    return sum;
  }, 0) + mrr; // approximation simple, à affiner avec un vrai historique de paiements Stripe

  const lastSignups = [...state.profiles].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,5);

  const statCard = (label, value) => `
    <div class="panel" style="padding:14px 16px;">
      <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;">${label}</div>
      <div style="font-size:22px;font-weight:700;">${value}</div>
    </div>`;

  const dashboard = `
    <div class="panel-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;">
      ${statCard('Utilisateurs', totalUsers)}
      ${statCard('Premium', premiumCount)}
      ${statCard('Free', freeCount)}
      ${statCard('Lifetime', lifetimeCount)}
      ${statCard('MRR', fmtMoney(mrr))}
      ${statCard('ARR', fmtMoney(arr))}
      ${statCard('Revenus (approx.)', fmtMoney(totalRevenue))}
      ${statCard('Résiliations', cancelledCount)}
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-head"><div class="section-title">Dernières inscriptions</div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Email</th><th>Plan</th><th>Inscrit le</th></tr></thead>
          <tbody>
            ${lastSignups.length===0 ? `<tr><td colspan="3"><div class="empty-sub" style="padding:12px 0;">Aucune inscription.</div></td></tr>` :
              lastSignups.map(p=>`<tr>
                <td>${p.email||'—'}</td>
                <td><span class="badge ${p.role==='ADMIN'?'badge-gold':p.role==='PREMIUM'?'badge-gold':'badge-slate'}">${p.role}</span></td>
                <td class="text-dim mono">${p.createdAt?fmtDate(p.createdAt.slice(0,10)):'—'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;

  const usersTable = `
    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-head"><div class="section-title">Utilisateurs (${state.profiles.length})</div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Email</th><th>Plan</th><th>Formule</th><th>Inscrit le</th><th>Dernière connexion</th><th></th></tr></thead>
          <tbody>
            ${state.profiles.length===0 ? `<tr><td colspan="6"><div class="empty-sub" style="padding:16px 0;">Aucun utilisateur.</div></td></tr>` :
              state.profiles.map(p=>`<tr>
                <td>${p.email||'—'}${p.id===currentUserId()?' <span class="text-faint">(toi)</span>':''}</td>
                <td><span class="badge ${p.role==='ADMIN'?'badge-gold':p.role==='PREMIUM'?'badge-gold':'badge-slate'}">${p.role}</span></td>
                <td class="text-dim">${(p.role==='PREMIUM' && p.subscription && p.subscription.billingCycle) ? p.subscription.billingCycle : '—'}</td>
                <td class="text-dim mono">${p.createdAt?fmtDate(p.createdAt.slice(0,10)):'—'}</td>
                <td class="text-dim mono">${p.lastLogin?fmtDate(p.lastLogin.slice(0,10)):'—'}</td>
                <td style="display:flex;gap:6px;flex-wrap:wrap;">
                  ${p.id===currentUserId() || p.role==='ADMIN' ? '' : `
                    ${p.role!=='PREMIUM' ? `<button class="btn btn-outline btn-sm" data-set-plan="${p.id}" data-plan="PREMIUM" data-cycle="MONTHLY">Passer Premium</button>` : ''}
                    ${p.role!=='FREE' ? `<button class="btn btn-outline btn-sm" data-set-plan="${p.id}" data-plan="FREE" data-cycle="">Repasser Free</button>` : ''}
                    <button class="btn btn-outline btn-sm" data-set-plan="${p.id}" data-plan="PREMIUM" data-cycle="LIFETIME">Offrir Lifetime</button>
                    <button class="btn btn-outline btn-sm" style="color:var(--danger);border-color:var(--danger);" data-delete-user="${p.id}" data-email="${(p.email||'cet utilisateur').replace(/"/g,'&quot;')}">Supprimer</button>
                  `}
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;

  const ann = state.appSettings.announcement || { enabled:false, message:'', type:'info' };
  const settingsPanel = `
    <div class="panel-grid" style="display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:16px;align-items:start;">
      <div class="panel">
        <div class="panel-head"><div class="section-title" style="display:flex;align-items:center;gap:7px;">${icon('layout')}Gestion des pages</div></div>
        <div class="field-hint" style="margin:0 0 4px;">Masque une page du menu pour tous les utilisateurs non-admin. Le Dashboard et l\u2019Admin restent toujours accessibles.</div>
        <div>
          ${BASE_NAV.filter(n=>HIDEABLE_PAGE_IDS.includes(n.id)).map(n=>{
            const isHidden = state.appSettings.hiddenPages.includes(n.id);
            return `
            <div class="page-visibility-row">
              <div class="page-visibility-left">${icon(n.icon)}${n.label}${isHidden?`<span class="badge badge-slate">Masquée</span>`:''}</div>
              <label class="switch" title="${isHidden?'Réafficher cette page':'Masquer cette page'}">
                <input type="checkbox" data-toggle-page="${n.id}" ${isHidden?'':'checked'}/>
                <span class="switch-track"></span>
              </label>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><div class="section-title" style="display:flex;align-items:center;gap:7px;">${icon('megaphone')}Message global</div></div>
        <div class="field-hint" style="margin:0 0 10px;">Affiche une bannière en haut de l\u2019application, pour tous les utilisateurs, tant qu\u2019elle est activée.</div>
        <div class="field" style="margin-bottom:10px;">
          <label style="display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;">
            <label class="switch"><input type="checkbox" id="ann-enabled" ${ann.enabled?'checked':''}/><span class="switch-track"></span></label>
            Activer la bannière
          </label>
        </div>
        <div class="field" style="margin-bottom:10px;">
          <textarea id="ann-message" rows="3" placeholder="Ex : Maintenance prévue ce soir de 22h à 23h." style="width:100%;resize:vertical;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 11px;font-family:inherit;font-size:13px;">${escapeHtml(ann.message||'')}</textarea>
        </div>
        <div class="field" style="margin-bottom:12px;display:flex;gap:8px;align-items:center;">
          <span class="field-hint" style="margin:0;">Style :</span>
          <select id="ann-type" style="background:var(--surface-2);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:6px 8px;font-size:13px;">
            <option value="info" ${ann.type==='info'?'selected':''}>Information</option>
            <option value="warning" ${ann.type==='warning'?'selected':''}>Avertissement</option>
            <option value="danger" ${ann.type==='danger'?'selected':''}>Urgent</option>
          </select>
        </div>
        <button class="btn btn-primary btn-sm" id="ann-save">${icon('check')}Enregistrer</button>
      </div>
    </div>`;

  const logPanel = `
    <div class="panel">
      <div class="panel-head"><div class="section-title" style="display:flex;align-items:center;gap:7px;">${icon('clock')}Journal d\u2019activité (${state.activityLog.length})</div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Utilisateur</th><th>Action</th><th>Détail</th></tr></thead>
          <tbody>
            ${state.activityLog.length===0 ? `<tr><td colspan="4"><div class="empty-sub" style="padding:16px 0;">Aucune activité enregistrée pour l\u2019instant.</div></td></tr>` :
              state.activityLog.map(l=>`<tr>
                <td class="mono text-dim" style="white-space:nowrap;">${new Date(l.createdAt).toLocaleString('fr-FR')}</td>
                <td class="text-dim">${l.actorEmail||'—'}</td>
                <td><span class="badge badge-slate">${l.action}</span></td>
                <td class="text-dim">${l.description||''}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;

  return dashboard + settingsPanel + usersTable + logPanel;
}

function viewSubscription(){
  const role = state.profile ? state.profile.role : 'FREE';
  const sub = state.subscription || { plan:'FREE', status:'ACTIVE', billingCycle:null };
  const isPremium = role==='PREMIUM' || role==='ADMIN';

  const statusLabelFr = { ACTIVE:'Actif', CANCELLED:'Annulé', EXPIRED:'Expiré' }[sub.status] || sub.status || '—';
  // On n'affiche une formule/cycle de facturation que pour un compte réellement Premium/Admin.
  // Ça évite d'afficher "Lifetime" pour un compte Free si une ligne "subscriptions" orpheline
  // (billing_cycle non nettoyé) traîne encore en base pour cet utilisateur.
  const cycleLabelFr = isPremium ? ({ MONTHLY:'Mensuel', YEARLY:'Annuel', LIFETIME:'Lifetime' }[sub.billingCycle] || '—') : '—';

  const currentPlanPanel = `
    <div class="panel" style="margin-bottom:16px;padding:20px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
        ${planBadgeHtml()}
        <div style="font-size:16px;font-weight:700;">${role==='ADMIN' ? 'Accès Admin (toutes fonctionnalités)' : (isPremium ? 'Formule Premium' : 'Formule Free')}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;font-size:13px;">
        <div><div class="text-faint" style="font-size:11px;text-transform:uppercase;margin-bottom:3px;">Statut</div>${statusLabelFr}</div>
        <div><div class="text-faint" style="font-size:11px;text-transform:uppercase;margin-bottom:3px;">Formule</div>${cycleLabelFr}</div>
        <div><div class="text-faint" style="font-size:11px;text-transform:uppercase;margin-bottom:3px;">Début</div>${sub.startedAt ? fmtDate(sub.startedAt.slice(0,10)) : '—'}</div>
        <div><div class="text-faint" style="font-size:11px;text-transform:uppercase;margin-bottom:3px;">Renouvellement</div>${(isPremium && sub.expiresAt) ? fmtDate(sub.expiresAt.slice(0,10)) : (isPremium && sub.billingCycle==='LIFETIME' ? 'Jamais (Lifetime)' : '—')}</div>
      </div>
      ${role!=='ADMIN' ? `
        <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
          ${sub.stripeCustomerId ? `<button class="btn btn-outline" onclick="openBillingPortal()">Portail Stripe (factures, résiliation, formule)</button>` : ''}
        </div>` : ''}
    </div>`;

  const cycle = state.filters.tarifs.cycle; // 'MONTHLY' | 'YEARLY'
  const premiumPrice = cycle==='YEARLY' ? PRICING.YEARLY : PRICING.MONTHLY;
  const currentCycle = sub.billingCycle;

  // Code promo actif (le cas échéant) saisi par l'utilisateur pour cette session
  const promo = state.filters.tarifs.promoResult && state.filters.tarifs.promoResult.valid ? state.filters.tarifs.promoResult : null;
  const promoAppliesTo = (cy) => promo && promo.appliesTo.includes(cy);
  const priceHtml = (baseAmount, cy) => promoAppliesTo(cy)
    ? `<span style="text-decoration:line-through;opacity:.5;font-size:15px;margin-right:6px;">${baseAmount}€</span>${applyPromoToPrice(baseAmount, promo)}€`
    : `${baseAmount}€`;

  const checkItem = (label) => `<div style="display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:4px 0;"><span class="price-check" style="color:var(--accent);flex-shrink:0;margin-top:1px;">${icon('check')}</span><span>${label}</span></div>`;

  const freeFeatures = [
    'Trader(s) illimités',
    `${perms().maxFreeAccounts} comptes gratuits par trader`,
    'Sessions live illimitées',
    'Suivi des payouts',
    'Support communautaire',
  ];
  const premiumFeatures = [
    'Tout Free, plus :',
    'Comptes illimités par trader',
    'Import CSV / Excel',
    'Exports Excel & PDF',
    'Calendrier (payouts, breach, échéances…)',
    'Bilan visuel & statistiques avancées',
    'Classement',
    'Sauvegarde (backup)',
    'Support prioritaire',
  ];

  const planCard = ({ name, badge, price, priceNote, features, ctaLabel, ctaAction, highlight, gold, isCurrent }) => `
    <div class="panel" style="padding:20px;position:relative;${highlight?`border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);`:''}${gold?`border-color:var(--gold);`:''}">
      ${badge ? `<div style="position:absolute;top:-11px;left:20px;background:${gold?'var(--gold)':'var(--accent)'};color:${gold?'#1A130A':'var(--accent-text)'};font-size:10.5px;font-weight:700;padding:2px 10px;border-radius:100px;letter-spacing:.3px;">${badge}</div>` : ''}
      <div style="font-weight:700;font-size:15px;margin-bottom:4px;${gold?'color:var(--gold);':''}">${name}</div>
      <div style="display:flex;align-items:baseline;gap:4px;margin:10px 0 2px;">
        <span style="font-size:26px;font-weight:800;font-family:'Space Grotesk',sans-serif;">${price}</span>
        <span class="text-faint" style="font-size:12px;">${priceNote||''}</span>
      </div>
      <div style="height:14px;"></div>
      <div style="border-top:1px solid var(--border);padding-top:12px;margin-bottom:16px;">
        ${features.map(checkItem).join('')}
      </div>
      ${isCurrent
        ? `<div class="btn btn-outline" style="width:100%;text-align:center;opacity:.7;pointer-events:none;">✓ Formule actuelle</div>`
        : `<button class="btn ${gold||highlight?'btn-primary':'btn-outline'}" style="width:100%;" onclick="${ctaAction}">${ctaLabel}</button>`}
    </div>`;

  const plansPanel = role==='ADMIN' ? '' : `
    <div style="text-align:center;margin-bottom:20px;">
      <div class="section-title" style="margin-bottom:14px;">Formules disponibles</div>
      <div class="radio-group" style="display:inline-flex;">
        <div class="radio-chip ${cycle==='MONTHLY'?'selected':''}" data-tarifs-cycle="MONTHLY">Mensuel</div>
        <div class="radio-chip ${cycle==='YEARLY'?'selected':''}" data-tarifs-cycle="YEARLY">Annuel <span class="badge badge-accent" style="margin-left:4px;">-17%</span></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;align-items:start;">
      ${planCard({
        name:'Free', price:'0€', priceNote:'/mois',
        features: freeFeatures,
        isCurrent: !isPremium,
      })}
      ${planCard({
        name:'Premium', badge:'Populaire', highlight:true,
        price: priceHtml(premiumPrice.amount, cycle),
        priceNote: premiumPrice.period + (cycle==='YEARLY' ? ` (soit ${PRICING.YEARLY.monthlyEquivalent}€/mois)` : ''),
        features: premiumFeatures,
        ctaLabel: cycle==='YEARLY' ? "S'abonner à l'année" : "S'abonner au mois",
        ctaAction: `startCheckout('${cycle}')`,
        isCurrent: isPremium && (currentCycle==='MONTHLY' || currentCycle==='YEARLY') && currentCycle===cycle,
      })}
      ${planCard({
        name:'Lifetime', badge:'Accès à vie', gold:true,
        price: priceHtml(PRICING.LIFETIME.amount, 'LIFETIME'), priceNote: PRICING.LIFETIME.period,
        features: [...premiumFeatures, 'Aucun renouvellement, jamais'],
        ctaLabel:'Paiement unique',
        ctaAction:"startCheckout('LIFETIME')",
        isCurrent: currentCycle==='LIFETIME',
      })}
    </div>`;

  const promoResult = state.filters.tarifs.promoResult;
  const promoPanel = role==='ADMIN' ? '' : `
    <div class="panel" style="max-width:420px;margin:0 auto 20px;padding:14px 16px;">
      <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text-dim);margin-bottom:8px;">Code promo</div>
      <div style="display:flex;gap:8px;">
        <input id="promo-code-input" placeholder="Entrer un code" value="${escapeHtml(state.filters.tarifs.promoInput||'')}" style="flex:1;text-transform:uppercase;"/>
        <button class="btn btn-outline" id="promo-apply-btn">Appliquer</button>
      </div>
      ${promoResult ? (promoResult.valid
        ? `<div style="margin-top:8px;font-size:12.5px;color:var(--accent);">✓ Code appliqué (${promoResult.discountType==='PERCENT' ? promoResult.discountValue+'%' : promoResult.discountValue+'€'} de réduction sur ${promoResult.appliesTo.map(c=>({MONTHLY:'Mensuel',YEARLY:'Annuel',LIFETIME:'Lifetime'}[c]||c)).join(', ')}).</div>`
        : `<div style="margin-top:8px;font-size:12.5px;color:var(--danger,#e5484d);">${escapeHtml(promoResult.reason||'Code invalide.')}</div>`
      ) : ''}
    </div>`;

  const promoAdminPanel = role!=='ADMIN' ? '' : `
    <div class="panel" style="margin-bottom:16px;padding:20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div class="section-title" style="margin:0;">Codes promo</div>
        <button class="btn btn-primary btn-sm" id="promo-new-btn">+ Nouveau code</button>
      </div>
      ${state.promo_codes.length===0 ? `<div class="text-faint" style="font-size:13px;">Aucun code promo pour l'instant.</div>` : `
      <table class="table">
        <thead><tr><th>Code</th><th>Libellé</th><th>Réduction</th><th>Formules</th><th>Validité</th><th>Utilisations</th><th>Statut</th><th></th></tr></thead>
        <tbody>
          ${state.promo_codes.map(p=>`
            <tr>
              <td><b>${escapeHtml(p.code)}</b></td>
              <td class="text-dim">${escapeHtml(p.label||'—')}</td>
              <td>${p.discountType==='PERCENT' ? p.discountValue+'%' : p.discountValue+'€'}</td>
              <td class="text-dim">${(p.appliesTo||[]).map(c=>({MONTHLY:'Mensuel',YEARLY:'Annuel',LIFETIME:'Lifetime'}[c]||c)).join(', ')||'—'}</td>
              <td class="text-dim">${p.validFrom?fmtDate(p.validFrom):'…'} → ${p.validUntil?fmtDate(p.validUntil):'…'}</td>
              <td class="text-dim">${p.usesCount||0}${p.maxUses?' / '+p.maxUses:''}</td>
              <td>${p.active!==false ? `<span class="badge badge-accent">Actif</span>` : `<span class="badge">Désactivé</span>`}</td>
              <td style="white-space:nowrap;">
                <button class="btn btn-ghost btn-sm" data-edit-promo="${p.id}" title="Modifier">${icon('edit')}</button>
                <button class="btn btn-ghost btn-sm" data-del-promo="${p.id}" title="Supprimer">${icon('trash')}</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`}
    </div>`;

  return currentPlanPanel + promoAdminPanel + promoPanel + plansPanel;
}

    <div class="empty-title">Fonctionnalité Premium</div>

    <button class="btn btn-primary upgrade-cta" onclick="openUpgradeModal('${label.replace(/'/g,"\\'")}')">🚀 Passer à Premium</button>
