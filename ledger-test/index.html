<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contralytix — Gestion Propfirm</title>
<link id="favicon" rel="icon" type="image/png" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root[data-theme="dark"]{
  --bg:#0B0F14; --surface:#12181F; --surface-2:#1A222C; --surface-3:#212A34;
  --border:#232D38; --border-soft:#1B2430;
  --text:#E8EDF2; --text-dim:#8B98A5; --text-faint:#5B6673;
  --accent:#3ED6B5; --accent-dim:rgba(62,214,181,0.14); --accent-text:#0B0F14;
  --danger:#E85C4A; --danger-dim:rgba(232,92,74,0.14);
  --gold:#D9A65A; --gold-dim:rgba(217,166,90,0.14);
  --slate:#7C8B9A; --slate-dim:rgba(124,139,154,0.14);
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
}
:root[data-theme="light"]{
  --bg:#F1F3F5; --surface:#FFFFFF; --surface-2:#F7F8F9; --surface-3:#EDEFF1;
  --border:#E1E5E9; --border-soft:#EAEDF0;
  --text:#10151A; --text-dim:#5B6673; --text-faint:#8B98A5;
  --accent:#149A80; --accent-dim:rgba(20,154,128,0.10); --accent-text:#FFFFFF;
  --danger:#C6402E; --danger-dim:rgba(198,64,46,0.10);
  --gold:#B9803C; --gold-dim:rgba(185,128,60,0.10);
  --slate:#5B6673; --slate-dim:rgba(91,102,115,0.08);
  --shadow: 0 8px 24px rgba(20,30,40,0.08);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.brand,.nav-label,.stat-label,.section-title{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--accent-dim);}
a{color:var(--accent);text-decoration:none;}

.app{display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px 8px;}
.brand-mark{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--gold));flex-shrink:0;position:relative;}
.brand-mark::after{content:'';position:absolute;left:6px;top:8px;width:16px;height:2px;background:var(--bg);opacity:.55;}
.brand-mark::before{content:'';position:absolute;left:6px;top:13px;width:10px;height:2px;background:var(--bg);opacity:.55;}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.2px;}
.brand-sub{font-size:10px;color:var(--text-faint);letter-spacing:1.5px;text-transform:uppercase;margin-top:-2px;}

.nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--text-dim);font-size:13.5px;font-weight:500;border-left:3px solid transparent;transition:background .12s,color .12s;}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--accent-dim);color:var(--text);border-left-color:var(--accent);}
.nav-foot{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--border-soft);}
.icon-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-size:12px;}
.icon-btn:hover{color:var(--text);border-color:var(--text-faint);}
.icon-btn svg{width:14px;height:14px;}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5;}
.topbar h1{font-size:19px;margin:0;font-weight:600;}
.topbar-sub{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
.topbar-actions{display:flex;gap:10px;align-items:center;}
.content{padding:24px 28px 60px;flex:1;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600;border:1px solid transparent;transition:filter .12s,background .12s;white-space:nowrap;}
.btn svg{width:14px;height:14px;}
.btn-primary{background:var(--accent);color:var(--accent-text);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--text-faint);}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid transparent;padding:7px 10px;}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn-danger:hover{background:var(--danger-dim);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* STAT TILES */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--rail,var(--slate));border-radius:10px;padding:16px 16px;}
.stat-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;font-weight:600;}
.stat-value{font-size:24px;font-weight:700;margin-top:8px;font-family:'JetBrains Mono',monospace;}
.stat-sub{font-size:11.5px;color:var(--text-dim);margin-top:4px;}

/* CARDS / PANELS */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border-soft);}
.section-title{font-size:14px;font-weight:600;}
.panel-body{padding:16px 18px;}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}

/* TABLE */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
.num{font-family:'JetBrains Mono',monospace;text-align:right;}

/* SORTABLE TABLE HEADERS (Comparatif, etc.) */
th.th-sortable{cursor:pointer;user-select:none;transition:color .12s;}
th.th-sortable:hover{color:var(--text);}
th.th-sortable .th-sort-inner{display:inline-flex;align-items:center;gap:4px;}
th.th-sortable.num .th-sort-inner{flex-direction:row-reverse;}
th.th-sortable svg{width:11px;height:11px;flex-shrink:0;opacity:.55;}
th.th-sort-active{color:var(--accent);}
th.th-sort-active svg{opacity:1;}

/* ANNOUNCEMENT BANNER (Admin > message global) */
.announce-banner{display:flex;align-items:center;gap:10px;padding:10px 28px;font-size:13px;font-weight:500;border-bottom:1px solid var(--border);}
.announce-banner svg{width:16px;height:16px;flex-shrink:0;}
.announce-info{background:var(--accent-dim);color:var(--accent);}
.announce-warning{background:var(--gold-dim);color:var(--gold);}
.announce-danger{background:var(--danger-dim);color:var(--danger);}

/* NAV: masked-page indicator (visible only to admins) */
.nav-item-hidden{opacity:.55;}
.nav-hidden-badge{margin-left:auto;padding:3px 5px !important;display:inline-flex;}
.nav-hidden-badge svg{width:11px;height:11px;}

/* TOGGLE SWITCH (Admin panels) */
.switch{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch-track{position:absolute;inset:0;background:var(--surface-3);border:1px solid var(--border);border-radius:22px;transition:background .15s,border-color .15s;cursor:pointer;}
.switch-track::before{content:'';position:absolute;width:16px;height:16px;left:2px;top:2px;background:var(--text-dim);border-radius:50%;transition:transform .15s,background .15s;}
.switch input:checked + .switch-track{background:var(--accent-dim);border-color:var(--accent);}
.switch input:checked + .switch-track::before{transform:translateX(16px);background:var(--accent);}
.page-visibility-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border-soft);}
.page-visibility-row:last-child{border-bottom:none;}
.page-visibility-left{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;}
.page-visibility-left svg{width:16px;height:16px;color:var(--text-dim);flex-shrink:0;}
/* BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge svg{width:11px;height:11px;flex-shrink:0;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-accent{background:var(--accent-dim);color:var(--accent);}
.badge-danger{background:var(--danger-dim);color:var(--danger);}
.badge-gold{background:var(--gold-dim);color:var(--gold);}
.badge-slate{background:var(--slate-dim);color:var(--slate);}

/* FILTER BAR */
.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.filter-bar input[type=text],.filter-bar select,.filter-bar input[type=month]{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:7px;font-size:12.5px;font-family:inherit;}
.filter-bar input[type=text]{min-width:200px;}
.status-multiselect{position:relative;}
.status-ms-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:7px;font-size:12.5px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.status-ms-btn:hover{border-color:var(--accent);}
.status-ms-menu{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:6px;z-index:40;min-width:170px;flex-direction:column;gap:1px;}
.status-ms-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12.5px;cursor:pointer;}
.status-ms-item:hover{background:var(--surface-2);}
.status-ms-item input{accent-color:var(--accent);cursor:pointer;}
.status-ms-clear{margin-top:3px;background:none;border:none;border-top:1px solid var(--border-soft);color:var(--text-faint);font-size:11.5px;padding:7px 8px 2px;cursor:pointer;text-align:left;font-family:inherit;}
.status-ms-clear:hover{color:var(--text);}
.stat-tile-clickable{cursor:pointer;transition:transform .1s ease,border-color .1s ease;}
.stat-tile-clickable:hover{border-color:var(--rail,var(--accent));transform:translateY(-1px);}
.clickable-row{cursor:pointer;}
.clickable-row:hover{background:var(--surface-2);}
.filter-result-count{font-size:12px;color:var(--text-faint);white-space:nowrap;margin-left:2px;}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-faint);}
.search-wrap input{padding-left:30px !important;}

/* EMPTY STATE */
.empty{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty svg{width:34px;height:34px;color:var(--text-faint);margin-bottom:10px;}
.price-check svg{width:14px;height:14px;flex-shrink:0;}
.empty-title{font-weight:600;color:var(--text);margin-bottom:4px;font-size:14px;}
.empty-sub{font-size:12.5px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fadeIn .12s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:480px;max-height:88vh;overflow:auto;box-shadow:var(--shadow);animation:pop .14s ease;}
@keyframes pop{from{transform:translateY(6px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal.wide{max-width:640px;}
.modal.xwide{max-width:960px;}

/* CHANGELOG */
.manual-toc{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 18px;}
.manual-toc a{display:flex;gap:8px;padding:6px 8px;border-radius:7px;color:var(--text-dim);font-size:13px;}
.manual-toc a:hover{background:var(--surface-2);color:var(--text);}
.manual-toc a span.mn{color:var(--text-faint);font-family:'JetBrains Mono',monospace;font-size:11.5px;min-width:20px;}
.manual-chapter{padding:22px 0;border-bottom:1px solid var(--border-soft);scroll-margin-top:80px;}
.manual-chapter:last-child{border-bottom:none;}
.manual-chapter h2{font-size:16.5px;margin:0 0 10px;display:flex;align-items:center;gap:9px;}
.manual-chapter h2 .mn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;background:var(--accent-dim);color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:12px;flex-shrink:0;}
.manual-chapter h3{font-size:13.5px;margin:16px 0 6px;color:var(--text);}
.manual-chapter p{font-size:13px;color:var(--text-dim);line-height:1.65;margin:0 0 10px;}
.manual-chapter ul{margin:0 0 10px;padding-left:18px;}
.manual-chapter li{font-size:13px;color:var(--text-dim);line-height:1.6;margin-bottom:5px;}
.manual-chapter li b, .manual-chapter p b{color:var(--text);font-weight:600;}
.manual-shot{margin:12px 0 16px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface-2);}
.manual-shot img{display:block;width:100%;height:auto;cursor:zoom-in;}
.manual-shot-cap{padding:8px 12px;font-size:11.5px;color:var(--text-faint);border-top:1px solid var(--border-soft);}
.manual-back-top{position:fixed;bottom:22px;right:28px;z-index:6;}
.rgpd-block{padding:18px 0;border-bottom:1px solid var(--border-soft);}
.rgpd-block:last-child{border-bottom:none;}
.rgpd-block h2{font-size:15px;margin:0 0 8px;}
.rgpd-block p{font-size:13px;color:var(--text-dim);line-height:1.65;margin:0 0 10px;}
.rgpd-block ul{margin:0 0 10px;padding-left:18px;}
.rgpd-block li{font-size:13px;color:var(--text-dim);line-height:1.6;margin-bottom:5px;}
.rgpd-table{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0;}
.rgpd-table th{text-align:left;padding:8px 10px;background:var(--surface-2);color:var(--text-faint);font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
.rgpd-table td{padding:8px 10px;border-bottom:1px solid var(--border-soft);color:var(--text-dim);vertical-align:top;}
.changelog-list{display:flex;flex-direction:column;gap:4px;}
.changelog-row{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border-soft);}
.changelog-row:last-child{border-bottom:none;}
.changelog-row .badge{flex-shrink:0;margin-top:2px;min-width:88px;text-align:center;}
.changelog-title{font-weight:600;font-size:13.5px;margin-bottom:3px;}
.changelog-desc{font-size:12.5px;color:var(--text-dim);line-height:1.5;}

/* BADGES / ACHIEVEMENTS */
.badge-mini-row{display:flex;align-items:center;gap:3px;cursor:pointer;}
.badge-mini{font-size:16px;line-height:1;}
.badge-mini-more{font-size:10.5px;color:var(--text-faint);font-weight:600;margin-left:2px;}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
.badge-tile{border:1px solid var(--border);border-radius:10px;padding:14px 10px;text-align:center;background:var(--surface-2);}
.badge-tile.locked{opacity:.35;filter:grayscale(1);}
.badge-tile.unlocked{border-color:var(--gold);background:var(--gold-dim);}
.badge-emoji{font-size:28px;margin-bottom:6px;}
.badge-tile-label{font-size:11px;font-weight:600;line-height:1.3;}

/* RÉGULARITÉ DES PAYOUTS */
.reg-score-panel{display:flex;align-items:center;gap:18px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:18px;}
.reg-score-ring{position:relative;width:84px;height:84px;flex:none;}
.reg-score-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.reg-score-ring-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;}
.reg-score-label{font-size:15px;font-weight:700;margin-bottom:3px;}
.reg-score-sub{font-size:12px;color:var(--text-dim);}
.reg-stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;}
.reg-stat{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:11px 13px;}
.reg-stat-val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17px;}
.reg-stat-lbl{font-size:10.5px;color:var(--text-faint);margin-top:2px;text-transform:uppercase;letter-spacing:.03em;}
.reg-heatmap-title{font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:10px;text-transform:uppercase;letter-spacing:.03em;}
.reg-heatmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px;}
.reg-cell{border-radius:8px;padding:9px 6px;text-align:center;border:1px solid var(--border);background:var(--surface-2);}
.reg-cell-month{font-size:10px;color:var(--text-faint);text-transform:capitalize;}
.reg-cell-count{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;margin-top:3px;}
.reg-legend{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;color:var(--text-faint);}
.reg-legend-swatch{width:12px;height:12px;border-radius:3px;display:inline-block;}

/* NOTES / JOURNAL */
.note-row{border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px;}
.note-meta{display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:6px;}
.note-author{font-weight:600;color:var(--text-dim);}
.note-meta button{margin-left:auto;}
.note-text{font-size:13px;line-height:1.5;white-space:pre-wrap;}
.firm-logo{border-radius:6px;object-fit:contain;background:var(--surface-2);padding:2px;flex-shrink:0;vertical-align:middle;}
.yt-play-overlay:hover{background:rgba(0,0,0,0.28) !important;}
.firm-avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:#fff;font-weight:700;flex-shrink:0;vertical-align:middle;letter-spacing:-.5px;}
.firm-picker{display:flex;flex-wrap:wrap;gap:7px;}
.firm-pick{display:flex;align-items:center;gap:7px;padding:6px 11px 6px 6px;border:1.5px solid var(--border);border-radius:9px;font-size:12.5px;cursor:pointer;background:var(--surface-2);transition:.12s;}
.firm-pick:hover{border-color:var(--accent);}
.firm-pick.selected{border-color:var(--accent);background:var(--accent-dim);font-weight:600;}
.firm-name-inline{display:inline-flex;align-items:center;gap:6px;}

/* IMPORT PROPDESK */
.import-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.import-summary .chip{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text-dim);}
.import-summary .chip b{color:var(--text);font-family:'JetBrains Mono',monospace;}
.import-warn{background:var(--gold-dim);border:1px solid var(--gold);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;color:var(--text);}
.import-warn.danger{background:var(--danger-dim);border-color:var(--danger);}
.import-warn-title{font-weight:600;font-size:12.5px;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.import-warn ul{margin:4px 0 0;padding-left:18px;font-size:11.5px;color:var(--text-dim);max-height:110px;overflow:auto;}
.import-warn ul li{margin-bottom:2px;}
.import-empty{text-align:center;padding:30px 0;color:var(--text-faint);font-size:13px;}
.import-trader-group{border:1px solid var(--border);border-radius:9px;margin-bottom:10px;overflow:hidden;}
.import-trader-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);cursor:pointer;user-select:none;}
.import-trader-head input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
.import-trader-name{font-weight:600;font-size:13px;}
.import-trader-count{margin-left:auto;font-size:11px;color:var(--text-faint);}
.import-acc-list{padding:4px 12px 8px 34px;}
.import-acc-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.import-acc-row:last-child{border-bottom:none;}
.import-acc-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
.import-acc-row.is-dup{opacity:.65;}
.import-acc-main{flex:1;min-width:0;}
.import-acc-sub{color:var(--text-faint);font-size:11px;margin-top:1px;}

/* SUPPRESSION TRADER (sélection cascade) */
.del-tr-warn{background:var(--danger-dim);border:1px solid var(--danger);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:12.5px;color:var(--text);display:flex;gap:10px;align-items:flex-start;}
.del-tr-warn svg{width:16px;height:16px;flex-shrink:0;color:var(--danger);margin-top:1px;}
.del-tr-section{margin-bottom:16px;}
.del-tr-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.del-tr-section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);}
.del-tr-selectall{font-size:11.5px;color:var(--accent);cursor:pointer;background:none;border:none;font-family:inherit;padding:0;}
.del-tr-list{border:1px solid var(--border);border-radius:9px;overflow:hidden;}
.del-tr-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.del-tr-row:last-child{border-bottom:none;}
.del-tr-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--danger);cursor:pointer;flex-shrink:0;margin-top:2px;}
.del-tr-row-main{flex:1;min-width:0;}
.del-tr-row-title{font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.del-tr-row-sub{color:var(--text-faint);font-size:11px;margin-top:2px;}
.del-tr-row-tag{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--text-dim);}
.del-tr-row.is-unchecked{opacity:.55;}
.del-tr-status{font-size:12.5px;font-weight:600;padding:10px 14px;border-radius:8px;margin-top:2px;}
.del-tr-status.blocked{background:var(--gold-dim);color:var(--gold);}
.del-tr-status.ready{background:var(--danger-dim);color:var(--danger);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-soft);}
.modal-head h3{margin:0;font-size:15px;}
.modal-body{padding:18px 20px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border-soft);}
.close-x{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);border:none;background:transparent;}
.close-x:hover{background:var(--surface-2);color:var(--text);}
.close-x svg{width:15px;height:15px;}

/* FORM */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:7px;font-size:13px;font-family:inherit;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-hint{font-size:11px;color:var(--text-faint);margin-top:4px;}
.radio-group{display:flex;gap:8px;}
.radio-chip{flex:1;text-align:center;padding:9px 8px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);font-size:12.5px;font-weight:600;color:var(--text-dim);}
.radio-chip.selected{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
.error-text{color:var(--danger);font-size:11.5px;margin-top:5px;}

/* ACCOUNT ROW CARD */
.acc-card{border:1px solid var(--border);border-left:3px solid var(--rail,var(--slate));border-radius:9px;padding:14px 16px;margin-bottom:10px;background:var(--surface);}
.acc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.acc-title{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;}
.acc-meta{font-size:11.5px;color:var(--text-faint);margin-top:3px;}
.acc-actions{display:flex;gap:6px;flex-wrap:wrap;}
.acc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:12px;}
.acc-field-label{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;}
.acc-field-value{font-size:13px;margin-top:2px;font-family:'JetBrains Mono',monospace;}
.link-parent{font-size:11px;color:var(--text-dim);margin-top:8px;display:flex;align-items:center;gap:5px;}
.link-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;border:1px solid currentColor;cursor:pointer;background:transparent;}
.link-tag svg{width:11px;height:11px;flex-shrink:0;}
.link-tag:hover{filter:brightness(1.15);}
.acc-card{transition:box-shadow .3s ease, border-color .3s ease;}
.acc-card.flash-highlight{box-shadow:0 0 0 2px var(--flash-color,var(--gold));border-color:var(--flash-color,var(--gold));}
.alert-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);cursor:pointer;}
.alert-row:last-child{border-bottom:none;}
.alert-row:hover{background:var(--surface-2);margin:0 -18px;padding:9px 18px;}
.alert-dot{width:8px;height:8px;border-radius:50%;background:var(--dot,var(--slate));flex-shrink:0;}
.alert-label{font-size:13px;font-weight:600;}
.alert-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
.alert-goto{margin-left:auto;color:var(--text-faint);width:16px;height:16px;flex-shrink:0;}

/* CALENDRIER MENSUALITÉS */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-grid-head{margin-bottom:6px;}
.cal-head-cell{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);text-align:center;font-weight:600;padding-bottom:2px;}
.cal-cell{border:1px solid var(--border-soft);border-radius:8px;min-height:78px;padding:6px;background:var(--surface-2);}
.cal-cell-empty{border:none;background:transparent;}
.cal-cell-today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.cal-cell-has{cursor:pointer;}
.cal-cell-has:hover{background:var(--surface-3);}
.cal-daynum{font-size:11.5px;font-weight:600;color:var(--text-dim);}
.cal-day-items{margin-top:4px;display:flex;flex-direction:column;gap:2px;}
.cal-chip{font-size:10px;padding:2px 5px;border-radius:5px;background:var(--slate-dim);color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-chip-accent{background:var(--accent-dim);color:var(--accent);}
.cal-chip-gold{background:var(--gold-dim);color:var(--gold);}
.cal-chip-danger{background:var(--danger-dim);color:var(--danger);}
.cal-chip-slate{background:var(--slate-dim);color:var(--slate);}
.cal-chip-more{font-size:10px;color:var(--text-faint);}
.cal-day-total{margin-top:3px;font-size:10px;font-weight:700;color:var(--text-dim);}
@media (max-width:760px){
  .cal-cell{min-height:52px;padding:4px;}
  .cal-chip{display:none;}
  .cal-day-total{font-size:9px;}
}

/* CLASSEMENT (leaderboard) */
.lb-podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end;}
.lb-podium-card{border:1px solid var(--border);border-radius:10px;padding:18px 12px;text-align:center;background:var(--surface-2);}
.lb-rank-1{order:2;border-color:var(--gold);background:var(--gold-dim);transform:scale(1.045);}
.lb-rank-2{order:1;}
.lb-rank-3{order:3;}
.lb-medal{font-size:30px;line-height:1;}
.lb-pseudo{font-weight:700;font-size:14px;margin-top:8px;}
.lb-amount{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;color:var(--accent);margin-top:5px;}
.lb-sub{font-size:11px;color:var(--text-faint);margin-top:5px;}
@media (max-width:760px){
  .lb-podium{grid-template-columns:1fr;}
  .lb-rank-1,.lb-rank-2,.lb-rank-3{order:initial;transform:none;}
}

/* TOASTS */
#toast-root{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{background:var(--surface-3);border:1px solid var(--border);border-left:3px solid var(--accent);color:var(--text);padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);min-width:220px;animation:slideIn .15s ease;}
.toast.danger{border-left-color:var(--danger);}
.plan-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px;}
.badge-free{background:var(--slate-dim);color:var(--slate);}
.badge-premium{background:var(--gold-dim);color:var(--gold);}
.badge-admin{background:var(--accent-dim);color:var(--accent);}
.upgrade-cta{display:inline-flex;align-items:center;gap:6px;background:var(--gold-dim);color:var(--gold);border:1px solid rgba(217,166,90,0.35);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:filter .12s;}
.upgrade-cta:hover{filter:brightness(1.15);}
.locked-feature{position:relative;filter:grayscale(.5);opacity:.7;}
.locked-feature::after{content:'';position:absolute;inset:0;cursor:pointer;}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

/* CHART */
.chart-legend{display:flex;gap:16px;font-size:11.5px;color:var(--text-dim);margin-top:10px;}
.chart-legend span{display:flex;align-items:center;gap:6px;}
.legend-dot{width:8px;height:8px;border-radius:2px;}

/* MISC */
.pill-select{display:flex;gap:6px;}
.tag-pseudo{background:var(--surface-3);padding:2px 8px;border-radius:5px;font-size:11.5px;font-weight:600;}
.text-dim{color:var(--text-dim);}
.text-faint{color:var(--text-faint);}
.mt-2{margin-top:8px}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px;color:var(--text-dim);font-size:13px;}
.spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--accent);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width: 880px){
  .sidebar{width:64px;padding:16px 8px;}
  .brand-name,.brand-sub,.nav-label{display:none;}
  .nav-item{justify-content:center;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .acc-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
  .field-row{grid-template-columns:1fr;}
}
@media (max-width: 520px){
  .topbar{padding:14px 16px;flex-wrap:wrap;gap:10px;}
  .content{padding:16px 16px 60px;}
  .acc-top{flex-direction:column;align-items:stretch;}
  .acc-actions{width:100%;}
  table{font-size:12px;}
}
</style>
</head>

// Trader dont l'email correspond à l'email de connexion de l'utilisateur actuel :
// sert à caler automatiquement les filtres et la création de compte sur "son" trader.
function myLinkedTrader(){
  if(!state.session) return null;
  const email = (state.session.user.email||'').toLowerCase();
  if(!email) return null;
  return state.traders.find(t=>t.email && t.email.toLowerCase()===email) || null;
}
// Applique ce trader par défaut sur tous les filtres "trader" existants, une seule fois
// à la connexion (sans écraser un filtre déjà modifié manuellement par l'utilisateur).
function applyMyTraderDefaultFilters(){
  const t = myLinkedTrader();
  if(!t) return;
  if(!state.filters.dashboard.trader.length) state.filters.dashboard.trader = [t.id];
  if(!state.filters.accounts.trader.length) state.filters.accounts.trader = [t.id];
  if(!state.filters.accounting.trader.length) state.filters.accounting.trader = [t.id];
  if(!state.filters.bilan.trader.length) state.filters.bilan.trader = [t.id];
  if(!state.filters.calendrier.trader.length) state.filters.calendrier.trader = [t.id];
}
// Applique la même sélection de trader(s) à TOUS les filtres "trader" de l'app
// (Dashboard, Comptes, Comptabilité, Bilan, Calendrier), pour que le choix se propage partout.
function setTraderFilterEverywhere(traderIds){
  const ids = Array.isArray(traderIds) ? traderIds : (traderIds ? [traderIds] : []);
  state.filters.dashboard.trader = ids;
  state.filters.accounts.trader = ids;
  state.filters.accounting.trader = ids;
  state.filters.bilan.trader = ids;
  state.filters.calendrier.trader = ids;
}
function isAdmin(){ return !!(state.profile && state.profile.role === 'ADMIN'); }
function isMine(item){ return item.createdBy === currentUserId(); }
function canEdit(item){ return isAdmin() || isMine(item); }

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

// Conversion camelCase (état JS) <-> snake_case (colonnes Postgres/Supabase)
function toRow(obj){
  const out = {};
  for(const k in obj){ out[k.replace(/[A-Z]/g, m=>'_'+m.toLowerCase())] = obj[k]; }
  return out;
}
function fromRow(row){
  const out = {};
  for(const k in row){ out[k.replace(/_([a-z])/g, (_,c)=>c.toUpperCase())] = row[k]; }
  return out;
}

async function loadAll(){
  if(!SUPABASE_CONFIGURED) return;
  for(const t of TABLES){
    const { data, error } = await supabaseClient.from(t).select('*');
    if(error){ showToast('Erreur de chargement (' + t + ') : ' + error.message, 'danger'); state[t] = []; }
    else{ state[t] = data.map(fromRow); }
  }
}
// Tables soumises aux droits créateur/admin (lecture libre pour tous, écriture restreinte)
const OWNED_TABLES = ['traders','propfirms','accounts','payouts','account_notes','yt_sessions','market_prep'];

/* ============================================================
   RÉGLAGES GLOBAUX (Admin) : visibilité des pages + annonce
   Stockés dans la table Supabase 'app_settings' (une ligne, key='global',
   value=jsonb). Lecture libre pour tout utilisateur connecté (RLS SELECT),
   écriture réservée aux admins (RLS UPDATE/INSERT). Voir app_settings.sql.
============================================================ */
// Chargée pour TOUT utilisateur connecté (pas seulement les admins) car elle
// pilote ce que chacun voit dans la navigation et la bannière d'annonce.
async function loadAppSettings(){
  if(!SUPABASE_CONFIGURED) return;
  const { data, error } = await supabaseClient.from('app_settings').select('*').eq('key','global').maybeSingle();
  if(error){
    // Table absente ou policy manquante : on reste sur les valeurs par défaut, en silence
    // pour les non-admins ; on prévient l'admin pour qu'il pense à créer la table.
    if(isAdmin()) console.warn('app_settings introuvable ou inaccessible :', error.message);
    return;
  }
  if(data && data.value){
    state.appSettings = {
      hiddenPages: Array.isArray(data.value.hiddenPages) ? data.value.hiddenPages : [],
      announcement: { enabled:false, message:'', type:'info', ...(data.value.announcement||{}) },
    };
  }
}
async function saveAppSettings(successMessage){
  if(!isAdmin()) return false;
  const payload = { key:'global', value: { hiddenPages: state.appSettings.hiddenPages, announcement: state.appSettings.announcement }, updated_at: new Date().toISOString() };
  const { error } = await supabaseClient.from('app_settings').upsert(payload, { onConflict:'key' });
  if(error){
    showToast("Impossible d'enregistrer les réglages : " + error.message + " — la table 'app_settings' existe-t-elle bien dans Supabase ? Voir app_settings.sql.", 'danger');
    return false;
  }
  if(successMessage) showToast(successMessage);
  return true;
}
// Pages qu'un admin peut masquer pour les autres utilisateurs (Dashboard et Admin restent
// toujours accessibles, pour ne jamais se retrouver bloqué hors de l'application).
const HIDEABLE_PAGE_IDS = ['traders','propfirms','accounts','calendrier','accounting','bilan','sessions','meteo','comparatif','classement','changelog','subscription','manuel','confidentialite'];
async function toggleHiddenPage(pageId){
  if(!isAdmin() || !HIDEABLE_PAGE_IDS.includes(pageId)) return;
  const hidden = new Set(state.appSettings.hiddenPages);
  const willHide = !hidden.has(pageId);
  if(willHide) hidden.add(pageId); else hidden.delete(pageId);
  const prev = state.appSettings.hiddenPages;
  state.appSettings.hiddenPages = [...hidden];
  const ok = await saveAppSettings();
  if(!ok){ state.appSettings.hiddenPages = prev; renderView(); return; }
  const label = (BASE_NAV.find(n=>n.id===pageId)||{}).label || pageId;
  await logActivity('SETTINGS', 'app_settings', pageId, `Page "${label}" ${willHide?'masquée pour':'réaffichée à'} tous les utilisateurs non-admin`);
  showToast(`Page « ${label} » ${willHide?'masquée':'réaffichée'}.`);
  render();
}
async function saveAnnouncement(enabled, message, type){
  if(!isAdmin()) return;
  const prev = state.appSettings.announcement;
  state.appSettings.announcement = { enabled, message: (message||'').trim(), type: type||'info' };
  const ok = await saveAppSettings();
  if(!ok){ state.appSettings.announcement = prev; render(); return; }
  await logActivity('SETTINGS', 'app_settings', 'announcement', enabled ? `Bannière d\u2019annonce activée : "${state.appSettings.announcement.message}"` : 'Bannière d\u2019annonce désactivée');
  showToast('Message global mis à jour.');
  render(); // la bannière est rendue par render(), pas renderView()
}

async function upsert(collection, item){
  const arr = state[collection];
  const idx = arr.findIndex(x=>x.id===item.id);
  // Garde-fou côté interface (défense en profondeur) : la vraie sécurité est appliquée par les
  // policies RLS Supabase — voir rls_policies.sql. L'interface ne doit jamais être la seule sécurité.
  if(idx>=0 && OWNED_TABLES.includes(collection) && !canEdit(arr[idx])){
    showToast("Vous n'êtes pas autorisé à modifier cet enregistrement (créé par un autre utilisateur).", 'danger');
    return;
  }
  if(idx>=0) arr[idx] = item; else arr.push(item);
  const row = toRow(item);
  let { error } = await supabaseClient.from(collection).upsert(row);
  if(error){
    // Repli : si Supabase signale une colonne manquante (schéma pas encore migré,
    // ex. "ai_prompt" absent de la table market_prep), on retente sans ce champ
    // plutôt que de perdre toute la sauvegarde — le reste des données est conservé.
    const missingColMatch = /Could not find the '([a-z0-9_]+)' column/i.exec(error.message || '');
    if(missingColMatch && missingColMatch[1] in row){
      const missingCol = missingColMatch[1];
      const rowWithoutCol = { ...row };
      delete rowWithoutCol[missingCol];
      const retry = await supabaseClient.from(collection).upsert(rowWithoutCol);
      if(!retry.error){
        showToast(`Enregistré, mais le champ "${missingCol}" n'a pas pu être sauvegardé : cette colonne n'existe pas encore dans la table Supabase "${collection}" (il faut l'ajouter via une migration SQL).`);
        return;
      }
      error = retry.error;
    }
    // Autre repli si le serveur (RLS) refuse l'opération malgré la vérification côté interface
    if(idx>=0) await loadAll();
    showToast('Erreur de sauvegarde : ' + error.message, 'danger');
  }
}
async function remove(collection, id){
  const item = state[collection].find(x=>x.id===id);
  if(item && OWNED_TABLES.includes(collection) && !canEdit(item)){
    showToast("Vous n'êtes pas autorisé à supprimer cet enregistrement (créé par un autre utilisateur).", 'danger');
    return false;
  }
  state[collection] = state[collection].filter(x=>x.id!==id);
  const { error } = await supabaseClient.from(collection).delete().eq('id', id);
  if(error){
    await loadAll();
    showToast('Erreur de suppression : ' + error.message, 'danger');
    return false;
  }
  return true;
}
async function resetAllData(){
  for(const t of TABLES){
    const { error } = await supabaseClient.from(t).delete().not('id','is',null);
    if(error) showToast('Erreur de réinitialisation (' + t + ') : ' + error.message, 'danger');
    state[t] = [];
  }
}

async function loadProfilesAdmin(){

  if(error){ showToast('Erreur de chargement des utilisateurs : ' + error.message, 'danger'); return; }
  state.profiles = data.map(fromRow);
  // RLS bloque silencieusement (pas d'erreur renvoyée par Postgrest) : si un admin ne voit
  // que sa propre ligne (ou aucune), c'est le signe qu'il manque une policy SELECT admin
  // sur la table 'profiles' (idem sur 'subscriptions' plus bas).
  if(state.profiles.length <= 1){
    showToast("Seul ton propre profil est visible : il manque probablement une policy RLS SELECT pour les admins sur la table 'profiles' dans Supabase.", 'danger');
  }
  const { data: subs, error: subsErr } = await supabaseClient.from('subscriptions').select('*');
  if(!subsErr && subs){

    const byUser = {};
    state.allSubscriptions.forEach(s=>{ byUser[s.userId] = s; });
    state.profiles.forEach(p=>{ p.subscription = byUser[p.id] || null; });
  }
}

// Admin : bascule un utilisateur en Premium / Free / Lifetime.
// Met à jour profiles.role ET subscriptions en une seule action cohérente.
async function setUserPlan(userId, plan, billingCycle){
  if(!isAdmin()) return;
  const p = state.profiles.find(x=>x.id===userId);
  if(p && p.role==='ADMIN'){ showToast("Impossible de modifier le plan d'un ADMIN.", 'danger'); return; }

  const subPayload = {
    user_id: userId,
    plan,
    status: 'ACTIVE',
    billing_cycle: plan==='PREMIUM' ? (billingCycle||'LIFETIME') : null,
    started_at: new Date().toISOString(),
    expires_at: null,
  };
  const { error: subErr } = await supabaseClient.from('subscriptions').upsert(subPayload, { onConflict:'user_id' });
  if(subErr){ showToast('Erreur abonnement : ' + subErr.message, 'danger'); return; }

  const { error: roleErr } = await supabaseClient.from('profiles').update({ role: plan }).eq('id', userId);
  if(roleErr){ showToast('Erreur rôle : ' + roleErr.message, 'danger'); return; }

  if(p){
    p.role = plan;
    p.subscription = { ...(p.subscription||{}), plan, status:'ACTIVE', billingCycle: subPayload.billing_cycle };
  }
  await logActivity('ROLE_CHANGE', 'profile', userId, `Plan changé en ${plan}${subPayload.billing_cycle ? ' ('+subPayload.billing_cycle+')' : ''}`);
  showToast('Plan mis à jour.');
}
async function deleteUserProfile(userId, email){
  if(!isAdmin()) return;
  if(userId===currentUserId()){ showToast('Impossible de te supprimer toi-même.', 'danger'); return; }
  const { data, error } = await supabaseClient.from('profiles').delete().eq('id', userId).select();
  if(error){ showToast('Erreur de suppression : ' + error.message, 'danger'); return; }
  if(!data || data.length===0){
    showToast("Suppression bloquée par les règles de sécurité (RLS) de la table 'profiles' — aucune ligne n'a réellement été supprimée. Il faut ajouter une policy DELETE pour les admins dans Supabase.", 'danger');
    return;
  }
  state.profiles = state.profiles.filter(x=>x.id!==userId);
  await logActivity('DELETE', 'profile', userId, `Utilisateur supprimé : ${email||userId}`);
  showToast('Utilisateur supprimé de la liste.');
}
// Réattribue les comptes/payouts/notes d'un trader (ex: créés par un admin lors d'un import)
// au propriétaire réel du trader, pour que ce dernier puisse les modifier.
async function fixTraderOwnership(traderId){
  if(!isAdmin()) return;
  const trader = getTrader(traderId);
  if(!trader) return;
  let fixedAccounts=0, fixedPayouts=0, fixedNotes=0;
  const accs = state.accounts.filter(a=>a.traderId===traderId);
  for(const acc of accs){
    if(acc.createdBy !== trader.createdBy){
      await upsert('accounts', { ...acc, createdBy: trader.createdBy });
      fixedAccounts++;
    }
    const pays = state.payouts.filter(p=>p.accountId===acc.id);
    for(const p of pays){
      if(p.createdBy !== trader.createdBy){
        await upsert('payouts', { ...p, createdBy: trader.createdBy });
        fixedPayouts++;
      }
    }
    const notes = (state.account_notes||[]).filter(n=>n.accountId===acc.id);
    for(const n of notes){
      if(n.createdBy !== trader.createdBy){
        await upsert('account_notes', { ...n, createdBy: trader.createdBy });
        fixedNotes++;
      }
    }
  }
  await logActivity('UPDATE', 'trader', traderId, `Propriété réattribuée pour ${trader.pseudo} : ${fixedAccounts} compte(s), ${fixedPayouts} payout(s), ${fixedNotes} note(s).`);
  showToast(`Propriété corrigée : ${fixedAccounts} compte(s), ${fixedPayouts} payout(s), ${fixedNotes} note(s).`);
}

/* ============================================================
   SUPPRESSION D'UN TRADER AVEC DONNÉES LIÉES (comptes, payouts,
   notes, sessions live). Un trader ne peut pas être supprimé tant
   que des comptes lui sont rattachés (contrainte de clé étrangère).
   Cette modale liste tout ce qui est lié et laisse l'utilisateur
   sélectionner ce qu'il veut supprimer :
   - Comptes : cochés par défaut, supprimés avec leurs payouts et
     notes (cascade). Un compte non coché reste et bloque donc la
     suppression du trader lui-même.
   - Sessions live : cochées par défaut pour être supprimées ; si
     décochées, elles sont simplement détachées (traderId remis à
     vide) et conservées, car une session peut exister sans trader.
   Le trader n'est réellement supprimé que si, après l'opération,
   plus aucun compte ne lui est rattaché.
============================================================ */
function deleteTraderModal(trader){
  if(!trader) return;
  if(!canEdit(trader)){ showToast("Vous n'êtes pas autorisé à supprimer ce trader.", 'danger'); return; }

  const accs = state.accounts.filter(a=>a.traderId===trader.id);
  const sessions = state.yt_sessions.filter(s=>s.traderId===trader.id);

  // Rien de lié : suppression simple, sans modale de sélection.
  if(accs.length===0 && sessions.length===0){
    confirmModal(`Supprimer définitivement le trader <strong>${escapeHtml(trader.pseudo)}</strong> ?`, async ()=>{
      await remove('traders', trader.id);
      await logActivity('DELETE', 'trader', trader.id, trader.pseudo);
      showToast('Trader supprimé.'); render();
    });
    return;
  }

  const accRow = (a)=>{
    const nbPayouts = state.payouts.filter(p=>p.accountId===a.id).length;
    const nbNotes = (state.account_notes||[]).filter(n=>n.accountId===a.id).length;
    const firm = getFirm(a.propFirmId);
    return `<div class="del-tr-row" data-del-tr-acc-row="${a.id}">
      <input type="checkbox" data-del-tr-acc="${a.id}" checked />
      <div class="del-tr-row-main">
        <div class="del-tr-row-title">
          ${firm ? firm.name : 'PropFirm inconnue'}
          <span class="del-tr-row-tag">${TYPE_LABELS[a.type]||a.type}</span>
          <span class="badge ${statusBadgeClass(a)}">${statusLabel(a)}</span>
        </div>
        <div class="del-tr-row-sub">${nbPayouts} payout(s) · ${nbNotes} note(s) — seront supprimés avec ce compte</div>
      </div>
    </div>`;
  };
  const sessionRow = (s)=>`<div class="del-tr-row" data-del-tr-sess-row="${s.id}">
      <input type="checkbox" data-del-tr-sess="${s.id}" checked />
      <div class="del-tr-row-main">
        <div class="del-tr-row-title">${escapeHtml(s.title||'Sans titre')}</div>
        <div class="del-tr-row-sub" data-del-tr-sess-sub="${s.id}">${fmtDate(s.date)} — sera supprimée</div>
      </div>
    </div>`;

  openModal({
    title: `Supprimer ${escapeHtml(trader.pseudo)}`,
    wide: true,
    bodyHtml: `
      <div class="del-tr-warn">
        ${icon('alertTriangle')}
        <div>Ce trader a des données liées. Sélectionne ci-dessous ce que tu veux supprimer.
        Un compte décoché restera actif et empêchera la suppression du trader tant qu'il n'aura pas été retiré ou supprimé à son tour.</div>
      </div>
      ${accs.length>0 ? `
      <div class="del-tr-section">
        <div class="del-tr-section-head">
          <div class="del-tr-section-title">Comptes liés (${accs.length})</div>
          <button type="button" class="del-tr-selectall" id="del-tr-acc-toggle">Tout désélectionner</button>
        </div>
        <div class="del-tr-list">${accs.map(accRow).join('')}</div>
      </div>` : ''}
      ${sessions.length>0 ? `
      <div class="del-tr-section">
        <div class="del-tr-section-head">
          <div class="del-tr-section-title">Sessions live liées (${sessions.length})</div>
          <button type="button" class="del-tr-selectall" id="del-tr-sess-toggle">Tout désélectionner</button>
        </div>
        <div class="del-tr-list">${sessions.map(sessionRow).join('')}</div>
        <div class="field-hint">Une session décochée est conservée mais détachée de ce trader (session publique) plutôt que supprimée.</div>
      </div>` : ''}
      <div id="del-tr-status" class="del-tr-status"></div>
      <div id="del-tr-error" class="error-text"></div>
    `,
    footHtml: `<button class="btn btn-outline" id="del-tr-cancel">Annuler</button><button class="btn btn-danger" id="del-tr-run">Supprimer la sélection</button>`,
    onMount(){
      const statusEl = document.getElementById('del-tr-status');
      function accChecked(){ return accs.filter(a=>document.querySelector(`[data-del-tr-acc="${a.id}"]`)?.checked); }
      function accUnchecked(){ return accs.filter(a=>!document.querySelector(`[data-del-tr-acc="${a.id}"]`)?.checked); }
      function refreshStatus(){
        accs.forEach(a=>{
          const row = document.querySelector(`[data-del-tr-acc-row="${a.id}"]`);
          const cb = document.querySelector(`[data-del-tr-acc="${a.id}"]`);
          if(row && cb) row.classList.toggle('is-unchecked', !cb.checked);
        });
        sessions.forEach(s=>{
          const row = document.querySelector(`[data-del-tr-sess-row="${s.id}"]`);
          const cb = document.querySelector(`[data-del-tr-sess="${s.id}"]`);
          const sub = document.querySelector(`[data-del-tr-sess-sub="${s.id}"]`);
          if(row && cb) row.classList.toggle('is-unchecked', !cb.checked);
          if(sub) sub.textContent = `${fmtDate(s.date)} — ${cb && cb.checked ? 'sera supprimée' : 'sera détachée du trader (conservée)'}`;
        });
        const remaining = accUnchecked().length;
        const runBtn = document.getElementById('del-tr-run');
        if(remaining>0){
          statusEl.className = 'del-tr-status blocked';
          statusEl.textContent = `${remaining} compte(s) resteront liés — le trader ne sera pas supprimé, seuls les éléments cochés le seront.`;
          runBtn.textContent = 'Supprimer la sélection';
        } else {
          statusEl.className = 'del-tr-status ready';
          statusEl.textContent = `Tous les comptes sont sélectionnés — le trader ${trader.pseudo} sera définitivement supprimé.`;
          runBtn.textContent = `Supprimer le trader et la sélection`;
        }
      }
      document.querySelectorAll('[data-del-tr-acc],[data-del-tr-sess]').forEach(cb=>cb.addEventListener('change', refreshStatus));
      const accToggle = document.getElementById('del-tr-acc-toggle');
      if(accToggle) accToggle.onclick = ()=>{
        const all = accs.every(a=>document.querySelector(`[data-del-tr-acc="${a.id}"]`)?.checked);
        accs.forEach(a=>{ const cb = document.querySelector(`[data-del-tr-acc="${a.id}"]`); if(cb) cb.checked = !all; });
        accToggle.textContent = all ? 'Tout sélectionner' : 'Tout désélectionner';
        refreshStatus();
      };
      const sessToggle = document.getElementById('del-tr-sess-toggle');
      if(sessToggle) sessToggle.onclick = ()=>{
        const all = sessions.every(s=>document.querySelector(`[data-del-tr-sess="${s.id}"]`)?.checked);
        sessions.forEach(s=>{ const cb = document.querySelector(`[data-del-tr-sess="${s.id}"]`); if(cb) cb.checked = !all; });
        sessToggle.textContent = all ? 'Tout sélectionner' : 'Tout désélectionner';
        refreshStatus();
      };
      refreshStatus();

      document.getElementById('del-tr-cancel').onclick = closeModal;
      document.getElementById('del-tr-run').onclick = async ()=>{
        const runBtn = document.getElementById('del-tr-run');
        runBtn.disabled = true;
        const prevLabel = runBtn.textContent;
        runBtn.textContent = 'Suppression en cours…';
        try{
          const accIdsToDelete = accChecked().map(a=>a.id);
          const sessIdsToDelete = sessions.filter(s=>document.querySelector(`[data-del-tr-sess="${s.id}"]`)?.checked).map(s=>s.id);
          const sessIdsToDetach = sessions.filter(s=>!sessIdsToDelete.includes(s.id)).map(s=>s.id);
          const result = await runTraderCascadeDelete(trader, accIdsToDelete, sessIdsToDelete, sessIdsToDetach);
          closeModal();
          showToast(result.traderDeleted
            ? `Trader supprimé avec ${result.nbAccounts} compte(s), ${result.nbPayouts} payout(s), ${result.nbNotes} note(s), ${result.nbSessionsDeleted} session(s).`
            : `Éléments supprimés (${result.nbAccounts} compte(s)). Il reste des comptes liés à ${trader.pseudo} — retire-les pour pouvoir supprimer ce trader.`);
          render();
        }catch(e){
          document.getElementById('del-tr-error').textContent = 'Erreur : ' + e.message;
          runBtn.disabled = false;
          runBtn.textContent = prevLabel;
        }
      };
    }
  });
}

// account_status_history n'est pas chargée dans `state` (juste consultée à la
// demande), donc remove() ne peut pas la nettoyer. Contrainte
// account_status_history_account_id_fkey : il faut purger ces lignes
// nous-mêmes avant de supprimer le compte.
async function purgeStatusHistory(accountId){
  // On compte d'abord les lignes existantes : avec RLS, un DELETE qui ne matche
  // aucune policy renvoie "succès" (error === null) mais supprime 0 ligne.
  // Sans ce contrôle, l'appelant croit la purge faite et la suppression du
  // compte plante ensuite sur la contrainte de clé étrangère.
  const { count: before, error: countErr } = await supabaseClient
    .from('account_status_history')
    .select('id', { count:'exact', head:true })
    .eq('account_id', accountId);
  if(countErr){ console.warn('account_status_history count failed:', countErr.message); }
  if(!before){ return true; } // rien à purger

  const { data: deleted, error } = await supabaseClient
    .from('account_status_history')
    .delete()
    .eq('account_id', accountId)
    .select('id');
  if(error){
    throw new Error("Purge de l'historique de statut impossible : " + error.message);
  }
  if(!deleted || deleted.length < before){
    throw new Error(
      "La suppression de l'historique de statut (account_status_history) a été bloquée silencieusement, "
      + "probablement par une policy RLS Supabase manquante (DELETE). "
      + `${deleted ? deleted.length : 0}/${before} ligne(s) supprimée(s). `
      + "Il faut ajouter une policy DELETE pour les admins sur cette table."
    );
  }
  return true;
}

// Un compte PA référence son Challenge d'origine via parentChallengeId
// (contrainte accounts_parent_challenge_id_fkey). Avant de supprimer un
// compte, il faut détacher tout PA qui pointe encore vers lui, sinon la
// suppression échoue en base.
async function detachChildAccounts(accountId){
  const children = state.accounts.filter(a=>a.parentChallengeId===accountId);
  for(const c of children){
    await upsert('accounts', { ...c, parentChallengeId: null });
  }
}

async function runTraderCascadeDelete(trader, accIdsToDelete, sessIdsToDelete, sessIdsToDetach){
  let nbPayouts=0, nbNotes=0;
  for(const accId of accIdsToDelete){
    const acc = state.accounts.find(a=>a.id===accId);
    const pays = state.payouts.filter(p=>p.accountId===accId);
    for(const p of pays){
      const ok = await remove('payouts', p.id);
      if(!ok) throw new Error(`Impossible de supprimer un payout du compte ${acc?getFirm(acc.propFirmId)?.name||'':accId} (droits insuffisants ou erreur base de données). Suppression annulée pour ce compte.`);
      nbPayouts++;
    }
    const notes = (state.account_notes||[]).filter(n=>n.accountId===accId);
    for(const n of notes){
      const ok = await remove('account_notes', n.id);
      if(!ok) throw new Error(`Impossible de supprimer une note du compte ${acc?getFirm(acc.propFirmId)?.name||'':accId} (droits insuffisants ou erreur base de données). Suppression annulée pour ce compte.`);
      nbNotes++;
    }
    await detachChildAccounts(accId);
    await purgeStatusHistory(accId);
    const ok = await remove('accounts', accId);
    if(!ok) throw new Error(`Impossible de supprimer le compte ${acc?getFirm(acc.propFirmId)?.name||'':accId}.`);
  }
  if(accIdsToDelete.length>0){
    await logActivity('DELETE', 'account', null, `${accIdsToDelete.length} compte(s) supprimé(s) (${nbPayouts} payout(s), ${nbNotes} note(s)) lors de la suppression du trader ${trader.pseudo}`);
  }
  for(const sessId of sessIdsToDelete){
    const ok = await remove('yt_sessions', sessId);
    if(!ok) throw new Error(`Impossible de supprimer une session live liée à ${trader.pseudo}.`);
  }
  if(sessIdsToDelete.length>0){
    await logActivity('DELETE', 'yt_session', null, `${sessIdsToDelete.length} session(s) live supprimée(s) lors de la suppression du trader ${trader.pseudo}`);
  }
  for(const sessId of sessIdsToDetach){
    const s = state.yt_sessions.find(x=>x.id===sessId);
    if(s) await upsert('yt_sessions', { ...s, traderId: null });
  }
  const remainingAccounts = state.accounts.filter(a=>a.traderId===trader.id).length;
  let traderDeleted = false;
  if(remainingAccounts===0){
    await remove('traders', trader.id);
    await logActivity('DELETE', 'trader', trader.id, trader.pseudo);
    traderDeleted = true;
  }
  return { traderDeleted, nbAccounts: accIdsToDelete.length, nbPayouts, nbNotes, nbSessionsDeleted: sessIdsToDelete.length };
}

// Assigne un trader existant (fiche créée par l'admin, ex: lors d'une migration)
// au compte utilisateur réel d'un ami/trader, en le retrouvant par email parmi
// les utilisateurs déjà inscrits sur ce site (table profiles). Met à jour le
// created_by du trader PUIS cascade automatiquement vers ses comptes/payouts/notes.
async function assignTraderOwnerModal(trader){
  if(!isAdmin()) return;
  if(!state.profiles || state.profiles.length === 0){
    await loadProfilesAdmin();
  }
  const candidates = state.profiles.filter(p=>p.email);
  const preselected = trader.email
    ? candidates.find(p=>p.email.toLowerCase()===trader.email.toLowerCase())
    : null;
  openModal({
    title: `Assigner "${trader.pseudo}" à un compte utilisateur`,
    bodyHtml: `
      <p class="field-hint">Choisis le compte (déjà inscrit sur ce site) qui correspond à ce trader. Ses comptes, payouts et notes seront automatiquement réattribués dans la foulée.</p>
      <div class="field">
        <label>Compte utilisateur</label>
        <select id="ato-select">
          <option value="">— Choisir —</option>

// configurés côté Stripe / dans ta fonction /api/create-checkout-session).
const PRICING = {
  MONTHLY:  { amount: '9,90', period: '/mois' },
  YEARLY:   { amount: '90',  period: '/an', monthlyEquivalent: '7,50' },
  LIFETIME: { amount: '199', period: ' paiement unique' },
};

// Parsing/format des prix affichés en français ("9,90" -> 9.9 -> "9,90")
function parsePriceFr(str){ return parseFloat(String(str).replace(',', '.')) || 0; }
function formatPriceFr(num){
  const rounded = Math.round(num * 100) / 100;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(2).replace('.', ',');
}
// Applique un code promo { discountType:'PERCENT'|'FIXED', discountValue } à un prix affiché
function applyPromoToPrice(amountStr, promo){
  const base = parsePriceFr(amountStr);
  let discounted = promo.discountType === 'PERCENT' ? base * (1 - promo.discountValue/100) : base - promo.discountValue;
  if(discounted < 0) discounted = 0;
  return formatPriceFr(discounted);
}
// Valide un code promo via la fonction RPC Supabase (voir promo_codes.sql) : ne lit jamais
// la table promo_codes directement pour un non-admin, donc n'expose pas la liste des codes.
async function validatePromoCode(code){
  if(!code || !code.trim()) return { valid:false, reason:'Entre un code.' };
  const { data, error } = await supabaseClient.rpc('validate_promo_code', { p_code: code.trim() });
  if(error) return { valid:false, reason: 'Erreur de vérification : ' + error.message };
  const r = Array.isArray(data) ? data[0] : data;
  if(!r) return { valid:false, reason:'Code introuvable.' };
  return {
    valid: r.valid,
    reason: r.reason,
    discountType: r.discount_type,
    discountValue: r.discount_value,
    appliesTo: r.applies_to || [],
  };
}

    const promo = state.filters.tarifs.promoResult;
    const promoCode = (promo && promo.valid && promo.appliesTo.includes(billingCycle)) ? state.filters.tarifs.promoInput.trim().toUpperCase() : undefined;

      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization': 'Bearer ' + session.access_token },
      // ⚠️ promoCode est transmis pour info, mais la fonction Netlify /api/create-checkout-session
      // doit être mise à jour pour vraiment appliquer la réduction Stripe (voir promo_codes.sql,
      // section "backend"). Tant que ce n'est pas fait, le prix chargé par Stripe reste le plein tarif.
      body: JSON.stringify({ billingCycle, promoCode })

/* ============================================================
   HELPERS: format & date
============================================================ */
function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function authorLabel(userId){
  if(!userId) return 'Inconnu';
  if(userId===currentUserId()) return 'Moi';
  const p = state.profiles.find(x=>x.id===userId);
  return p ? (p.email || 'Utilisateur') : 'Utilisateur';
}
function fmtMoney(n){
  const v = Number(n)||0;
  return v.toLocaleString('fr-FR',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' $';
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
}
// Toutes les dates de l'app sont des chaînes calendaires "YYYY-MM-DD" (comme les <input type="date">).
// On évite volontairement Date.toISOString() pour tout calcul/génération de date : cette méthode convertit
// en UTC et peut décaler la date d'un jour (voire le mois) selon le fuseau horaire de l'utilisateur.
// -> on ne fait que de l'arithmétique calendaire pure (année/mois/jour), jamais de conversion UTC.
function pad2(n){ return String(n).padStart(2,'0'); }
function todayISO(){
  const d = new Date(); // date/heure LOCALE de l'utilisateur
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function monthKey(dateStr){ return dateStr.slice(0,7); } // YYYY-MM
function monthLabel(key){
  const [y,m] = key.split('-');
  const noms = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  return `${noms[Number(m)-1]} ${String(y).slice(2)}`;
}
function daysInMonth(y, m){ return new Date(y, m, 0).getDate(); } // m = 1-12, calcul calendaire local, sans UTC
function addMonths(dateStr, n){
  const [y, m, d] = dateStr.split('-').map(Number);
  const total = (m - 1) + n;
  const newY = y + Math.floor(total / 12);
  const newM = ((total % 12) + 12) % 12; // 0-11
  const lastDay = daysInMonth(newY, newM + 1);
  return `${newY}-${pad2(newM + 1)}-${pad2(Math.min(d, lastDay))}`;
}
function monthsBetweenCount(startStr, endStr){
  const [sy, sm] = startStr.split('-').map(Number);
  const [ey, em] = endStr.split('-').map(Number);
  return (ey - sy) * 12 + (em - sm);
}
// Nombre de jours calendaires (locaux) entre deux dates "YYYY-MM-DD"
function daysBetween(startStr, endStr){
  const a = new Date(startStr+'T00:00:00');
  const b = new Date(endStr+'T00:00:00');
  return Math.round((b - a) / 86400000);
}
// Prochaine échéance de mensualité (>= today) pour un compte en paiement mensuel
function nextMonthlyDueDate(purchaseDate, today){
  const n = monthsBetweenCount(purchaseDate, today);
  for(let k=Math.max(0,n-1); k<=n+2; k++){
    const d = addMonths(purchaseDate, k);
    if(d >= today) return d;
  }
  return null;
}

  if(acc.paymentType === 'UNIQUE'){
    if(acc.purchasePrice){
      lines.push({ id: acc.id+'-ACHAT', accountId: acc.id, type:'ACHAT', amount:Number(acc.purchasePrice), date: acc.purchaseDate });
    }
  } else if(acc.paymentType === 'MENSUEL'){
    if(acc.monthlyAmount){
      const n = monthsBetweenCount(acc.purchaseDate, stopDate);
      for(let i=0;i<=n;i++){
        const d = addMonths(acc.purchaseDate, i);
        if(d <= stopDate){
          lines.push({ id: acc.id+'-M-'+i, accountId: acc.id, type:'MENSUALITE', amount:Number(acc.monthlyAmount), date:d });
        }
      }
    }
  }
  if((acc.type === 'PA' || acc.type === 'LIVE') && acc.activationFee){
    lines.push({ id: acc.id+'-ACTIV', accountId: acc.id, type:'ACTIVATION', amount:Number(acc.activationFee), date: acc.activationDate || acc.purchaseDate });
  }
  return lines;
}
function computeAllExpenses(){
  return state.accounts.flatMap(computeAccountExpenses);
}
function totalPayoutsFor(accountId){
  return state.payouts.filter(p=>p.accountId===accountId).reduce((s,p)=>s+Number(p.amount),0);
}
function totalExpensesFor(accountId){
  return computeAccountExpenses(getAccount(accountId)).reduce((s,e)=>s+e.amount,0);
}

// Composant générique de filtre à choix multiple (case à cocher) — dropdown à bouton.
// options: [{v,l}], selected: array de valeurs, filterObj/openField: pour mémoriser l'état ouvert/fermé.
function renderMultiSelect(idPrefix, options, selected, placeholder, open){
  const label = !selected.length ? placeholder
    : selected.length===1 ? ((options.find(o=>o.v===selected[0])||{}).l || placeholder)
    : `${selected.length} sélectionnés`;
  return `
    <div class="status-multiselect" id="${idPrefix}-wrap">
      <button type="button" class="status-ms-btn" id="${idPrefix}-btn">${label} <span style="opacity:.6;font-size:10px;">▾</span></button>
      <div class="status-ms-menu" id="${idPrefix}-menu" style="display:${open?'flex':'none'};">
        ${options.map(o=>`<label class="status-ms-item"><input type="checkbox" data-ms-opt="${idPrefix}" value="${o.v}" ${selected.includes(o.v)?'checked':''}/>${o.l}</label>`).join('')}
        ${selected.length?`<button type="button" class="status-ms-clear" id="${idPrefix}-clear">Réinitialiser</button>`:''}
      </div>
    </div>`;
}
// Câble les interactions d'un renderMultiSelect() : filterObj[arrField] est le tableau de valeurs
// sélectionnées, filterObj[openField] mémorise l'état ouvert/fermé du menu entre les rendus.
function bindMultiSelectDropdown(idPrefix, filterObj, arrField, openField, onChange){
  const btn = document.getElementById(idPrefix+'-btn');
  if(!btn) return;
  btn.onclick = (e)=>{ e.stopPropagation(); filterObj[openField] = !filterObj[openField]; renderView(); };
  document.querySelectorAll(`[data-ms-opt="${idPrefix}"]`).forEach(cb=>{
    cb.onclick = e=>e.stopPropagation();
    cb.onchange = ()=>{
      const arr = filterObj[arrField];
      const idx = arr.indexOf(cb.value);
      if(cb.checked && idx===-1) arr.push(cb.value);
      else if(!cb.checked && idx!==-1) arr.splice(idx,1);
      if(onChange) onChange(arr.slice());
      renderView();
    };
  });
  const menu = document.getElementById(idPrefix+'-menu');
  if(menu) menu.onclick = e=>e.stopPropagation();
  const clearBtn = document.getElementById(idPrefix+'-clear');
  if(clearBtn) clearBtn.onclick = (e)=>{ e.stopPropagation(); filterObj[arrField] = []; if(onChange) onChange([]); renderView(); };
  if(filterObj[openField]){
    setTimeout(()=>{
      document.addEventListener('click', function closeMs(){
        filterObj[openField] = false;
        renderView();
        document.removeEventListener('click', closeMs);
      }, { once:true });
    }, 0);
  }
}

/* ============================================================
   ALERTES / RAPPELS (Dashboard)
============================================================ */
function computeDashboardAlerts(accountsF){
  const today = todayISO();
  const alerts = [];

  accountsF.forEach(a=>{
    const isChallengeActive = a.type==='CHALLENGE' && a.status==='ACTIF';
    const isFundedActive = (a.type==='PA' || a.type==='LIVE') && a.status==='ACTIF';
    if(!isChallengeActive && !isFundedActive) return;

    // 1) Mensualité à venir sous 7 jours
    if(a.paymentType==='MENSUEL' && a.monthlyAmount){
      const due = nextMonthlyDueDate(a.purchaseDate, today);
      if(due){
        const dLeft = daysBetween(today, due);
        if(dLeft>=0 && dLeft<=7){
          alerts.push({
            kind:'mensualite', severity: dLeft<=2?'danger':'gold', accountId:a.id,
            label: `Mensualité de ${fmtMoney(a.monthlyAmount)} due ${dLeft===0?'aujourd\u2019hui':(dLeft===1?'demain':`dans ${dLeft} jours`)}`,
            sub: `${getTrader(a.traderId)?.pseudo||'—'} · ${getFirm(a.propFirmId)?.name||'—'} · ${TYPE_LABELS[a.type]}`,
          });
        }
      }
    }
    // 2) PA/Live actif sans payout depuis longtemps (>30j, ou jamais depuis l'ouverture)
    if(isFundedActive){
      const payoutsAcc = state.payouts.filter(p=>p.accountId===a.id).sort((x,y)=>y.date.localeCompare(x.date));
      const refDate = payoutsAcc.length ? payoutsAcc[0].date : a.activationDate || a.purchaseDate;
      const gap = daysBetween(refDate, today);
      if(gap>30){
        alerts.push({
          kind:'payout-gap', severity:'slate', accountId:a.id,
          label: payoutsAcc.length ? `Aucun payout depuis ${gap} jours` : `Aucun payout depuis l\u2019ouverture (${gap} jours)`,
          sub: `${getTrader(a.traderId)?.pseudo||'—'} · ${getFirm(a.propFirmId)?.name||'—'} · ${TYPE_LABELS[a.type]}`,
        });
      }
    }
  });

  // Les plus urgentes en premier (danger > gold > slate)
  const order = { danger:0, gold:1, slate:2 };
  alerts.sort((x,y)=>order[x.severity]-order[y.severity]);
  return alerts;
}

let dashboardDelayDetails = {};
function viewDashboard(){
  const f = state.filters.dashboard;
  const accountsF = state.accounts.filter(a=>
    (!f.trader.length || f.trader.includes(a.traderId)) &&
    (!f.propfirm || a.propFirmId===f.propfirm)
  );
  const accIds = new Set(accountsF.map(a=>a.id));
  const alerts = computeDashboardAlerts(accountsF);

  const activeTraders = state.traders.filter(t=>t.status==='ACTIF').length;
  const challenges = accountsF.filter(a=>a.type==='CHALLENGE');
  const pas = accountsF.filter(a=>a.type==='PA');
  const lives = accountsF.filter(a=>a.type==='LIVE');
  const enCours = challenges.filter(a=>a.status==='ACTIF').length;
  const reussis = challenges.filter(a=>a.status==='REUSSI').length;
  const breachedCh = challenges.filter(a=>a.status==='BREACHED').length;
  const pasActifs = pas.filter(a=>a.status==='ACTIF').length;
  const livesActifs = lives.filter(a=>a.status==='ACTIF').length;
  const tauxReussite = (reussis+breachedCh)>0 ? Math.round(reussis/(reussis+breachedCh)*100) : 0;

  let allExpenses = computeAllExpenses().filter(e=>accIds.has(e.accountId));
  let payoutsF = state.payouts.filter(p=>accIds.has(p.accountId));
  if(f.month){
    allExpenses = allExpenses.filter(e=>monthKey(e.date)===f.month);
    payoutsF = payoutsF.filter(p=>monthKey(p.date)===f.month);
  }
  const totalExpenses = allExpenses.reduce((s,e)=>s+e.amount,0);
  const totalPayouts = payoutsF.reduce((s,p)=>s+Number(p.amount),0);
  const net = totalPayouts - totalExpenses;

  // last 6 months chart data — construits par arithmétique calendaire locale, jamais via toISOString (UTC)
  const allExpensesUnfiltered = computeAllExpenses().filter(e=>accIds.has(e.accountId));
  const payoutsUnfiltered = state.payouts.filter(p=>accIds.has(p.accountId));
  const months = [];
  const [ty, tm] = todayISO().split('-').map(Number);
  for(let i=5;i>=0;i--){
    const total = (tm - 1) - i;
    const y = ty + Math.floor(total/12);
    const m = ((total % 12) + 12) % 12;
    months.push(`${y}-${pad2(m+1)}`);
  }
  const chartData = months.map(mk=>{
    const exp = allExpensesUnfiltered.filter(e=>monthKey(e.date)===mk).reduce((s,e)=>s+e.amount,0);
    const pay = payoutsUnfiltered.filter(p=>monthKey(p.date)===mk).reduce((s,p)=>s+Number(p.amount),0);
    return { mk, exp, pay };
  });
  const maxVal = Math.max(1, ...chartData.map(d=>Math.max(d.exp,d.pay)));

  const recent = [...accountsF].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,5);

  // Délais moyens (payouts, breach, passage en PA) — on garde le détail par compte pour le drill-down.
  // Un délai négatif signifie une incohérence de dates (ex: payout daté avant l'ouverture du compte,
  // souvent parce que la date d'ouverture/activation a été corrigée après coup) : on l'exclut de la
  // moyenne mais on le laisse visible dans le détail, marqué comme anomalie.
  const paLiveAccs = accountsF.filter(a=>a.type==='PA'||a.type==='LIVE');
  const firstPayoutDetails = [];
  const payoutIntervalDetails = [];
  paLiveAccs.forEach(a=>{
    const payDates = state.payouts.filter(p=>p.accountId===a.id).map(p=>p.date).filter(Boolean).sort();
    if(payDates.length===0) return;
    const startDate = a.activationDate || a.purchaseDate;
    if(startDate){
      const days = daysBetween(startDate, payDates[0]);
      firstPayoutDetails.push({ account:a, from:startDate, to:payDates[0], days, anomaly:days<0 });
    }
    for(let i=1;i<payDates.length;i++){
      const days = daysBetween(payDates[i-1], payDates[i]);
      payoutIntervalDetails.push({ account:a, from:payDates[i-1], to:payDates[i], days, anomaly:days<0 });
    }
  });
  const avgDaysMetric = (items)=>{
    const valid = items.filter(it=>!it.anomaly);
    return valid.length ? Math.round(valid.reduce((s,it)=>s+it.days,0)/valid.length) : null;
  };
  const avgFirstPayoutDays = avgDaysMetric(firstPayoutDetails);
  const avgPayoutIntervalDays = avgDaysMetric(payoutIntervalDetails);

function fmtMoneyShort(n){
  const v = Number(n)||0;
  if(v===0) return '0';
  if(Math.abs(v)>=1000) return (v/1000).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1})+'k';
  return Math.round(v).toLocaleString('fr-FR');
}
function renderMiniChart(data, maxVal){
  const w=560,h=190,barW=22,gap=46,groupW=barW*2+8;
  let bars='';
  data.forEach((d,i)=>{
    const x = 30 + i*gap*2.4;
    const hExp = (d.exp/maxVal)*130;
    const hPay = (d.pay/maxVal)*130;
    bars += `<rect x="${x}" y="${150-hExp}" width="${barW}" height="${hExp}" rx="3" fill="var(--danger)" opacity="0.85"/>`;
    bars += `<rect x="${x+barW+4}" y="${150-hPay}" width="${barW}" height="${hPay}" rx="3" fill="var(--accent)" opacity="0.9"/>`;
    if(d.exp>0) bars += `<text x="${x+barW/2}" y="${Math.max(10,150-hExp-4)}" text-anchor="middle" font-size="9.5" fill="var(--danger)" font-family="JetBrains Mono, monospace">${fmtMoneyShort(d.exp)}</text>`;
    if(d.pay>0) bars += `<text x="${x+barW+4+barW/2}" y="${Math.max(10,150-hPay-4)}" text-anchor="middle" font-size="9.5" fill="var(--accent)" font-family="JetBrains Mono, monospace">${fmtMoneyShort(d.pay)}</text>`;
    bars += `<text x="${x+barW+2}" y="166" text-anchor="middle" font-size="10" fill="var(--text-faint)" font-family="JetBrains Mono, monospace">${monthLabel(d.mk)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:190px;overflow:visible;">${bars}</svg>`;
}

/* ============================================================
   RÉGULARITÉ DES PAYOUTS (fréquence uniquement, montants ignorés)
============================================================ */
function computePayoutRegularity(trader){
  const accs = state.accounts.filter(a=>a.traderId===trader.id);
  const accIds = new Set(accs.map(a=>a.id));
  const pays = state.payouts.filter(p=>accIds.has(p.accountId)).sort((a,b)=>a.date.localeCompare(b.date));
  if(pays.length===0){
    return { hasData:false, score:0, months:[] };
  }
  const firstMonth = monthKey(pays[0].date);
  const lastMonth = monthKey(todayISO());
  const totalMonths = monthsBetweenCount(firstMonth+'-01', lastMonth+'-01') + 1;

  const countByMonth = {};
  pays.forEach(p=>{ const mk = monthKey(p.date); countByMonth[mk] = (countByMonth[mk]||0)+1; });

  const allMonths = [];
  let cursor = firstMonth+'-01';
  for(let i=0;i<totalMonths;i++){ allMonths.push(monthKey(cursor)); cursor = addMonths(cursor,1); }

  const activeMonths = allMonths.filter(mk=>countByMonth[mk]).length;

  // Séries de mois actifs / trous
  let longestStreak=0, running=0, longestGap=0, gapRunning=0;
  allMonths.forEach(mk=>{
    if(countByMonth[mk]){ running++; gapRunning=0; longestStreak=Math.max(longestStreak, running); }
    else { running=0; gapRunning++; longestGap=Math.max(longestGap, gapRunning); }
  });
  let currentStreak=0;
  for(let i=allMonths.length-1;i>=0;i--){
    if(countByMonth[allMonths[i]]) currentStreak++; else break;
  }

  // Régularité de l'espacement entre payouts consécutifs (coefficient de variation des écarts en jours)
  let intervalScore = 100;
  if(pays.length>=2){
    const gaps=[];
    for(let i=1;i<pays.length;i++) gaps.push(daysBetween(pays[i-1].date, pays[i].date));
    const mean = gaps.reduce((s,g)=>s+g,0)/gaps.length;
    const variance = gaps.reduce((s,g)=>s+Math.pow(g-mean,2),0)/gaps.length;
    const cv = mean>0 ? Math.sqrt(variance)/mean : 0;
    intervalScore = Math.max(0, Math.round(100 - cv*100));
  }

  const densityScore = Math.round((activeMonths/totalMonths)*100);
  // Score combiné : densité des mois actifs (60%) + régularité des écarts entre payouts (40%)
  const score = pays.length>=2 ? Math.round(densityScore*0.6 + intervalScore*0.4) : densityScore;

  return { hasData:true, score, activeMonths, totalMonths, longestStreak, currentStreak, longestGap,
    allMonths, countByMonth, densityScore, intervalScore, nbPayouts: pays.length };
}
function regularityTier(score){
  if(score>=75) return { label:'Élevée', color:'var(--accent)' };
  if(score>=45) return { label:'Moyenne', color:'var(--gold)' };
  return { label:'Faible', color:'var(--danger)' };
}
function traderRegularityModal(trader){
  const r = computePayoutRegularity(trader);
  if(!r.hasData){
    openModal({
      title: `Régularité — ${trader.pseudo}`,
      bodyHtml: `<div class="empty-sub">Aucun payout enregistré pour ce trader pour le moment.</div>`,
      footHtml: `<button class="btn btn-outline" id="tr-close">Fermer</button>`,
      onMount(){ document.getElementById('tr-close').onclick = closeModal; }
    });
    return;
  }
  const tier = regularityTier(r.score);
  const circumference = 2*Math.PI*36;
  const dash = circumference * (r.score/100);

  const heatMonths = r.allMonths.slice(-12);
  const maxCount = Math.max(1, ...heatMonths.map(mk=>r.countByMonth[mk]||0));

  const heatCells = heatMonths.map(mk=>{
    const c = r.countByMonth[mk]||0;
    const intensity = c===0 ? 0 : Math.min(1, 0.35 + 0.65*(c/maxCount));
    const bg = c===0 ? 'var(--surface-2)' : `color-mix(in srgb, var(--accent) ${Math.round(intensity*100)}%, var(--surface-2))`;

  }).join('');

  openModal({
    title: `Régularité — ${trader.pseudo}`,
    wide: true,
    bodyHtml: `
      <div class="reg-score-panel">
        <div class="reg-score-ring">
