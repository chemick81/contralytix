/* ============================================================
   IMPORT PROPDESK (JSON) — Admin uniquement
   Lit l'export JSON de l'app Lovable "PropDesk", fait correspondre
   traders/PropFirms existants, relie les payouts aux bons comptes,
   et affiche un aperçu à cocher (par trader, comptes dessous) avec
   avertissements avant toute écriture en base.
============================================================ */
function pickPropDeskFile(){
  if(!isAdmin()){ showToast("Réservé aux administrateurs.", 'danger'); return; }
  const input = document.getElementById('propdesk-file-input');
  input.value = '';
  input.onchange = ()=>{
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      let json;
      try{ json = JSON.parse(reader.result); }
      catch(e){ showToast('Fichier JSON invalide : ' + e.message, 'danger'); return; }
      if(!json || (!Array.isArray(json.traders) && !Array.isArray(json.accounts))){
        showToast("Ce fichier ne ressemble pas à un export PropDesk (clés attendues : traders, propfirms, accounts, payouts).", 'danger');
        return;
      }
      try{
        const plan = buildImportPlan(json);
        openImportPropDeskModal(plan);
      }catch(e){
        showToast("Erreur lors de l'analyse du fichier : " + e.message, 'danger');
      }
    };
    reader.onerror = ()=> showToast('Impossible de lire le fichier.', 'danger');
    reader.readAsText(file);
  };
  input.click();
}

// Construit le plan de correspondance (traders / propfirms / comptes / payouts)
// sans écrire quoi que ce soit en base — pur calcul, pour l'aperçu.
function buildImportPlan(json){
  const norm = (s)=> (s||'').toString().trim().toLowerCase();

  const traderByPseudo = new Map(state.traders.map(t=>[norm(t.pseudo), t]));
  const firmByName = new Map(state.propfirms.map(f=>[norm(f.name), f]));

  const tradersPlan = [];
  const tradersByKey = new Map();
  function ensureTraderPlan(pseudo, src){
    const key = norm(pseudo);
    if(!key) return null;
    if(tradersByKey.has(key)) return tradersByKey.get(key);
    const existing = traderByPseudo.get(key);
    const plan = {
      pseudo: (src && src.pseudo) || pseudo,
      firstName: (src && src.firstName) || '',
      lastName: (src && src.lastName) || '',
      email: (src && src.email) || '',
      status: (src && src.status) || 'ACTIF',
      existing, isNew: !existing,
    };
    tradersPlan.push(plan); tradersByKey.set(key, plan);
    return plan;
  }
  (json.traders||[]).forEach(t=>ensureTraderPlan(t.pseudo, t));

  const firmsPlan = [];
  const firmsByKey = new Map();
  function ensureFirmPlan(name, src){
    const key = norm(name);
    if(!key) return null;
    if(firmsByKey.has(key)) return firmsByKey.get(key);
    const existing = firmByName.get(key);
    const plan = {
      name: (src && src.name) || name,
      website: (src && src.website) || '',
      notes: (src && src.notes) || '',
      existing, isNew: !existing,
    };
    firmsPlan.push(plan); firmsByKey.set(key, plan);
    return plan;
  }
  (json.propfirms||[]).forEach(f=>ensureFirmPlan(f.name, f));

  const existingAccKey = (a)=> [a.traderId,a.propFirmId,a.type,a.size,norm(a.accountNumber),a.purchaseDate||''].join('|');
  const existingKeys = new Set(state.accounts.map(existingAccKey));

  const accountsPlan = (json.accounts||[]).map((a, idx)=>{
    const traderPlan = ensureTraderPlan(a.traderPseudo, null) || ensureTraderPlan('(inconnu)', {pseudo:a.traderPseudo||'(inconnu)'});
    const firmPlan = ensureFirmPlan(a.propFirmName, null) || ensureFirmPlan('(inconnue)', {name:a.propFirmName||'(inconnue)'});
    const isDuplicate = !!(traderPlan.existing && firmPlan.existing &&
      existingKeys.has([traderPlan.existing.id, firmPlan.existing.id, a.type, a.size, norm(a.accountNumber), a.purchaseDate||''].join('|')));
    return { idx, raw:a, traderPlan, firmPlan, isDuplicate };
  });

  const payoutsPlan = (json.payouts||[]).map((p)=>{
    const accNum = norm(p.accountNumber);
    let matchedIdx = null;
    if(accNum){
      const hit = accountsPlan.find(ap=> norm(ap.raw.traderPseudo)===norm(p.traderPseudo) && norm(ap.raw.accountNumber)===accNum);
      if(hit) matchedIdx = hit.idx;
    }
    return { raw:p, matchedIdx };
  });

  // Regroupement par trader, uniquement les traders ayant au moins un compte importable
  const groupsByKey = new Map();
  accountsPlan.forEach(ap=>{
    const key = norm(ap.traderPlan.pseudo);
    if(!groupsByKey.has(key)) groupsByKey.set(key, { traderPlan: ap.traderPlan, accounts: [] });
    groupsByKey.get(key).accounts.push(ap);
  });
  const traderGroups = [...groupsByKey.values()].sort((a,b)=>a.traderPlan.pseudo.localeCompare(b.traderPlan.pseudo,'fr',{sensitivity:'base'}));

  return {
    exportedAt: json.exportedAt || null,
    tradersPlan, firmsPlan, accountsPlan, payoutsPlan, traderGroups,
  };
}

function importPropDeskSummaryHtml(plan){
  const newTraders = plan.traderGroups.filter(g=>g.traderPlan.isNew).length;
  const newFirms = new Set(plan.accountsPlan.filter(a=>a.firmPlan.isNew).map(a=>norm2(a.firmPlan.name))).size;
  const dupCount = plan.accountsPlan.filter(a=>a.isDuplicate).length;
  const matchedPayouts = plan.payoutsPlan.filter(p=>p.matchedIdx!=null).length;
  const unmatchedPayouts = plan.payoutsPlan.length - matchedPayouts;

  let warnings = '';
  if(dupCount>0){
    const items = plan.accountsPlan.filter(a=>a.isDuplicate).slice(0,20).map(a=>
      `<li>${a.traderPlan.pseudo} · ${a.firmPlan.name} · ${TYPE_LABELS[a.raw.type]||a.raw.type} · ${a.raw.accountNumber||'sans n°'}</li>`).join('');
    warnings += `<div class="import-warn">
      <div class="import-warn-title">${icon('alertTriangle')}${dupCount} compte(s) déjà présent(s) dans l'application</div>
      <div>Ces comptes semblent déjà exister (même trader, même PropFirm, même type/taille/n°). Ils sont décochés par défaut pour éviter les doublons — coche-les manuellement si tu veux forcer l'import quand même.</div>
      <ul>${items}</ul>
    </div>`;
  }
  if(unmatchedPayouts>0){
    const items = plan.payoutsPlan.filter(p=>p.matchedIdx==null).slice(0,20).map(p=>
      `<li>${p.raw.traderPseudo||'—'} · n° ${p.raw.accountNumber||'(vide)'} · ${fmtMoney(p.raw.amount)} le ${p.raw.date||'—'}</li>`).join('');
    warnings += `<div class="import-warn danger">
      <div class="import-warn-title">${icon('alertTriangle')}${unmatchedPayouts} payout(s) non relié(s) à un compte</div>
      <div>Aucun compte correspondant (trader + n° de compte) n'a été trouvé dans l'export pour ces payouts. Ils seront ignorés.</div>
      <ul>${items}</ul>
    </div>`;
  }

  const summary = `<div class="import-summary">
    <div class="chip">Traders : <b>${plan.traderGroups.length}</b> concerné(s), <b id="import-new-traders-count">${newTraders}</b> nouveau(x)</div>
    <div class="chip">PropFirms : <b>${newFirms}</b> nouvelle(s)</div>
    <div class="chip">Comptes : <b>${plan.accountsPlan.length}</b>, dont <b>${dupCount}</b> doublon(s) probable(s)</div>
    <div class="chip">Payouts : <b>${matchedPayouts}</b> relié(s), <b>${unmatchedPayouts}</b> non relié(s)</div>
  </div>`;

  return summary + warnings;
}
function norm2(s){ return (s||'').toString().trim().toLowerCase(); }

function importPropDeskChecklistHtml(plan){
  if(plan.traderGroups.length===0){
    return `<div class="import-empty">Aucun compte à importer dans ce fichier.</div>`;
  }
  const existingTradersSorted = [...state.traders].sort((a,b)=>a.pseudo.localeCompare(b.pseudo,'fr',{sensitivity:'base'}));
  return plan.traderGroups.map(g=>{
    const rows = g.accounts.map(ap=>{
      const a = ap.raw;
      const payoutCount = plan.payoutsPlan.filter(p=>p.matchedIdx===ap.idx).length;
      const badges = [];
      if(ap.isDuplicate) badges.push(`<span class="badge badge-gold">Doublon probable</span>`);
      else badges.push(`<span class="badge badge-accent">Nouveau</span>`);
      if(ap.firmPlan.isNew) badges.push(`<span class="badge badge-slate">PropFirm nouvelle</span>`);
      if(payoutCount>0) badges.push(`<span class="badge badge-slate">${payoutCount} payout(s)</span>`);
      return `<div class="import-acc-row ${ap.isDuplicate?'is-dup':''}">
        <input type="checkbox" data-import-acc="${ap.idx}" ${ap.isDuplicate?'':'checked'} />
        <div class="import-acc-main">
          <div>${firmLogoHtml(ap.firmPlan.existing||{name:ap.firmPlan.name},16)} ${ap.firmPlan.name} · ${TYPE_LABELS[a.type]||a.type} · ${sizeLabelRaw(a)} ${badges.join(' ')}</div>
          <div class="import-acc-sub">N° ${a.accountNumber||'—'} · ${STATUS_LABELS[a.status]||a.status} · achat ${fmtDate(a.purchaseDate)}</div>
        </div>
      </div>`;
    }).join('');
    const key = norm2(g.traderPlan.pseudo);
    const options = [`<option value="__new__" ${g.traderPlan.isNew?'selected':''}>+ Créer un nouveau trader "${g.traderPlan.pseudo}"</option>`]
      .concat(existingTradersSorted.map(t=>
        `<option value="${t.id}" ${(!g.traderPlan.isNew && g.traderPlan.existing && g.traderPlan.existing.id===t.id)?'selected':''}>→ Rattacher à : ${t.pseudo}${(t.firstName||t.lastName)?` (${t.firstName||''} ${t.lastName||''})`.trim():''}</option>`
      )).join('');
    return `<div class="import-trader-group" data-import-trader="${key}">
      <div class="import-trader-head">
        <input type="checkbox" data-import-trader-toggle="${key}" checked />
        <span class="import-trader-name">${g.traderPlan.pseudo}</span>
        <span class="import-trader-badge" data-import-trader-badge="${key}"></span>
        <select class="import-trader-map" data-import-trader-map="${key}" style="margin-left:8px;max-width:280px;font-size:12px;padding:4px 8px;" onclick="event.stopPropagation()">
          ${options}
        </select>
        <span class="import-trader-count">${g.accounts.length} compte(s)</span>
      </div>
      <div class="import-acc-list">${rows}</div>
    </div>`;
  }).join('');
}
function sizeLabelRaw(a){ return a.size==='AUTRE' ? fmtMoney(a.customSize) : (SIZE_LABELS[a.size]||a.size); }

function openImportPropDeskModal(plan){
  openModal({
    title: 'Importer un export PropDesk',
    wide: 'xwide',
    bodyHtml: `
      <div class="field-hint" style="margin-bottom:14px;">
        ${plan.exportedAt ? `Export généré le ${new Date(plan.exportedAt).toLocaleString('fr-FR')}.` : ''}
        Sélectionne les comptes à importer ci-dessous (coche/décoche un trader pour basculer tous ses comptes).
        Rien n'est écrit en base tant que tu n'as pas cliqué sur « Importer la sélection ».
      </div>
      ${importPropDeskSummaryHtml(plan)}
      <div id="import-checklist">${importPropDeskChecklistHtml(plan)}</div>
      <div id="import-error" class="error-text"></div>
    `,
    footHtml: `
      <span id="import-selected-count" class="field-hint" style="margin-right:auto;align-self:center;"></span>
      <button class="btn btn-outline" id="import-cancel">Annuler</button>
      <button class="btn btn-primary" id="import-confirm">Importer la sélection</button>
    `,
    onMount(){
      const root = document.getElementById('import-checklist');

      function updateTraderToggleState(pseudoKey){
        const group = root.querySelector(`.import-trader-group[data-import-trader="${CSS.escape(pseudoKey)}"]`);
        if(!group) return;
        const boxes = [...group.querySelectorAll('[data-import-acc]')];
        const toggle = group.querySelector('[data-import-trader-toggle]');
        const checkedCount = boxes.filter(b=>b.checked).length;
        toggle.checked = checkedCount>0 && checkedCount===boxes.length;
        toggle.indeterminate = checkedCount>0 && checkedCount<boxes.length;
      }
      function updateSelectedCount(){
        const total = root.querySelectorAll('[data-import-acc]').length;
        const checked = [...root.querySelectorAll('[data-import-acc]')].filter(b=>b.checked).length;
        document.getElementById('import-selected-count').textContent = `${checked} / ${total} compte(s) sélectionné(s)`;
      }
      function updateTraderBadge(key){
        const select = root.querySelector(`[data-import-trader-map="${CSS.escape(key)}"]`);
        const badge = root.querySelector(`[data-import-trader-badge="${CSS.escape(key)}"]`);
        if(!select || !badge) return;
        badge.innerHTML = select.value==='__new__'
          ? `<span class="badge badge-accent">Nouveau trader</span>`
          : `<span class="badge badge-slate">Rattaché à un trader existant</span>`;
      }
      function updateNewTraderCount(){
        const total = [...root.querySelectorAll('[data-import-trader-map]')].filter(s=>s.value==='__new__').length;
        const el = document.getElementById('import-new-traders-count');
        if(el) el.textContent = total;
      }

      root.querySelectorAll('[data-import-trader-toggle]').forEach(toggle=>{
        toggle.addEventListener('change', ()=>{
          const key = toggle.dataset.importTraderToggle;
          const group = root.querySelector(`.import-trader-group[data-import-trader="${CSS.escape(key)}"]`);
          group.querySelectorAll('[data-import-acc]').forEach(b=>{ b.checked = toggle.checked; });
          updateSelectedCount();
        });
      });
      root.querySelectorAll('[data-import-acc]').forEach(box=>{
        box.addEventListener('change', ()=>{
          const group = box.closest('.import-trader-group');
          updateTraderToggleState(group.dataset.importTrader);
          updateSelectedCount();
        });
      });
      root.querySelectorAll('[data-import-trader-map]').forEach(select=>{
        select.addEventListener('change', ()=>{
          updateTraderBadge(select.dataset.importTraderMap);
          updateNewTraderCount();
        });
        updateTraderBadge(select.dataset.importTraderMap);
      });
      root.querySelectorAll('.import-trader-group').forEach(g=>updateTraderToggleState(g.dataset.importTrader));
      updateSelectedCount();
      updateNewTraderCount();

      document.getElementById('import-cancel').onclick = closeModal;
      document.getElementById('import-confirm').onclick = async ()=>{
        const btn = document.getElementById('import-confirm');
        const selected = [...root.querySelectorAll('[data-import-acc]')].filter(b=>b.checked);
        if(selected.length===0){
          document.getElementById('import-error').textContent = 'Sélectionne au moins un compte à importer.';
          return;
        }
        const traderMapOverrides = new Map();
        root.querySelectorAll('[data-import-trader-map]').forEach(select=>{
          traderMapOverrides.set(select.dataset.importTraderMap, select.value);
        });
        btn.disabled = true;
        const original = btn.textContent;
        try{
          const result = await runPropDeskImport(plan, selected.map(b=>Number(b.dataset.importAcc)), traderMapOverrides);
          await logActivity('IMPORT', 'propdesk', 'import_'+Date.now(),
            `Import PropDesk : ${result.createdTraders} trader(s), ${result.createdFirms} propfirm(s), ${result.createdAccounts} compte(s), ${result.createdPayouts} payout(s) créés.`);
          showToast(`Import terminé : ${result.createdAccounts} compte(s) et ${result.createdPayouts} payout(s) importés.`);
          closeModal();
          if(state.route==='admin') loadAdminView(); else render();
        }catch(e){
          document.getElementById('import-error').textContent = "Erreur pendant l'import : " + e.message;
          btn.disabled = false; btn.textContent = original;
        }
      };
    }
  });
}

// Écrit réellement en base les traders / propfirms / comptes / payouts sélectionnés.
// traderMapOverrides : Map(cléTraderNormalisée -> id trader existant choisi, ou '__new__')
async function runPropDeskImport(plan, selectedIdxs, traderMapOverrides){
  const traderIdCache = new Map();
  const ownerIdCache = new Map();
  const firmIdCache = new Map();
  let createdTraders=0, createdFirms=0, createdAccounts=0, createdPayouts=0;

  for(const idx of selectedIdxs){
    const ap = plan.accountsPlan.find(x=>x.idx===idx);
    if(!ap) continue;
    const tKey = norm2(ap.traderPlan.pseudo);
    let traderId = traderIdCache.get(tKey);
    let ownerId = ownerIdCache.get(tKey);
    if(!traderId){
      const override = traderMapOverrides && traderMapOverrides.get(tKey);
      if(override && override!=='__new__'){
        // Rattaché manuellement à un trader existant du site (nom différent de l'export)
        traderId = override;
        const ownerTrader = state.traders.find(t=>t.id===override);
        ownerId = (ownerTrader && ownerTrader.createdBy) || currentUserId();
      } else if(!override && ap.traderPlan.existing){
        // Pas de sélection explicite (ne devrait pas arriver) : on retombe sur la correspondance automatique
        traderId = ap.traderPlan.existing.id;
        ownerId = ap.traderPlan.existing.createdBy || currentUserId();
      } else {
        const newTrader = {
          id: uid('trd'),
          firstName: ap.traderPlan.firstName || ap.traderPlan.pseudo,
          lastName: ap.traderPlan.lastName || '',
          pseudo: ap.traderPlan.pseudo,
          email: ap.traderPlan.email || '',
          status: ap.traderPlan.status==='INACTIF' ? 'INACTIF' : 'ACTIF',
          createdBy: currentUserId(),
        };
        await upsert('traders', newTrader);
        traderId = newTrader.id;
        ownerId = newTrader.createdBy;
        ap.traderPlan.existing = newTrader; // pour les prochains comptes du même trader
        createdTraders++;
      }
      traderIdCache.set(tKey, traderId);
      ownerIdCache.set(tKey, ownerId);
    }

    const fKey = norm2(ap.firmPlan.name);
    let firmId = firmIdCache.get(fKey);
    if(!firmId){
      if(ap.firmPlan.existing){
        firmId = ap.firmPlan.existing.id;
      } else {
        const newFirm = { id: uid('pf'), name: ap.firmPlan.name, website:'', notes:'', createdBy: currentUserId() };
        await upsert('propfirms', newFirm);
        firmId = newFirm.id;
        ap.firmPlan.existing = newFirm;
        createdFirms++;
      }
      firmIdCache.set(fKey, firmId);
    }

    const a = ap.raw;
    const newAccount = {
      id: uid('acc'),
      traderId, propFirmId: firmId,
      type: a.type, parentChallengeId: null,
      size: a.size, customSize: a.customSize || null,
      accountNumber: a.accountNumber || '',
      paymentType: a.paymentType || 'UNIQUE',
      purchasePrice: Number(a.purchasePrice)||0,
      monthlyAmount: (a.monthlyAmount!=null && a.monthlyAmount!=='') ? Number(a.monthlyAmount) : null,
      purchaseDate: a.purchaseDate || todayISO(),
      activationDate: a.activationDate || null,
      activationFee: Number(a.activationFee)||0,
      status: a.status,
      endDate: a.endDate || null,
      createdAt: new Date().toISOString(),
      createdBy: currentUserId(),
    };
    await upsert('accounts', newAccount);
    ap._createdAccountId = newAccount.id;
    createdAccounts++;
  }

  for(const p of plan.payoutsPlan){
    if(p.matchedIdx==null) continue;
    const ap = plan.accountsPlan.find(x=>x.idx===p.matchedIdx);
    if(!ap || !ap._createdAccountId) continue; // compte non sélectionné pour l'import
    const newPayout = {
      id: uid('pay'),
      accountId: ap._createdAccountId,
      amount: Number(p.raw.amount)||0,
      date: p.raw.paidDate || p.raw.date || todayISO(),
      note: p.raw.note || '',
      createdAt: new Date().toISOString(),
      createdBy: currentUserId(),
    };
    await upsert('payouts', newPayout);
    createdPayouts++;
  }

  return { createdTraders, createdFirms, createdAccounts, createdPayouts };
}

/* ============================================================
   SAUVEGARDE COMPLÈTE (JSON) — Admin
============================================================ */
function exportGlobalBackup(){
  const backup = {
    exportedAt: new Date().toISOString(),
    traders: state.traders,
    propfirms: state.propfirms,
    accounts: state.accounts,
    payouts: state.payouts,
    profiles: state.profiles,
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `sauvegarde_contralytix_${todayISO()}.json`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  showToast('Sauvegarde JSON téléchargée.');
}

/* ============================================================
   IMPORT DE MIGRATION (depuis l'ancien site) — Admin
   Lit un fichier JSON généré par "Sauvegarde JSON" sur l'ancien
   site (comptapropfirm.netlify.app) et upsert les 6 tables
   métier dans ce projet Supabase, dans l'ordre qui respecte les
   clés étrangères. Le champ created_by de CHAQUE ligne importée
   est forcé sur ton propre UUID (l'admin qui fait l'import), afin
   d'éviter tout created_by orphelin tant que les traders/associés
   n'ont pas encore leur propre compte sur ce nouveau site. Une
   fois qu'ils en ont un, réattribue via le bouton "🔗" prévu à
   cet effet sur la fiche trader.
============================================================ */
function pickMigrationFile(){
  if(!isAdmin()){ showToast("Réservé aux administrateurs.", 'danger'); return; }
  const input = document.getElementById('migration-file-input');
  input.value = '';
  input.onchange = ()=>{
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      let json;
      try{ json = JSON.parse(reader.result); }
      catch(e){ showToast('Fichier JSON invalide : ' + e.message, 'danger'); return; }
      if(!json || !Array.isArray(json.traders) || !Array.isArray(json.accounts)){
        showToast("Ce fichier ne ressemble pas à une sauvegarde de migration (clés attendues : traders, propfirms, accounts, payouts, account_notes, yt_sessions).", 'danger');
        return;
      }
      openMigrationImportModal(json);
    };
    reader.readAsText(file);
  };
  input.click();
}

function openMigrationImportModal(json){
  const counts = {
    propfirms: (json.propfirms||[]).length,
    traders: (json.traders||[]).length,
    accounts: (json.accounts||[]).length,
    payouts: (json.payouts||[]).length,
    account_notes: (json.account_notes||[]).length,
    yt_sessions: (json.yt_sessions||[]).length,
  };
  openModal({
    title: 'Importer la sauvegarde de migration',
    bodyHtml: `
      <p>Fichier généré le ${json.exportedAt ? new Date(json.exportedAt).toLocaleString() : 'date inconnue'}.</p>
      <ul>
        <li>${counts.propfirms} PropFirm(s)</li>
        <li>${counts.traders} trader(s)</li>
        <li>${counts.accounts} compte(s)</li>
        <li>${counts.payouts} payout(s)</li>
        <li>${counts.account_notes} note(s) de compte</li>
        <li>${counts.yt_sessions} session(s) YouTube</li>
      </ul>
      <p class="field-hint">Toutes ces lignes seront rattachées (created_by) à <strong>ton compte</strong> (${escapeHtml(state.session.user.email)}). Tu pourras réattribuer chaque trader plus tard, une fois qu'il aura son propre compte sur ce site.</p>
      <p class="field-hint">Les lignes existantes (même id) seront mises à jour, pas dupliquées — tu peux relancer l'import sans risque si une erreur survient en cours de route.</p>
      <div id="mi-error" class="error-text"></div>
    `,
    footHtml: `<button class="btn btn-outline" id="mi-cancel">Annuler</button><button class="btn btn-primary" id="mi-run">Lancer l'import</button>`,
    onMount(){
      document.getElementById('mi-cancel').onclick = closeModal;
      document.getElementById('mi-run').onclick = async ()=>{
        document.getElementById('mi-run').disabled = true;
        document.getElementById('mi-run').textContent = 'Import en cours…';
        try{
          const result = await runMigrationImport(json);
          closeModal();
          showToast(`Migration terminée : ${result.total} ligne(s) importée(s).`);
          await loadAll();
          render();
        }catch(e){
          document.getElementById('mi-error').textContent = 'Erreur : ' + e.message;
          document.getElementById('mi-run').disabled = false;
          document.getElementById('mi-run').textContent = "Lancer l'import";
        }
      };
    }
  });
}

// Ordre important : les tables parentes avant les tables qui les référencent.
const MIGRATION_TABLE_ORDER = ['propfirms', 'traders', 'accounts', 'payouts', 'account_notes', 'yt_sessions'];

async function runMigrationImport(json){
  const myId = currentUserId();
  let total = 0;
  for(const table of MIGRATION_TABLE_ORDER){
    const items = Array.isArray(json[table]) ? json[table] : [];
    if(items.length === 0) continue;
    const rows = items.map(item => toRow({ ...item, createdBy: myId }));
    const { error } = await supabaseClient.from(table).upsert(rows, { onConflict: 'id' });
    if(error){
      throw new Error(`table "${table}" (${items.length} ligne(s)) : ${error.message}`);
    }
    total += items.length;
    await logActivity('IMPORT_MIGRATION', table, null, `${items.length} ligne(s) importée(s) depuis l'ancien site`);
  }
  return { total };
}

/* ============================================================
   BOOT
============================================================ */
(async function boot(){
  if(!SUPABASE_CONFIGURED){
    document.getElementById('loading').innerHTML = `
      <div style="max-width:480px;text-align:center;padding:0 20px;">
        <div style="font-size:15px;font-weight:600;color:var(--text,#E8EDF2);margin-bottom:10px;">Configuration Supabase requise</div>
        <div style="font-size:13px;line-height:1.6;color:#8B98A5;">
          Ouvre le fichier <code>propfirm-app.html</code>, cherche <code>SUPABASE_URL</code> et <code>SUPABASE_ANON_KEY</code>
          tout en haut du script, et remplace-les par les valeurs de ton projet Supabase
          (Project Settings &gt; API). Voir le README fourni pour les étapes complètes.
        </div>
      </div>`;
    return;
  }
  let appStarted = false;
  async function enterApp(session){
    state.session = session;
    await loadProfile();
    await loadSubscription();
    computePermissions();
    await loadAll();
    await loadAppSettings();
    if(isAdmin()) await loadPromoCodesAdmin();
    applyMyTraderDefaultFilters();
    appStarted = true;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app-root').style.display = 'flex';
    render();
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if(session && !appStarted){ enterApp(session); }
    else if(session && appStarted){ state.session = session; }
    else if(!session){
      appStarted = false;
      state.session = null; state.profile = null; state.subscription = null; state.permissions = null;
      state.traders = []; state.propfirms = []; state.accounts = []; state.payouts = []; state.promo_codes = [];
      state.appSettings = { hiddenPages: [], announcement: { enabled:false, message:'', type:'info' } };
      document.getElementById('app-root').style.display = 'none';
      renderAuthScreen();
    }
  });

  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session){ await enterApp(session); }
  else { renderAuthScreen(); }
})();
</script>
