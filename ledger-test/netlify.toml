[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Le webhook Stripe doit recevoir le body brut : Netlify le fait par défaut
# pour les Functions classiques (pas besoin de config particulière ici).

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
